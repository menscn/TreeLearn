<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知芽（TreeLearn） · 高保真交互原型 v1</title>

<!-- React + Babel pinned（huashu-design 规范） -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ============ 设计系统 · 知芽「生长绿」 ============ */
:root{
  --bg:#F7F6F0;          /* 米白纸感底 */
  --surface:#FFFFFF;
  --ink:#1E2B23;         /* 深绿墨 */
  --ink2:#5A6B60;        /* 次级灰绿 */
  --ink3:#8A938E;        /* 弱化 */
  --line:#E6E3D6;
  --green:#2E7D4F;       /* 生长绿主色 */
  --green-deep:#1F5C38;
  --green-soft:#E3F0E7;
  --green-faint:#F0F7F1;
  --blue:#2F6BFF;        /* 未读蓝点（BASE-13 指定实心蓝点） */
  --amber:#B7791F;
  --amber-soft:#FBF3E2;
  --red:#C0392B;
  --red-soft:#FBEAE7;
  --serif:'Noto Serif SC','Songti SC','STSong',serif;
  --sans:'Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:var(--sans);color:var(--ink);background:#ECEAE0;
  background-image:radial-gradient(#d8d5c6 1px,transparent 1px);
  background-size:22px 22px;
}
#root{min-height:100vh;}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}
input,textarea{font-family:inherit;color:inherit;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:#C9C6B6;border-radius:4px;}

/* ============ 舞台（手机外） ============ */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:56px;padding:40px 24px;flex-wrap:wrap;}
.guide{width:300px;flex-shrink:0;}
.guide-brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.guide-brand .logo{width:34px;height:34px;color:var(--green);}
.guide-name{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--ink);}
.guide-sub{font-size:12px;color:var(--ink2);margin-bottom:22px;letter-spacing:.04em;}
.guide h3{font-size:12px;color:var(--green-deep);letter-spacing:.18em;margin:18px 0 10px;font-weight:700;}
.guide-steps{counter-reset:step;list-style:none;}
.guide-steps li{counter-increment:step;font-size:12.5px;color:var(--ink2);line-height:1.65;padding:7px 0 7px 30px;position:relative;border-bottom:1px dashed var(--line);}
.guide-steps li::before{content:counter(step);position:absolute;left:0;top:8px;width:20px;height:20px;border-radius:50%;background:var(--green-soft);color:var(--green-deep);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.guide-steps li b{color:var(--ink);font-weight:500;}
.legend{font-size:12px;color:var(--ink2);line-height:2;}
.legend .k{display:inline-flex;align-items:center;gap:6px;margin-right:14px;}
.legend .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);display:inline-block;}
.legend .anchor-sample{border-bottom:1.5px dashed var(--green);color:var(--green-deep);}
.legend .fork-sample{color:var(--green);font-weight:700;}

/* ============ 手机内通用 ============ */
.screen{height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;animation:screenIn .28s cubic-bezier(.2,.8,.2,1);}
@keyframes screenIn{from{opacity:0;transform:translateX(14px);}to{opacity:1;transform:none;}}
.appbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(247,246,240,.92);backdrop-filter:blur(6px);z-index:5;min-height:54px;}
.appbar .icon-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2);position:relative;transition:background .15s;}
.appbar .icon-btn:hover{background:var(--green-soft);color:var(--green-deep);}
.appbar .icon-btn .mini-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--blue);border:1.5px solid var(--bg);}
.appbar-title{flex:1;min-width:0;}
.appbar-title .t1{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.appbar-title .t2{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.body-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;}
.serif{font-family:var(--serif);}
.udot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex-shrink:0;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(47,107,255,.35);}50%{box-shadow:0 0 0 4px rgba(47,107,255,0);}}
.chip-type{font-size:10px;padding:2px 7px;border-radius:99px;background:var(--green-soft);color:var(--green-deep);font-weight:500;}
.chip-arch{font-size:10px;padding:2px 7px;border-radius:99px;background:#EDEBE2;color:var(--ink3);font-weight:500;}
.btn-primary{background:var(--green);color:#fff;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:500;transition:background .15s,transform .1s;}
.btn-primary:hover{background:var(--green-deep);}
.btn-primary:active{transform:scale(.97);}
.btn-ghost{border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:13px;color:var(--ink2);background:var(--surface);}
.btn-ghost:hover{border-color:var(--green);color:var(--green-deep);}
.btn-danger{color:var(--red);border:1px solid #EAD0CB;border-radius:12px;padding:10px 16px;font-size:13px;background:var(--surface);}

/* ============ 空状态 ============ */
.empty-wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:44px 26px 26px;overflow-y:auto;}
.empty-logo{width:64px;height:64px;color:var(--green);animation:grow 1.2s cubic-bezier(.2,.8,.2,1);}
@keyframes grow{from{transform:scale(.6) translateY(10px);opacity:0;}to{transform:none;opacity:1;}}
.empty-name{font-family:var(--serif);font-size:32px;font-weight:700;margin-top:12px;}
.empty-tag{font-size:13px;color:var(--ink2);margin-top:8px;text-align:center;line-height:1.8;}
.empty-illu{margin:26px 0 8px;opacity:.9;}
.root-input-card{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 2px 14px rgba(30,43,35,.05);}
.root-input-card textarea{width:100%;border:none;outline:none;resize:none;font-size:15px;line-height:1.7;min-height:72px;background:transparent;}
.root-input-card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.key-hint{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--amber);background:var(--amber-soft);padding:5px 10px;border-radius:99px;cursor:pointer;}
.send-fab{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;transition:transform .12s,background .15s;}
.send-fab:hover{background:var(--green-deep);}
.send-fab:active{transform:scale(.92);}
.send-fab:disabled{background:#C9CFC9;cursor:not-allowed;}
.demo-link{margin-top:16px;font-size:12px;color:var(--ink3);text-decoration:underline;text-underline-offset:3px;}
.demo-link:hover{color:var(--green-deep);}

/* ============ 主题列表 ============ */
.topic-list{padding:14px 14px 90px;}
.topic-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;animation:cardIn .35s cubic-bezier(.2,.8,.2,1) backwards;}
@keyframes cardIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.topic-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(30,43,35,.08);}
.topic-card .tc-top{display:flex;align-items:flex-start;gap:8px;}
.topic-card .tc-title{font-family:var(--serif);font-size:16.5px;font-weight:600;line-height:1.5;flex:1;}
.topic-card .tc-sum{font-size:12.5px;color:var(--ink2);line-height:1.7;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.topic-card .tc-meta{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:11px;color:var(--ink3);}
.fab-new{position:absolute;right:18px;bottom:34px;height:44px;padding:0 18px;border-radius:99px;background:var(--green);color:#fff;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(46,125,79,.35);z-index:6;transition:transform .12s;}
.fab-new:active{transform:scale(.95);}

/* ============ 对话阅读页 ============ */
.source-banner{margin:10px 14px 0;background:var(--green-faint);border:1px solid var(--green-soft);border-radius:12px;padding:9px 12px;font-size:12px;color:var(--green-deep);display:flex;align-items:center;gap:8px;cursor:pointer;animation:cardIn .3s backwards;}
.source-banner:hover{background:var(--green-soft);}
.source-banner .q{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.arch-banner{margin:10px 14px 0;background:#EDEBE2;border-radius:12px;padding:9px 12px;font-size:12px;color:var(--ink2);display:flex;gap:8px;align-items:center;}
.msg-flow{padding:16px 14px 20px;display:flex;flex-direction:column;gap:14px;}
.msg-user{align-self:flex-end;max-width:82%;background:var(--green);color:#fff;border-radius:16px 16px 4px 16px;padding:11px 14px;font-size:14.5px;line-height:1.7;animation:msgIn .3s cubic-bezier(.2,.8,.2,1);}
.msg-ai{align-self:stretch;background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:13px 14px;font-size:14.5px;line-height:1.85;animation:msgIn .3s cubic-bezier(.2,.8,.2,1);}
@keyframes msgIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.msg-ai .ai-tag{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--green-deep);font-weight:500;margin-bottom:6px;letter-spacing:.06em;}
.anchor-span{color:var(--green-deep);border-bottom:1.5px dashed var(--green);cursor:pointer;padding-bottom:1px;transition:background .15s;}
.anchor-span:hover{background:var(--green-soft);}
.anchor-span.flash, .flash-target{animation:flashBg 1.8s ease-out;}
@keyframes flashBg{0%{background:#F5D98C;}60%{background:#F5E9C4;}100%{background:transparent;}}
.typing-cursor{display:inline-block;width:2px;height:1em;background:var(--green);vertical-align:-2px;margin-left:2px;animation:blink .8s infinite;}
@keyframes blink{50%{opacity:0;}}
.gen-note{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11.5px;color:var(--ink3);}
.gen-dots i{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--green);margin-right:3px;animation:genDot 1.2s infinite;}
.gen-dots i:nth-child(2){animation-delay:.15s;}.gen-dots i:nth-child(3){animation-delay:.3s;}
@keyframes genDot{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-4px);opacity:1;}}
.fail-bar{margin-top:10px;background:var(--amber-soft);border:1px solid #EDDFBE;border-radius:10px;padding:9px 11px;font-size:12px;color:var(--amber);line-height:1.6;}
.fail-bar .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;}
.retry-btn{font-size:12px;color:var(--green-deep);font-weight:600;padding:5px 12px;border:1px solid var(--green);border-radius:99px;background:var(--surface);}
.retry-btn:hover{background:var(--green-soft);}
.msg-actions{display:flex;align-items:center;gap:8px;margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);}
.fork-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--green-deep);font-weight:500;padding:6px 11px;border-radius:99px;background:var(--green-faint);border:1px solid var(--green-soft);transition:background .15s;}
.fork-btn:hover{background:var(--green-soft);}
.sugg-block{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
.sugg-label{font-size:10.5px;color:var(--ink3);letter-spacing:.08em;margin-bottom:7px;display:flex;align-items:center;gap:4px;}
.sugg-chip{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:var(--green-faint);border:1px solid var(--green-soft);border-radius:12px;padding:9px 11px;font-size:13px;color:var(--ink);margin-bottom:7px;transition:background .15s,transform .1s;animation:cardIn .35s backwards;}
.sugg-chip:hover{background:var(--green-soft);}
.sugg-chip:active{transform:scale(.99);}
.sugg-chip .txt{flex:1;line-height:1.5;}
.sugg-chip .fork-ic{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--green);flex-shrink:0;border-left:1px solid var(--green-soft);padding-left:6px;}
.sugg-chip .fork-ic:hover{color:var(--green-deep);transform:scale(1.15);}
.composer{border-top:1px solid var(--line);background:var(--surface);padding:10px 12px 12px;}
.composer .inner{display:flex;align-items:flex-end;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 14px;}
.composer textarea{flex:1;border:none;outline:none;resize:none;background:transparent;font-size:14px;line-height:1.6;max-height:96px;}
.pending-fork-card{margin-bottom:9px;background:var(--green-faint);border:1px solid var(--green-soft);border-left:3px solid var(--green);border-radius:10px;padding:9px 11px;font-size:12px;color:var(--green-deep);animation:cardIn .25s backwards;}
.pending-fork-card .pf-top{display:flex;align-items:center;justify-content:space-between;font-weight:600;margin-bottom:3px;}
.pending-fork-card .pf-q{color:var(--ink2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.newmsg-pill{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;background:var(--blue);color:#fff;font-size:12px;padding:7px 14px;border-radius:99px;box-shadow:0 4px 14px rgba(47,107,255,.4);z-index:7;animation:cardIn .25s;cursor:pointer;}

/* ============ 逐层导航 ============ */
.nav-section{padding:14px 16px 4px;font-size:11px;letter-spacing:.14em;color:var(--ink3);font-weight:700;}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px 2px;}
.crumb{font-size:12px;color:var(--green-deep);background:var(--green-faint);border:1px solid var(--green-soft);padding:5px 10px;border-radius:99px;cursor:pointer;}
.crumb:hover{background:var(--green-soft);}
.crumb-sep{color:var(--ink3);font-size:12px;align-self:center;}
.nav-current{margin:10px 14px;background:var(--surface);border:1px solid var(--green);border-radius:16px;padding:14px;box-shadow:0 2px 12px rgba(46,125,79,.08);}
.nav-current .nc-title{font-family:var(--serif);font-size:17px;font-weight:600;display:flex;align-items:flex-start;gap:8px;}
.nav-current .nc-sum{font-size:12.5px;color:var(--ink2);line-height:1.7;margin-top:6px;}
.nav-current .nc-meta{display:flex;gap:10px;margin-top:10px;font-size:11px;color:var(--ink3);align-items:center;}
.branch-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin:0 14px 9px;cursor:pointer;transition:border-color .15s,transform .1s;animation:cardIn .3s backwards;}
.branch-row:hover{border-color:var(--green);}
.branch-row .br-main{flex:1;min-width:0;}
.branch-row .br-title{font-size:14px;font-weight:500;display:flex;align-items:center;gap:7px;}
.branch-row .br-sum{font-size:11.5px;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.branch-row .br-meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3);flex-shrink:0;}
.more-row{margin:0 14px 9px;padding:11px;border:1px dashed var(--line);border-radius:14px;text-align:center;font-size:12.5px;color:var(--ink2);cursor:pointer;background:transparent;}
.more-row:hover{border-color:var(--green);color:var(--green-deep);}
.nav-footer-link{display:flex;align-items:center;justify-content:center;gap:6px;padding:16px;font-size:12.5px;color:var(--ink2);cursor:pointer;}
.nav-footer-link:hover{color:var(--green-deep);}

/* ============ 总览画布 ============ */
.canvas-wrap{flex:1;position:relative;overflow:hidden;background:var(--bg);background-image:radial-gradient(#DDD9C8 1px,transparent 1px);background-size:18px 18px;}
.canvas-tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px;z-index:5;}
.canvas-tools button{width:36px;height:36px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink2);box-shadow:0 2px 8px rgba(30,43,35,.08);font-size:16px;}
.canvas-tools button:hover{color:var(--green-deep);border-color:var(--green);}
.cv-node{width:100%;height:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;overflow:hidden;transition:border-color .15s,box-shadow .15s;display:flex;flex-direction:column;}
.cv-node:hover{border-color:var(--green);}
.cv-node.current{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft);}
.cv-node .cv-title{font-size:12px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.cv-node .cv-sum{font-size:10px;color:var(--ink2);line-height:1.5;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.cv-node .cv-meta{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:9.5px;color:var(--ink3);}
.cv-node.lowzoom .cv-sum,.cv-node.lowzoom .cv-meta{display:none;}
.cv-node.lowzoom{justify-content:center;}
.fold-btn{position:absolute;left:50%;transform:translateX(-50%);bottom:-13px;width:24px;height:24px;border-radius:50%;background:var(--surface);border:1.5px solid var(--green);color:var(--green-deep);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;}
.fold-btn:hover{background:var(--green-soft);}

/* ============ 搜索 / 归档 / 设置 ============ */
.search-bar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:12px 14px 4px;}
.search-bar input{flex:1;border:none;outline:none;font-size:14px;background:transparent;}
.search-scope{padding:8px 18px 0;font-size:11px;color:var(--ink3);}
.result-card{margin:10px 14px 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;cursor:pointer;animation:cardIn .3s backwards;}
.result-card:hover{border-color:var(--green);}
.result-card .r-path{font-size:10.5px;color:var(--ink3);margin-bottom:5px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.result-card .r-title{font-size:14px;font-weight:500;display:flex;align-items:center;gap:7px;}
.result-card .r-snip{font-size:12px;color:var(--ink2);line-height:1.7;margin-top:5px;}
.result-card mark{background:#F5E9C4;color:inherit;border-radius:3px;padding:0 1px;}
.arch-row{margin:10px 14px 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;animation:cardIn .3s backwards;}
.arch-row .a-title{font-size:14px;font-weight:500;display:flex;align-items:center;gap:7px;}
.arch-row .a-meta{font-size:11px;color:var(--ink3);margin-top:4px;}
.arch-row .a-actions{display:flex;gap:8px;margin-top:10px;}
.arch-row .a-actions button{flex:1;font-size:12.5px;padding:8px;border-radius:10px;}
.set-section{margin:16px 14px 0;}
.set-label{font-size:11px;letter-spacing:.14em;color:var(--ink3);font-weight:700;margin-bottom:8px;}
.set-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;}
.set-row{display:flex;align-items:center;gap:10px;padding:6px 0;}
.set-row .sr-main{flex:1;min-width:0;}
.set-row .sr-title{font-size:14px;font-weight:500;}
.set-row .sr-sub{font-size:11.5px;color:var(--ink3);margin-top:2px;line-height:1.6;}

        summary:'缓存历史 K/V 避免重复计算，显存随序列长度线性增长。',
        children:[], archived:false, unread:false, collapsed:false,
        source:{branchId:'r1', msgId:'m2', anchorText:null},
        messages:[

          {id:'m16', role:'ai', status:'stable', text:'自回归生成时，每个新 token 都要与全部历史 token 做注意力。KV Cache 把历史 token 的 K、V 缓存下来，每步只算新 token 的 Q，避免 O(N²) 重复计算。代价是显存随序列长度、层数、头数线性膨胀——长上下文场景下，KV Cache 往往比模型权重更占显存，于是有了 GQA、MLA 等压缩方案。', suggestions:['GQA 是怎么压缩 KV Cache 的？']},
        ]},
      r2:{id:'r2', topicId:'t2', parentId:null, title:'冷链物流的断链风险点', isTempTitle:false,
        summary:'梳理装卸月台、干支交接、零售冷柜三大高发断链环节。',
        children:['c1'], archived:false, unread:true, collapsed:false, source:null,
        messages:[
          {id:'m17', role:'user', text:'帮我梳理冷链物流中最容易断链的环节。'},

            anchors:['装卸货月台'],

        ]},
      c1:{id:'c1', topicId:'t2', parentId:'r2', title:'预冷环节的关键控制点', isTempTitle:false,
        summary:'预冷不足会让全程冷链事倍功半；差压预冷与冷库预冷的适用边界。',
        children:[], archived:true, unread:false, collapsed:false,
        source:{branchId:'r2', msgId:'m18', anchorText:'装卸货月台'},
        messages:[
          {id:'m19', role:'user', text:'预冷环节有哪些关键控制点？'},
          {id:'m20', role:'ai', status:'stable', text:'预冷的核心指标是「从采摘到目标温度的耗时」。差压预冷效率高、适合包装箱堆叠场景；冷库预冷成本低但耗时长 4~6 倍。最常见错误是把冷库当预冷设备用——货物带着田间热直接进库，降温太慢，后续全程冷链做得再好也补不回来。', suggestions:['差压预冷设备投入大概多少？']},
        ]},
    },
  };
}

/* ================= 主状态机 ================= */
function AppPhone(){
  const empty = {topicOrder:[], topics:{}, branches:{}};
  const [screen, setScreen] = useState('empty'); // empty | topics | chat | nav | canvas | archived | settings | newTopic
  const [data, setData] = useState(empty);       // {topicOrder, topics, branches}
  const [keyStatus, setKeyStatus] = useState('none'); // none | ok | invalid
  const [currentBranchId, setCurrentBranchId] = useState(null);
  const [sheet, setSheet] = useState(null);      // {type, payload}
  const [ctxMenu, setCtxMenu] = useState(null);  // {x,y,items}
  const [confirmBox, setConfirmBox] = useState(null); // {title, body, danger, onOk}
  const [bubble, setBubble] = useState(null);    // {x,y,msgId,branchId,anchorText,enabled,reason}
  const [toastMsg, setToastMsg] = useState(null);
  const [pendingFork, setPendingFork] = useState(null); // {parentId, msgId, anchorText}
  const [searchQ, setSearchQ] = useState('');
  const [composerDraft, setComposerDraft] = useState('');
  const [rootDraft, setRootDraft] = useState('');

  const branches = data.branches;
  const genTimers = useRef({});
  const scrollPos = useRef({});
  const viewRef = useRef({screen:'empty', branchId:null, atBottom:true});
  const flashRef = useRef(null);
  const visitCounter = useRef(0);
  const lastVisit = useRef({});
  const toastTimer = useRef(null);

  const toast = (msg) => {
    setToastMsg(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(()=>setToastMsg(null), 2400);
  };

  const setBranches = (fn) => setData(prev => ({...prev, branches: fn(prev.branches)}));
  const upBranch = (id, fn) => setBranches(prev => ({...prev, [id]: fn(prev[id])}));

  /* ---------- 派生帮助函数 ---------- */
  const topicOf = (bid) => branches[bid] ? data.topics[branches[bid].topicId] : null;
  const descendants = (id) => {
    const out = [];
    const walk = (x) => (branches[x] ? branches[x].children : []).forEach(c => { out.push(c); walk(c); });
    walk(id);
    return out;
  };
  const visibleChildren = (b) => b.children.filter(c => branches[c] && !branches[c].archived);
  const subtreeHasUnread = (id) => {
    let found = false;
    const walk = (x) => { const b = branches[x]; if(!b) return; if(b.unread) found = true; b.children.forEach(walk); };
    walk(id);
    return found;
  };
  const hiddenUnreadCount = (id) => { // 折叠后代中的未读数
    let n = 0;
    const walk = (x) => { const b = branches[x]; if(!b) return; if(!b.archived){ if(b.unread) n++; b.children.forEach(walk);} };
    (branches[id]?branches[id].children:[]).forEach(walk);
    return n;
  };
  const hiddenDescCount = (id) => descendants(id).filter(x => !branches[x].archived).length;
  const ancestorsOf = (bid) => {
    const out = [];
    let cur = branches[bid];
    while (cur && cur.parentId){ const p = branches[cur.parentId]; if(!p) break; out.unshift(p); cur = p; }
    return out;
  };
  const anyUnreadInTopic = (tid) => Object.values(branches).some(b => b.topicId===tid && !b.archived && b.unread);

  /* ---------- 生成模拟（流式打字机） ---------- */
  const runGeneration = (branchId, msgId, fullText, opts={}) => {
    let i = 0;
    genTimers.current[msgId] = setInterval(() => {
      i += 3;
      const done = i >= fullText.length;
      upBranch(branchId, b => ({
        ...b,
        messages: b.messages.map(m => m.id===msgId
          ? {...m, text: fullText.slice(0, i), status: done ? 'stable' : 'generating',
             ...(done ? {suggestions: opts.suggestions || SUGG_POOL.slice(0,3), anchors: opts.anchors} : {})}
          : m),
      }));
      if (done){
        clearInterval(genTimers.current[msgId]);
        delete genTimers.current[msgId];
        const v = viewRef.current;
        const watching = v.screen==='chat' && v.branchId===branchId && v.atBottom;
        if (!watching) upBranch(branchId, b => ({...b, unread:true}));
        // AI 命名：临时标题 → 正式标题（仅一次，依据首问/根问题）
        setTimeout(() => {
          setBranches(prev => {
            const b = prev[branchId];
            if (!b || !b.isTempTitle) return prev;
            const firstQ = (b.messages.find(m => m.role==='user') || {text:''}).text;
            return {...prev, [branchId]: {...b, title: fakeTitle(firstQ), isTempTitle:false}};
          });
        }, 900);
        if (opts.onDone) opts.onDone();
      }
    }, 42);
  };

  /* ---------- 导航动作 ---------- */
  const go = (s) => { setScreen(s); };
  const openBranch = (bid, opts={}) => {
    if (!branches[bid]) return;
    visitCounter.current += 1;
    lastVisit.current[bid] = visitCounter.current;
    setData(prev => {
      const t = prev.topics[prev.branches[bid].topicId];
      return {...prev, topics: {...prev.topics, [t.id]: {...t, lastBranchId: bid}}};
    });
    if (opts.flash) flashRef.current = opts.flash; else flashRef.current = null;
    setCurrentBranchId(bid);
    setPendingFork(null);
    setBubble(null);
    setScreen('chat');
  };
  const openTopic = (tid) => {
    const t = data.topics[tid];
    openBranch(t.lastBranchId && branches[t.lastBranchId] && !branches[t.lastBranchId].archived ? t.lastBranchId : t.rootId);
  };

  /* ---------- Key 守卫（BASE-05 / BASE-18） ---------- */
  const guardKey = (contextLabel) => {
    if (keyStatus === 'ok') return true;
    setSheet({type:'key', payload:{context: contextLabel, status: keyStatus}});
    return false; // 输入保留在原位，不产生任何树节点
  };

  /* ---------- 发送：根问题 ---------- */
  const sendRoot = () => {
    const q = rootDraft.trim();
    if (!q) return;
    if (!guardKey('root')) return;
    const tid = 't' + Date.now();
    const bid = 'r' + Date.now();
    const aiId = nid();
    const fullText = `收到，我们开始系统学习「${fakeTitle(q)}」。我会先给出主干框架；阅读中你可以对任何一段划词分叉，把临时疑问隔离进独立分支，探索完随时回到这里。\n\n（演示提示：这条回答稳定后，底部会出现推荐问题与「作为来源新建分支」入口。）`;
    setData(prev => ({
      topicOrder: [...prev.topicOrder, tid],
      topics: {...prev.topics, [tid]: {id: tid, rootId: bid, lastBranchId: bid, time: '刚刚'}},
      branches: {...prev.branches, [bid]: {
        id: bid, topicId: tid, parentId: null, title: q.length>16 ? q.slice(0,16)+'…' : q, isTempTitle: true,
        summary: '（摘要将随本分支对话自动更新）', children: [], archived:false, unread:false, collapsed:false, source:null,
        messages: [
          {id: nid(), role:'user', text: q},
          {id: aiId, role:'ai', status:'generating', text:''},
        ],
      }},
    }));
    setRootDraft('');
    setCurrentBranchId(bid);
    setScreen('chat');
    runGeneration(bid, aiId, fullText, {suggestions: SUGG_POOL.slice(0,3)});
    toast('主题与根分支已形成');
  };

  /* ---------- 发送：当前分支追问 / 新分支首问 ---------- */
  const sendChat = () => {
    const q = composerDraft.trim();
    if (!q) return;
    if (pendingFork){
      if (!guardKey('fork')) return;
      const pf = pendingFork;
      const bid = 'b' + Date.now();
      const aiId = nid();
      const fullText = fakeAnswer(q);
      setBranches(prev => ({
        ...prev,
        [pf.parentId]: {...prev[pf.parentId], children: [...prev[pf.parentId].children, bid]},
        [bid]: {
          id: bid, topicId: prev[pf.parentId].topicId, parentId: pf.parentId,
          title: q.length>16 ? q.slice(0,16)+'…' : q, isTempTitle: true,
          summary: '（摘要将随本分支对话自动更新）', children: [], archived:false, unread:false, collapsed:false,
          source: {branchId: pf.parentId, msgId: pf.msgId, anchorText: pf.anchorText},
          messages: [
            {id: nid(), role:'user', text: q},
            {id: aiId, role:'ai', status:'generating', text:''},
          ],
        },
      }));
      setComposerDraft('');
      setPendingFork(null);
      toast('已创建子分支，来源快照已固定');
      openBranch(bid);
      runGeneration(bid, aiId, fullText);
      return;
    }
    if (!currentBranchId) return;
    if (!guardKey('follow')) return;
    const bid = currentBranchId;
    const aiId = nid();
    const fullText = fakeAnswer(q);
    upBranch(bid, b => ({...b, messages: [...b.messages,
      {id: nid(), role:'user', text: q},
      {id: aiId, role:'ai', status:'generating', text:''},
    ]}));
    setComposerDraft('');
    setTimeout(() => {
      const el = document.getElementById('chat-scroll');
      if (el) el.scrollTop = el.scrollHeight;
    }, 60);
    runGeneration(bid, aiId, fullText);
  };

  /* ---------- 分叉入口 ---------- */
  const startFork = (msgId, anchorText, prefill='') => {
    setPendingFork({parentId: currentBranchId, msgId, anchorText});
    setComposerDraft(prefill);
    setBubble(null);
  };
  const anchorClick = (e, msg, branchId) => {
    e.stopPropagation();
    const rect = e.currentTarget.getBoundingClientRect();
    const host = document.getElementById('phone-content').getBoundingClientRect();
    const enabled = msg.status === 'stable';
    setBubble({
      x: Math.min(Math.max(rect.left - host.left - 20, 12), 200),
      y: rect.bottom - host.top + 6,
      msgId: msg.id, branchId, anchorText: e.currentTarget.textContent,
      enabled,
      reason: msg.status === 'generating' ? '回答还在生成中，完成后才能从这里分叉。' : '这条回答生成中断，仅保留的部分内容可供阅读；原位重试成功、形成稳定回答后才能分叉。',
    });
  };

  /* ---------- 重试（BASE-15：原位、不重复消息/分支） ---------- */
  const retryMsg = (branchId, msg) => {
    if (!guardKey('retry')) return;
    upBranch(branchId, b => ({...b, messages: b.messages.map(m => m.id===msg.id ? {...m, status:'generating', text:''} : m)}));
    runGeneration(branchId, msg.id, msg.retryText, {anchors: msg.retryAnchors, suggestions: msg.suggestions});
    toast('正在原位置重试，不会新增消息或分支');
  };

  /* ---------- 整理：归档 / 恢复 / 删除（BASE-14） ---------- */
  const setSubtreeArchived = (id, flag) => {
    const ids = [id, ...descendants(id)];
    setBranches(prev => {
      const next = {...prev};
      ids.forEach(x => { next[x] = {...next[x], archived: flag}; });
      return next;
    });
  };
  const archiveBranch = (id) => {
    const n = descendants(id).length;
    setConfirmBox({
      title: '归档这棵子树？',
      body: `「${branches[id].title」及其 ${n} 个后代将从日常导航和默认画布中隐藏，可随时从「已归档」整体恢复，父子关系保持不变。`,
      danger: false, okText: '归档',
      onOk: () => {
        setSubtreeArchived(id, true);
        toast(`已归档「${branches[id].title}」（含 ${n} 个后代）`);
        if (currentBranchId === id || descendants(id).includes(currentBranchId)){
          openBranch(branches[id].parentId);
        }
      },
    });
  };
  const restoreSubtree = (id) => {
    const n = descendants(id).length;
    setSubtreeArchived(id, false);
    setSheet(null);
    toast(`已恢复整棵子树（${n + 1} 个分支）`);
  };
  const deleteSubtree = (id) => {
    const n = descendants(id).length;
    setConfirmBox({
      title: '永久删除这棵子树？',
      body: `将永久删除「${branches[id].title」及全部 ${n} 个后代分支，删除后不可恢复。取消不会改变任何内容。`,
      danger: true, okText: '永久删除',
      onOk: () => {
        const ids = [id, ...descendants(id)];
        setData(prev => {
          const next = {...prev.branches};
          const parent = next[prev.branches[id].parentId];
          if (parent) next[parent.id] = {...parent, children: parent.children.filter(c => c !== id)};
          ids.forEach(x => delete next[x]);
          return {...prev, branches: next};
        });
        toast('已删除整棵子树');
        setSheet(null);
      },
    });
  };
  const deleteTopic = (tid) => {
    const t = data.topics[tid];
    const root = branches[t.rootId];
    const n = descendants(t.rootId).length;
    setConfirmBox({
      title: '永久删除整个主题？',
      body: `「${root ? root.title : ''」包含 ${n + 1} 个分支的全部内容仅保存在本机，删除后不可恢复，不存在云端备份。取消不会改变任何内容。`,
      danger: true, okText: '永久删除',
      onOk: () => {
        setData(prev => {
          const ids = [t.rootId, ...descendants(t.rootId)];
          const next = {...prev.branches};
          ids.forEach(x => delete next[x]);
          const topics = {...prev.topics};
          delete topics[tid];
          const order = prev.topicOrder.filter(x => x !== tid);
          return {topicOrder: order, topics, branches: next};
        });
        toast('主题已永久删除');
        setScreen(Object.keys(data.topics).length > 1 ? 'topics' : 'empty');
      },
    });
  };

  /* ---------- 标题（BASE-06 / BASE-12 / BASE-19） ---------- */
  const renameBranch = (id, name) => {
    if (!name.trim()) return;
    const isRoot = branches[id].parentId === null;
    upBranch(id, b => ({...b, title: name.trim(), isTempTitle:false}));
    setSheet(null);
    toast(isRoot ? '根标题已更新，主题列表同步显示' : '分支标题已更新');
  };
  const refreshTitle = (id) => {
    const b = branches[id];
    const firstQ = (b.messages.find(m => m.role==='user') || {text:''}).text;
    setSheet(null);
    toast('正在依据' + (b.parentId ? '来源锚点与首问' : '根问题') + '重新生成标题…');
    setTimeout(() => {
      upBranch(id, x => ({...x, title: fakeTitle(firstQ), isTempTitle:false}));
      toast(b.parentId === null ? '根标题已刷新，主题列表同步显示' : '分支标题已刷新');
    }, 900);
  };

  /* ---------- 搜索（BASE-12） ---------- */
  const searchAll = (q) => {
    if (!q.trim()) return [];
    const results = [];
    const hl = (text) => {
      const i = text.indexOf(q);
      const s = Math.max(0, i - 14), e = Math.min(text.length, i + q.length + 22);
      return (s > 0 ? '…' : '') + text.slice(s, e) + (e < text.length ? '…' : '');
    };
    Object.values(branches).forEach(b => {
      const path = [...ancestorsOf(b.id).map(x => x.title)];
      if (b.title.includes(q)) results.push({bid: b.id, type: '分支标题', snip: b.title, path, archived: b.archived});
      b.messages.forEach(m => {
        if (m.text && m.text.includes(q)) results.push({bid: b.id, type: m.role==='user' ? '用户问题' : (m.status==='stable' ? 'AI 回答' : '部分回答'), snip: hl(m.text), path, archived: b.archived});
      });
      if (b.source && b.source.anchorText && b.source.anchorText.includes(q))
        results.push({bid: b.id, type: '锚定原文', snip: b.source.anchorText, path, archived: b.archived});
    });
    return results.slice(0, 30);
  };

  /* ================= 通用浮层组件 ================= */
  const renderToast = () => toastMsg && <div className="toast">{toastMsg}</div>;
  const renderConfirm = () => confirmBox && (
    <div className="center-mask" onClick={() => setConfirmBox(null)}>
      <div className="confirm-box" onClick={e => e.stopPropagation()}>
        <h3>{confirmBox.title}</h3>
        <p>{confirmBox.body}</p>
        <div className="cb-actions">
          <button className="btn-ghost" onClick={() => { setConfirmBox(null); toast('已取消，内容保持不变'); }}>取消</button>
          <button className="btn-primary" style={confirmBox.danger ? {background:'var(--red)'} : {}}
            onClick={() => { setConfirmBox(null); confirmBox.onOk(); }}>{confirmBox.okText || '确认'}</button>
        </div>
      </div>
    </div>
  );
  const renderCtxMenu = () => ctxMenu && (
    <React.Fragment>
      <div style={{position:'absolute', inset:0, zIndex:43}} onClick={() => setCtxMenu(null)}/>
      <div className="ctx-menu" style={{left: ctxMenu.x, top: ctxMenu.y}}>
        {ctxMenu.items.map((it, i) => (
          <button key={i} className={it.danger ? 'danger' : ''} onClick={() => { setCtxMenu(null); it.onClick(); }}>
            {it.icon}{it.label}
          </button>
        ))}
      </div>
    </React.Fragment>
  );
  const renderBubble = () => bubble && (
    <React.Fragment>
      <div style={{position:'absolute', inset:0, zIndex:44}} onClick={() => setBubble(null)}/>
      <div className="bubble-menu" style={{left: bubble.x, top: bubble.y}}>
        {bubble.enabled ? (
          <button onClick={() => startFork(bubble.msgId, bubble.anchorText)}>
            <IFork size={15}/> 以选中文字为来源新建分支
          </button>
        ) : (
          <div className="bm-note">{bubble.reason}</div>
        )}
      </div>
    </React.Fragment>
  );
  const renderSheet = () => {
    if (!sheet) return null;
    const close = () => setSheet(null);
    let body = null;
    if (sheet.type === 'key'){
      const st = sheet.payload.status;
      body = (
        <React.Fragment>
          <div className="handle"/><h3>需要先配置 DeepSeek Key</h3>
          <div className="sh-sub">
            {st === 'none' ? '尚未配置 API Key，发送已被阻止。' : '当前 Key 无效或额度不足，发送已被阻止。'}
            你输入的内容已保留在原位置，不会形成主题或分支；配置可用 Key 后回来即可继续发送。
          </div>
          <div className="sheet-actions">
            <button className="btn-ghost" onClick={close}>继续编辑</button>
            <button className="btn-primary" onClick={() => { setSheet(null); setScreen('settings'); }}>去配置 Key</button>
          </div>
        </React.Fragment>
      );
    } else if (sheet.type === 'rename'){
      const b = branches[sheet.payload.id];
      body = (
        <React.Fragment>
          <div className="handle"/><h3>修改标题</h3>
          <div className="sh-sub">{b.parentId === null ? '根标题即主题显示身份，修改后主题列表同步更新。' : '标题不随对话自动变化，可随时手动修改。'}</div>
          <input className="rename-input" id="rename-input" defaultValue={b.title}/>
          <div className="sheet-actions">
            <button className="btn-ghost" onClick={close}>取消</button>
            <button className="btn-primary" onClick={() => renameBranch(b.id, document.getElementById('rename-input').value)}>保存</button>
          </div>
        </React.Fragment>
      );
    } else if (sheet.type === 'archDetail'){
      const b = branches[sheet.payload.id];
      const n = descendants(b.id).length;
      body = (
        <React.Fragment>
          <div className="handle"/><h3>{b.title}</h3>
          <div className="sh-sub">已归档子树 · 含 {n} 个后代分支。查看详情不会改变归档状态；恢复将以整棵子树为单位回到日常导航与画布。</div>
          <div style={{background:'var(--bg)',borderRadius:12,padding:'11px 13px',fontSize:12.5,color:'var(--ink2)',lineHeight:1.8}}>
            {b.summary}<br/>来源：{b.source && branches[b.source.branchId] ? branches[b.source.branchId].title : '—'}{b.source && b.source.anchorText ? ` · 「${b.source.anchorText}」` : ''}
          </div>
          <div className="sheet-actions">
            <button className="btn-ghost" onClick={() => { setSheet(null); openBranch(b.id); toast('正在查看已归档分支，恢复前仍可阅读'); }}>仅查看内容</button>
            <button className="btn-primary" onClick={() => restoreSubtree(b.id)}>恢复整棵子树</button>
          </div>
        </React.Fragment>
      );
    } else if (sheet.type === 'archSearchHit'){
      const b = branches[sheet.payload.id];
      body = (
        <React.Fragment>
          <div className="handle"/><h3>{b.title}</h3>
          <div className="sh-sub">该分支位于已归档子树中。「查看」与「恢复」是两个不同动作——查看不会改变归档状态。</div>
          <div className="sheet-actions">
            <button className="btn-ghost" onClick={() => { setSheet(null); openBranch(b.id); }}>仅查看</button>
            <button className="btn-primary" onClick={() => restoreSubtree(b.id)}>恢复整棵子树</button>
          </div>
        </React.Fragment>
      );
    } else if (sheet.type === 'nodeDetail'){
      const b = branches[sheet.payload.id];
      const n = visibleChildren(b).length;
      body = (
        <React.Fragment>
          <div className="handle"/>
          <div style={{display:'flex',alignItems:'flex-start',gap:8}}>
            {b.unread && <span className="udot" style={{marginTop:7}}/>}
            <h3 style={{flex:1}}>{b.title}</h3>
          </div>
          <div className="sh-sub" style={{marginTop:6}}>{b.summary}</div>
          {b.source && (
            <div style={{background:'var(--green-faint)',border:'1px solid var(--green-soft)',borderRadius:10,padding:'9px 11px',fontSize:12,color:'var(--green-deep)',lineHeight:1.7}}>
              来源：{branches[b.source.branchId] ? branches[b.source.branchId].title : '—'}{b.source.anchorText ? <React.Fragment> · 「{b.source.anchorText}」</React.Fragment> : ' · 整条回答'}
            </div>
          )}
          <div className="sheet-actions">
            <button className="btn-ghost" onClick={() => {
              upBranch(b.id, x => ({...x, collapsed: !x.collapsed}));
              setSheet(null);
            }}>{b.collapsed ? `展开子树（${hiddenDescCount(b.id)}）` : `折叠子树（${n}）`}</button>
            <button className="btn-primary" onClick={() => { setSheet(null); openBranch(b.id); }}>进入对话</button>
          </div>
        </React.Fragment>
      );
    }
    return (
      <div className="overlay-mask" onClick={close}>
        <div className="sheet" onClick={e => e.stopPropagation()}>{body}</div>
      </div>
    );
  };

  /* ================= 页面：空状态 / 新主题 ================= */
  const renderEmpty = (isNewTopic) => (
    <div className="screen" key={isNewTopic ? 'new' : 'empty'}>

        <svg className="empty-illu" width="220" height="74" viewBox="0 0 220 74" fill="none" stroke="var(--green)" strokeWidth="1.4" strokeLinecap="round" opacity=".55">

          <div className="foot">

              <div className="key-hint" onClick={() => setScreen('settings')}>
                <IKey size={13}/>{keyStatus === 'none' ? '未配置 Key' : 'Key 无效'}
              </div>
            ) : <span style={{fontSize:11,color:'var(--ink3)'}}>DeepSeek 已就绪</span>}

        {!isNewTopic && (

            先逛逛示例主题 →
          </button>

  /* ================= 页面：主题列表 ================= */
  const renderTopics = () => {

    return (
      <div className="screen" key="topics">
        <div className="appbar" style={{borderBottom:'none',paddingTop:14}}>
          <div style={{display:'flex',alignItems:'center',gap:8,flex:1}}>
            <ISprout size={26}/>
            <span className="serif" style={{fontSize:21,fontWeight:700}}>知芽</span>
          </div>
          <button className="icon-btn" onClick={() => { setSearchQ(''); setScreen('search'); }}><ISearch/></button>
          <button className="icon-btn" onClick={() => setScreen('archived')}>
            <IBox/>
            {archivedCount > 0 && <span style={{position:'absolute',top:2,right:2,fontSize:9,background:'var(--ink3)',color:'#fff',borderRadius:99,padding:'1px 4px'}}>{archivedCount}</span>}
          </button>
          <button className="icon-btn" onClick={() => setScreen('settings')}><IGear/></button>
        </div>
        <div className="body-scroll">

      </div>

  /* ================= 页面：对话阅读（核心） ================= */
  const ChatScreen = () => {
    const b = branches[currentBranchId];
    const scrollRef = useRef(null);

    useEffect(() => {
      viewRef.current = {screen:'chat', branchId: currentBranchId, atBottom: viewRef.current.atBottom};
      const el = scrollRef.current;
      if (el){
        requestAnimationFrame(() => {
          const flash = flashRef.current;
          if (flash){
            const msgEl = document.getElementById('m-' + flash.msgId);
            if (msgEl){
              let target = msgEl;
              if (flash.anchorText){
                const sp = msgEl.querySelector('[data-anchor]');
                if (sp) target = sp;
              }
              el.scrollTop = Math.max(0, target.offsetTop - 140);
              target.classList && target.classList.add(flash.anchorText ? 'flash' : 'flash-target');
              setTimeout(() => target.classList && target.classList.remove('flash','flash-target'), 1900);
            }
            flashRef.current = null;
          } else {
            const saved = scrollPos.current[currentBranchId];
            el.scrollTop = saved != null ? saved : el.scrollHeight;
          }
          // 短内容直接在底部 → 即满足「最新回答进入可视区域」
          const atB = el.scrollTop + el.clientHeight >= el.scrollHeight - 60;
          viewRef.current.atBottom = atB;
          if (atB && b && b.unread) upBranch(b.id, x => ({...x, unread:false}));
        });
      }
      return () => {
        if (el) scrollPos.current[currentBranchId] = el.scrollTop;
      };
    }, [currentBranchId]);

    if (!b) return null;
    const topic = topicOf(b.id);
    const root = branches[topic.rootId];
    const isRoot = b.parentId === null;
    const topicUnread = anyUnreadInTopic(topic.id);

    const onScroll = (e) => {
      const el = e.currentTarget;
      const atB = el.scrollTop + el.clientHeight >= el.scrollHeight - 60;
      viewRef.current.atBottom = atB;
      if (atB && b.unread) upBranch(b.id, x => ({...x, unread:false}));
    };

    const renderMsgText = (m) => {
      const anchors = m.anchors || [];
      if (!anchors.length || m.status !== 'stable') return <span>{m.text}</span>;
      // 按锚点拆分渲染可划词片段
      let parts = [{text: m.text, isAnchor: false}];
      anchors.forEach(a => {
        const next = [];
        parts.forEach(p => {
          if (p.isAnchor || !p.text.includes(a)){ next.push(p); return; }
          const idx = p.text.indexOf(a);
          if (idx > 0) next.push({text: p.text.slice(0, idx), isAnchor:false});
          next.push({text: a, isAnchor:true});
          if (idx + a.length < p.text.length) next.push({text: p.text.slice(idx + a.length), isAnchor:false});
        });
        parts = next;
      });
      return parts.map((p, i) => p.isAnchor
        ? <span key={i} className="anchor-span" data-anchor={p.text} onClick={(e) => anchorClick(e, m, b.id)}>{p.text}</span>
        : <span key={i}>{p.text}</span>);
    };

    return (
      <div className="screen" key={b.id}>
        <div className="appbar">
          <button className="icon-btn" onClick={() => { setPendingFork(null); isRoot ? setScreen('topics') : openBranch(b.parentId); }}><IBack/></button>
          <div className="appbar-title">
            {!isRoot && <div className="t2">{root.title} /</div>}
            <div className="t1" style={{display:'flex',alignItems:'center',gap:6}}>
              {b.unread && <span className="udot"/>}{b.title}
              {b.isTempTitle && <span className="chip-type">临时标题</span>}
            </div>
          </div>
          <button className="icon-btn" onClick={() => setScreen('nav')}>
            <ITree/>{topicUnread && <span className="mini-dot"/>}
          </button>
          <button className="icon-btn" onClick={() => setScreen('canvas')}><IMap/></button>
        </div>

        {b.source && (
          <div className="source-banner" onClick={() => {
            const src = b.source;
            if (branches[src.branchId]) openBranch(src.branchId, {flash:{msgId: src.msgId, anchorText: src.anchorText}});
          }}>
            <IBack size={14}/>
            <span style={{fontWeight:600,flexShrink:0}}>来源</span>
            <span className="q">{branches[b.source.branchId] ? branches[b.source.branchId].title : ''}{b.source.anchorText ? ` · 「${b.source.anchorText}」` : ' · 整条回答'}</span>
          </div>
        )}
        {b.archived && (
          <div className="arch-banner"><IBox size={14}/>该分支位于已归档子树中，可正常阅读；恢复请前往「已归档」。</div>
        )}

        <div className="body-scroll" id="chat-scroll" ref={scrollRef} onScroll={onScroll}>
          <div className="msg-flow">
            {b.messages.map(m => m.role === 'user' ? (
              <div key={m.id} className="msg-user">{m.text}</div>
            ) : (
              <div key={m.id} className="msg-ai" id={'m-' + m.id}>
                <div className="ai-tag"><ISpark/>知芽 · DeepSeek</div>
                <div>
                  {m.anchors && m.status === 'stable' ? renderMsgText(m) : (
                    <span>
                      {m.text}
                      {m.status === 'generating' && <span className="typing-cursor"/>}
                    </span>
                  )}
                  {/* 部分回答上的锚点同样可点，但会解释为何不可分叉（评审点①） */}
                  {m.status !== 'stable' && m.anchors == null && null}
                </div>
                {m.status === 'generating' && (
                  <div className="gen-note">
                    <span className="gen-dots"><i/><i/><i/></span>正在生成 · 完成后才能从这条回答分叉
                  </div>
                )}
                {m.status === 'failed' && (
                  <div className="fail-bar">
                    生成中断，以上为部分回答——可以阅读，但不能作为新分支的来源。
                    <div className="row">
                      <span style={{color:'var(--ink3)',fontSize:11}}>重试不会重复创建消息或分支</span>
                      <button className="retry-btn" onClick={() => retryMsg(b.id, m)}>原位重试</button>
                    </div>
                  </div>
                )}
                {m.status === 'stable' && (
                  <React.Fragment>
                    <div className="msg-actions">
                      <button className="fork-btn" onClick={() => startFork(m.id, null)}>
                        <IFork size={14}/>作为来源新建分支
                      </button>
                      <span style={{fontSize:10.5,color:'var(--ink3)'}}>选中带下划线的文字也可分叉</span>
                    </div>
                    {m.suggestions && m.suggestions.length > 0 && (
                      <div className="sugg-block">
                        <div className="sugg-label"><ISpark size={11}/>结合本主题树轮廓推荐 · 不污染当前回答上下文</div>
                        {m.suggestions.map((s, i) => (
                          <div key={i} className="sugg-chip" style={{animationDelay:(i*0.05)+'s'}}>
                            <span className="txt" onClick={() => { setComposerDraft(s); setPendingFork(null); }}>{s}</span>
                            <span className="fork-ic" title="以此推荐新建分支" onClick={(e) => { e.stopPropagation(); startFork(m.id, null, s); }}><IFork size={14}/></span>
                          </div>
                        ))}
                      </div>
                    )}
                  </React.Fragment>
                )}
              </div>
            ))}
          </div>
        </div>

        {b.unread && <div className="newmsg-pill" onClick={() => {
          const el = document.getElementById('chat-scroll');
          if (el) el.scrollTop = el.scrollHeight;
        }}>↓ 有未读回答，点击查看</div>}

        <div className="composer">
          {pendingFork && (
            <div className="pending-fork-card">
              <div className="pf-top">
                <span style={{display:'flex',alignItems:'center',gap:5}}><IFork size={13}/>新分支 · 来源已固定</span>
                <button onClick={() => { setPendingFork(null); setComposerDraft(''); }} style={{color:'var(--ink3)'}}><IClose size={14}/></button>
              </div>
              <div className="pf-q">{pendingFork.anchorText ? `「${pendingFork.anchorText}」` : '整条回答'} · {branches[pendingFork.parentId] ? branches[pendingFork.parentId].title : ''}</div>
            </div>
          )}
          <div className="inner">
            <textarea rows={1} placeholder={pendingFork ? '就来源内容提出本分支的第一个问题…' : '在当前分支继续追问…'}
              value={composerDraft}
              onChange={e => { setComposerDraft(e.target.value); e.target.style.height='auto'; e.target.style.height=Math.min(e.target.scrollHeight,96)+'px'; }}
              onKeyDown={e => { if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); } }}/>
            <button className="send-fab" disabled={!composerDraft.trim()} onClick={sendChat}><ISend size={18}/></button>
          </div>
        </div>
      </div>
    );
  };

  /* ================= 页面：逐层导航 ================= */
  const renderNav = () => {
    const b = branches[currentBranchId];
    if (!b) return null;
    const ancestors = ancestorsOf(b.id);
    const kids = visibleChildren(b)
      .map(id => branches[id])
      .sort((x, y) => (lastVisit.current[y.id] || 0) - (lastVisit.current[x.id] || 0));
    const recent = kids.slice(0, 3);
    const more = kids.slice(3);
    const isRoot = b.parentId === null;
    const archivedHere = kids.length !== b.children.length ? b.children.filter(c => branches[c] && branches[c].archived) : [];
    const [showMore, setShowMore] = [navMoreOpen, setNavMoreOpen];
    const row = (k, i) => (
      <div className="branch-row" key={k.id} style={{animationDelay:(i*0.04)+'s'}} onClick={() => openBranch(k.id)}>
        {k.unread && <span className="udot"/>}
        <div className="br-main">
          <div className="br-title">{k.title}{k.isTempTitle && <span className="chip-type">临时</span>}</div>
          <div className="br-sum">{k.summary}</div>
        </div>
        <div className="br-meta">
          {visibleChildren(k).length > 0 && <span>{visibleChildren(k).length} 子分支</span>}
          <button className="icon-btn" style={{width:28,height:28}} onClick={(e) => {
            e.stopPropagation();
            const r = e.currentTarget.getBoundingClientRect();
            const host = document.getElementById('phone-content').getBoundingClientRect();
            setCtxMenu({x: r.left - host.left - 140, y: r.bottom - host.top + 4, items:[
              {icon:<IPencil size={15}/>, label:'修改标题', onClick: () => setSheet({type:'rename', payload:{id:k.id}})},
              {icon:<IRefresh size={15}/>, label:'AI 刷新标题', onClick: () => refreshTitle(k.id)},
              {icon:<IBox size={15}/>, label:'归档此子树', onClick: () => archiveBranch(k.id)},
              {icon:<ITrash size={15}/>, label:'永久删除子树', danger:true, onClick: () => deleteSubtree(k.id)},
            ]});
          }}><IMore size={16}/></button>
          <IChevR/>
        </div>
      </div>
    );
    return (
      <div className="screen" key="nav">
        <div className="appbar">
          <button className="icon-btn" onClick={() => setScreen('chat')}><IBack/></button>
          <div className="appbar-title"><div className="t1">分支导航</div><div className="t2">逐层定位 · 深层不靠缩进</div></div>
          <button className="icon-btn" onClick={() => { setSearchQ(''); setScreen('search'); }}><ISearch/></button>
          <button className="icon-btn" onClick={() => setScreen('canvas')}><IMap/></button>
        </div>
        <div className="body-scroll">
          <div className="nav-section">祖先路径</div>
          <div className="crumbs">
            {ancestors.length === 0 && <span style={{fontSize:12,color:'var(--ink3)'}}>当前位于根分支，即主题本身</span>}
            {ancestors.map((a, i) => (
              <React.Fragment key={a.id}>
                {i > 0 && <span className="crumb-sep">›</span>}
                <span className="crumb" onClick={() => openBranch(a.id)}>{a.parentId === null ? '根 · ' : ''}{a.title}</span>
              </React.Fragment>
            ))}
          </div>
          <div className="nav-section">当前分支</div>
          <div className="nav-current">
            <div className="nc-title">
              {b.unread && <span className="udot" style={{marginTop:7}}/>}
              <span style={{flex:1}}>{b.title}</span>
              <button className="icon-btn" style={{width:30,height:30,flexShrink:0}} onClick={(e) => {
                const r = e.currentTarget.getBoundingClientRect();
                const host = document.getElementById('phone-content').getBoundingClientRect();
                const items = [
                  {icon:<IPencil size={15}/>, label:'修改标题', onClick: () => setSheet({type:'rename', payload:{id:b.id}})},
                  {icon:<IRefresh size={15}/>, label:'AI 刷新标题', onClick: () => refreshTitle(b.id)},
                ];
                if (!isRoot){
                  items.push({icon:<IBox size={15}/>, label:'归档此子树', onClick: () => archiveBranch(b.id)});
                  items.push({icon:<ITrash size={15}/>, label:'永久删除子树', danger:true, onClick: () => deleteSubtree(b.id)});
                }
                // BASE-14：根分支不提供任何归档能力
                setCtxMenu({x: r.left - host.left - 140, y: r.bottom - host.top + 4, items});
              }}><IMore/></button>
            </div>
            <div className="nc-sum">{b.summary}</div>
            <div className="nc-meta">
              {isRoot && <span className="chip-type">根分支 · 不可归档</span>}
              <span>{kids.length} 个直接子分支</span>
              {b.isTempTitle && <span className="chip-type">临时标题</span>}
            </div>
          </div>
          <div className="nav-section">直接子分支 · {kids.length}</div>
          {kids.length === 0 && <div style={{padding:'6px 18px',fontSize:12.5,color:'var(--ink3)'}}>还没有子分支。回到对话，从稳定回答划词或整条分叉。</div>}
          {recent.map((k, i) => row(k, i))}
          {more.length > 0 && !showMore && (
            <div className="more-row" onClick={() => setNavMoreOpen(true)}>更多分支（{more.length}）· 按最近使用排序</div>
          )}
          {showMore && more.map((k, i) => row(k, i + 3))}
          {kids.length > 3 && (
            <div className="more-row" onClick={() => { setSearchQ(''); setScreen('search'); }} style={{borderStyle:'solid'}}>
              <ISearch size={13}/> 在全部分支中搜索
            </div>
          )}
          <div className="nav-footer-link" onClick={() => setScreen('archived')}>
            <IBox size={14}/>查看已归档子树{archivedHere.length > 0 ? `（本主题 ${archivedHere.length} 棵）` : ''}
          </div>
        </div>
      </div>
    );
  };

  /* ================= 页面：总览画布 ================= */
  const [cvZoom, setCvZoom] = useState(1);
  const [cvPan, setCvPan] = useState({x: 30, y: 30});
  const [navMoreOpen, setNavMoreOpen] = useState(false);
  const dragRef = useRef(null);

  const renderCanvas = () => {
    const b = branches[currentBranchId];
    if (!b) return null;
    const topic = topicOf(b.id);
    const rootId = topic.rootId;
    // 自动树布局（BASE-11：节点不可自由摆放）
    const NW = 176, NH = 86, GX = 40, GY = 60;
    const pos = {}; let leafX = 0;
    const dfs = (id, depth) => {
      const br = branches[id];
      const kids = br.collapsed ? [] : visibleChildren(br);
      if (!kids.length){ pos[id] = {x: leafX * (NW + GX), y: depth * (NH + GY)}; leafX++; }
      else {
        kids.forEach(k => dfs(k, depth + 1));
        const xs = kids.map(k => pos[k].x);
        pos[id] = {x: (Math.min(...xs) + Math.max(...xs)) / 2, y: depth * (NH + GY)};
      }
      pos[id].kids = kids;
    };
    dfs(rootId, 0);
    const edges = [];
    Object.keys(pos).forEach(id => pos[id].kids.forEach(k => {
      const x1 = pos[id].x + NW / 2, y1 = pos[id].y + NH;
      const x2 = pos[k].x + NW / 2, y2 = pos[k].y;
      edges.push(<path key={id+'-'+k} d={`M${x1},${y1} C${x1},${y1+26} ${x2},${y2-26} ${x2},${y2}`} stroke="var(--green)" strokeOpacity=".45" strokeWidth="1.6" fill="none"/>);
    }));
    const onWheel = (e) => {
      const k = e.deltaY < 0 ? 1.12 : 0.9;
      setCvZoom(z => Math.min(1.6, Math.max(0.35, z * k)));
    };
    const onPointerDown = (e) => { dragRef.current = {sx: e.clientX, sy: e.clientY, ox: cvPan.x, oy: cvPan.y}; };
    const onPointerMove = (e) => {
      if (!dragRef.current) return;
      setCvPan({x: dragRef.current.ox + e.clientX - dragRef.current.sx, y: dragRef.current.oy + e.clientY - dragRef.current.sy});
    };
    const onPointerUp = () => { dragRef.current = null; };
    const centerOn = (id) => {
      if (!pos[id]) return;
      const host = document.getElementById('canvas-host');
      const w = host ? host.clientWidth : 380, h = host ? host.clientHeight : 600;
      setCvPan({x: w / 2 - (pos[id].x + NW / 2) * cvZoom, y: h / 2 - (pos[id].y + NH / 2) * cvZoom - 40});
    };
    const lowzoom = cvZoom < 0.72; // 缩小时只显示标题（BASE-11）
    return (
      <div className="screen" key="canvas">
        <div className="appbar">
          <button className="icon-btn" onClick={() => setScreen('chat')}><IBack/></button>
          <div className="appbar-title"><div className="t1">总览画布</div><div className="t2">{branches[rootId].title}</div></div>
          <button className="icon-btn" onClick={() => { setSearchQ(''); setScreen('search'); }}><ISearch/></button>
        </div>
        <div className="canvas-wrap" id="canvas-host" onWheel={onWheel}
          onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerLeave={onPointerUp}
          style={{cursor: dragRef.current ? 'grabbing' : 'grab'}}>
          <div className="canvas-tools">
            <button onClick={() => setCvZoom(z => Math.min(1.6, z * 1.18))}>+</button>
            <button onClick={() => setCvZoom(z => Math.max(0.35, z * 0.85))}>−</button>
            <button onClick={() => centerOn(currentBranchId)}><ILocate size={17}/></button>
          </div>
          <svg width="100%" height="100%" style={{display:'block', touchAction:'none'}}>
            <g transform={`translate(${cvPan.x},${cvPan.y}) scale(${cvZoom})`}>
              {edges}
              {Object.keys(pos).map(id => {
                const br = branches[id];
                const kidsAll = visibleChildren(br).length;
                const hiddenN = br.collapsed ? hiddenDescCount(id) : 0;
                const aggUnread = br.collapsed ? hiddenUnreadCount(id) : 0;
                return (
                  <foreignObject key={id} x={pos[id].x} y={pos[id].y} width={NW} height={NH + 30} style={{overflow:'visible'}}>
                    <div style={{position:'relative', width:NW, height:NH}}>
                      <div className={'cv-node' + (id === currentBranchId ? ' current' : '') + (lowzoom ? ' lowzoom' : '')}
                        onClick={(e) => { e.stopPropagation(); setSheet({type:'nodeDetail', payload:{id}}); }}>
                        <div className="cv-title" style={{display:'flex',gap:4}}>
                          {br.unread && <span className="udot" style={{marginTop:3}}/>}
                          <span style={{flex:1}}>{br.title}</span>
                        </div>
                        <div className="cv-sum">{br.summary}</div>
                        <div className="cv-meta">
                          {br.parentId === null && <span className="chip-type" style={{fontSize:9,padding:'1px 5px'}}>根</span>}
                          {kidsAll > 0 && !br.collapsed && <span>{kidsAll} 子分支</span>}
                          {br.isTempTitle && <span>临时标题</span>}
                        </div>
                      </div>
                      {(kidsAll > 0) && (
                        <button className="fold-btn" onClick={(e) => { e.stopPropagation(); upBranch(id, x => ({...x, collapsed: !x.collapsed})); }}>
                          {br.collapsed ? '+' + hiddenN : '−'}
                        </button>
                      )}
                      {br.collapsed && aggUnread > 0 && (
                        <span className="udot" style={{position:'absolute', top:-4, right:-4, width:10, height:10}}/>
                      )}
                    </div>
                  </foreignObject>
                );
              })}
            </g>
          </svg>
          <div style={{position:'absolute',left:12,bottom:12,fontSize:10.5,color:'var(--ink3)',background:'rgba(247,246,240,.85)',padding:'5px 10px',borderRadius:99,border:'1px solid var(--line)'}}>
            拖动平移 · 滚轮缩放 · 已归档子树默认隐藏
          </div>
        </div>
      </div>
    );
  };

  /* ================= 页面：搜索 ================= */
  const renderSearch = () => {
    const results = searchAll(searchQ);
    return (
      <div className="screen" key="search">
        <div className="appbar">
          <button className="icon-btn" onClick={() => setScreen(data.topicOrder.length ? 'topics' : 'empty')}><IBack/></button>
          <div className="appbar-title"><div className="t1">搜索</div></div>
        </div>
        <div className="search-bar">
          <ISearch size={16}/>
          <input autoFocus placeholder="标题、问题、回答、锚定原文…" value={searchQ} onChange={e => setSearchQ(e.target.value)}/>
          {searchQ && <button onClick={() => setSearchQ('')} style={{color:'var(--ink3)'}}><IClose size={15}/></button>}
        </div>
        <div className="search-scope">覆盖全部分支与已归档子树 · 结果显示祖先路径与归档状态</div>
        <div className="body-scroll" style={{paddingBottom:30}}>
          {searchQ && results.length === 0 && <div style={{padding:'30px 18px',fontSize:13,color:'var(--ink3)',textAlign:'center'}}>没有找到「{searchQ}」</div>}
          {!searchQ && <div style={{padding:'30px 18px',fontSize:13,color:'var(--ink3)',textAlign:'center'}}>输入关键词开始搜索</div>}
          {results.map((r, i) => {
            const br = branches[r.bid];
            return (
              <div className="result-card" key={i} style={{animationDelay:(i*0.03)+'s'}} onClick={() => {
                if (br.archived) setSheet({type:'archSearchHit', payload:{id: r.bid}});
                else openBranch(r.bid);
              }}>
                <div className="r-path">
                  {r.path.map((p, j) => <span key={j}>{j > 0 ? ' › ' : ''}{p}</span>)}
                  {r.archived && <span className="chip-arch">已归档</span>}
                  <span className="chip-type">{r.type}</span>
                </div>
                <div className="r-title">{br.unread && <span className="udot"/>}{br.title}</div>
                <div className="r-snip">{r.snip}</div>
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  /* ================= 页面：已归档 ================= */
  const renderArchived = () => {
    const roots = Object.values(branches).filter(b => b.archived && !(b.parentId && branches[b.parentId] && branches[b.parentId].archived));
    return (
      <div className="screen" key="archived">
        <div className="appbar">
          <button className="icon-btn" onClick={() => setScreen(data.topicOrder.length ? 'topics' : 'empty')}><IBack/></button>
          <div className="appbar-title"><div className="t1">已归档</div><div className="t2">仅非根子树可归档 · 整体恢复，不重接后代</div></div>
        </div>
        <div className="body-scroll" style={{paddingBottom:30}}>
          {roots.length === 0 && (
            <div style={{padding:'50px 24px',textAlign:'center',color:'var(--ink3)',fontSize:13,lineHeight:2}}>
              <IBox size={30}/><br/>暂无已归档子树<br/>
              <span style={{fontSize:11.5}}>在分支导航中对非根分支选择「归档此子树」试试</span>
            </div>
          )}
          {roots.map((b, i) => {
            const n = descendants(b.id).length;
            const parent = b.parentId && branches[b.parentId];
            return (
              <div className="arch-row" key={b.id} style={{animationDelay:(i*0.05)+'s'}}>
                <div className="a-title"><IBox size={15}/>{b.title}</div>
                <div className="a-meta">含 {n} 个后代 · 来源：{parent ? parent.title : '—'}</div>
                <div className="a-actions">
                  <button className="btn-ghost" onClick={() => setSheet({type:'archDetail', payload:{id: b.id}})}>查看详情</button>
                  <button className="btn-primary" style={{padding:'8px',fontSize:12.5}} onClick={() => restoreSubtree(b.id)}>恢复整棵子树</button>
                  <button className="btn-danger" style={{flex:'0 0 44px',padding:'8px 0'}} onClick={() => deleteSubtree(b.id)}><ITrash size={15}/></button>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  /* ================= 页面：设置 / Key ================= */
  const renderSettings = () => {
    const masked = {ok:'sk-••••••••••3f2a', invalid:'sk-••••••••••0x9e'};
    return (
      <div className="screen" key="settings">
        <div className="appbar">
          <button className="icon-btn" onClick={() => setScreen(data.topicOrder.length ? 'topics' : 'empty')}><IBack/></button>
          <div className="appbar-title"><div className="t1">设置</div></div>
        </div>
        <div className="body-scroll" style={{paddingBottom:30}}>
          <div className="set-section">
            <div className="set-label">DEEPSEEK API KEY</div>
            <div className="set-card">
              <div className="set-row">
                <div className="sr-main">
                  <div className="sr-title" style={{display:'flex',alignItems:'center',gap:8}}>
                    <IKey size={15}/>
                    {keyStatus === 'ok' && <React.Fragment><span>{masked.ok}</span><span className="key-ok">可用</span></React.Fragment>}
                    {keyStatus === 'invalid' && <React.Fragment><span>{masked.invalid}</span><span className="key-bad">无效 / 额度不足</span></React.Fragment>}
                    {keyStatus === 'none' && <React.Fragment><span style={{color:'var(--ink3)'}}>未配置</span><span className="key-none">发送将被阻止</span></React.Fragment>}
                  </div>
                  <div className="sr-sub">Key 仅保存在本机，掩码展示，可随时替换或删除。</div>
                </div>
              </div>
              <div className="key-input-row">
                <input id="key-input" placeholder="粘贴新的 DeepSeek API Key"/>
                <button className="btn-primary" style={{padding:'9px 14px',fontSize:12.5}} onClick={() => {
                  const v = document.getElementById('key-input').value.trim();
                  if (!v){ toast('请先输入 Key'); return; }
                  setKeyStatus('ok');
                  toast('Key 已配置，可返回继续发送');
                }}>保存</button>
              </div>
              <div style={{display:'flex',gap:8,marginTop:10,flexWrap:'wrap'}}>
                <button className="btn-ghost" style={{padding:'7px 12px',fontSize:12}} onClick={() => { setKeyStatus('ok'); toast('已填入演示 Key（可用状态）'); }}>使用演示 Key</button>
                <button className="btn-ghost" style={{padding:'7px 12px',fontSize:12}} onClick={() => { setKeyStatus('invalid'); toast('已切换为无效 Key（演示拦截）'); }}>模拟无效 Key</button>
                {keyStatus !== 'none' && <button className="btn-danger" style={{padding:'7px 12px',fontSize:12}} onClick={() => { setKeyStatus('none'); toast('Key 已删除'); }}>删除 Key</button>}
              </div>
            </div>
          </div>
          <div className="set-section">
            <div className="set-label">数据边界</div>
            <div className="set-note">
              全部主题、分支、消息、快照、标题、摘要、未读与阅读位置<b>仅保存在本机</b>；无登录、云同步、共享或备份。卸载或清除应用数据后不可恢复。<br/><br/>
              调用 DeepSeek 完成生成时，完成该次生成所需的内容会交由外部 AI 服务处理——本产品不宣称全程离线。<span style={{color:'var(--ink3)'}}>（具体数据处理告知将于发布前依据官方条款核定 · TBD-01）</span>
            </div>
          </div>
          <div className="set-section">
            <div className="set-label">演示数据</div>
            <div className="set-card" style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              <button className="btn-ghost" onClick={() => { setData(buildDemo()); setScreen('topics'); toast('已载入示例主题'); }}>载入示例主题</button>
              <button className="btn-ghost" onClick={() => { setData({topicOrder:[], topics:{}, branches:{}}); setScreen('empty'); toast('已重置为空白状态'); }}>重置为空白</button>
            </div>
          </div>
          <div style={{padding:'26px 18px',textAlign:'center',fontSize:11,color:'var(--ink3)',lineHeight:1.9}}>
            知芽（TreeLearn） · 高保真交互原型 v1<br/>依据 V3.0 冻结需求基准 · BASE-05 ~ BASE-19
          </div>
        </div>
      </div>
    );
  };

  /* ================= 路由 ================= */
  let current = null;
  if (screen === 'empty') current = renderEmpty(false);
  else if (screen === 'newTopic') current = renderEmpty(true);
  else if (screen === 'topics') current = renderTopics();
  else if (screen === 'chat') current = <ChatScreen/>;
  else if (screen === 'nav') current = renderNav();
  else if (screen === 'canvas') current = renderCanvas();
  else if (screen === 'search') current = renderSearch();
  else if (screen === 'archived') current = renderArchived();
  else if (screen === 'settings') current = renderSettings();

  return (
    <div id="phone-content" style={{position:'absolute', inset:0, overflow:'hidden'}}
      onClick={() => { if (bubble) setBubble(null); }}>
      {current}
      {renderBubble()}
      {renderCtxMenu()}
      {renderSheet()}
      {renderConfirm()}
      {renderToast()}
    </div>
  );
}

/* ================= 舞台与引导 ================= */
function App(){
  return (
    <div className="stage">
      <div className="guide">
        <div className="guide-brand"><ISprout size={34}/><span className="guide-name">知芽</span></div>
        <div className="guide-sub">TreeLearn · 树状分支学习 · 高保真交互原型 v1</div>
        <h3>验收走查路径</h3>
        <ol className="guide-steps">
          <li><b>空状态发送根问题</b> → 未配置 Key 被阻止，输入保留；去配置后回来继续（BASE-05/18）</li>
          <li><b>发送成功</b> → 主题与根分支同时形成，临时标题 → AI 正式命名一次（BASE-06）</li>
          <li>阅读页点击<b>虚线下划线文字</b> → 划词分叉；底部「作为来源新建分支」整条分叉（BASE-07）</li>
          <li>推荐问题：点文字=当前分支追问，点右侧 <b>⑂</b>=新建分支（BASE-16）</li>
          <li>「多头相比单头的收益」分支：<b>部分回答</b>不可分叉 + 原位重试（BASE-15）</li>
          <li>逐层导航：祖先路径 / 最近使用 / 更多 / 搜索；对非根分支<b>归档整树</b>（BASE-10/14）</li>
          <li>总览画布：平移缩放、折叠子树、节点详情、回到当前（BASE-11）</li>
          <li>已归档：<b>查看详情</b> 与 <b>恢复整树</b> 是两个动作（评审要求）</li>
          <li>未读蓝点：离开生成中的分支 → 完成后出现蓝点；进入并看到最新回答后清除（BASE-13）</li>
        </ol>
        <h3>图例</h3>
        <div className="legend">
          <span className="k"><span className="dot"/>未读回答</span>
          <span className="k"><span className="anchor-sample">虚线下划线</span>可划词分叉</span>
          <span className="k"><span className="fork-sample">⑂</span>分叉入口</span>
        </div>
      </div>
      <AndroidFrame>
        <AppPhone/>
      </AndroidFrame>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
