  /* ================= 页面：总览画布 ================= */
  // 植物化布局（BASE-11：节点不可自由摆放）
  // 映射规则：一个分支 = 一段枝；该分支的对话轮数 = 这段枝的长度；
  //          有子分支 = 枝干；没有子分支 = 叶子（探索前沿）
  const CV_SEG_BASE = 120, CV_SEG_STEP = 36, CV_SEG_MAX = 300;
  const CV_LEAF_L = 34, CV_LEAF_W = 15;
  const CV_LBL_W = 136, CV_LBL_H = 24, CV_SOIL = 44;
  const CV_LBL_LANE = 30;                    // 树冠上方标题栏的行距
  const CV_FAN_MAX = 46, CV_FAN_STEP = 16;   // 扇角收窄：枝向上长，不铺成扇面
  const CV_DEPTH_DECAY = 0.82;               // 越深的枝越短（分形），主干因此明显主导
  const CV_SPROUT = 0.22;                    // 子枝沿父枝错开起点的比例，避免全从一点发散
  const dataRef = useRef(data); dataRef.current = data;
  const cvZoomRef = useRef(1); cvZoomRef.current = cvZoom;

  const roundsOf = (b) => b ? b.messages.filter(m => m.role === 'user').length : 0;
  // 轮数越多这段枝越长——话题聊得越久树越高，但轮数本身不长侧枝
  const segLenOf = (b, depth) => Math.min(
    CV_SEG_MAX, (CV_SEG_BASE + roundsOf(b) * CV_SEG_STEP) * Math.pow(CV_DEPTH_DECAY, depth)
  );
  // 这段枝下面挂着几片叶：决定枝的粗细（主干粗、末梢细）
  const leavesUnder = (brs, id) => {
    const b = brs[id];
    if (!b) return 0;
    const kids = b.children.filter(c => brs[c] && !brs[c].archived);
    return kids.length ? kids.reduce((n, k) => n + leavesUnder(brs, k), 0) : 1;
  };
  const limbWidth = (brs, id, depth) => Math.max(
    2, Math.min(14, (2 + 2.6 * Math.sqrt(leavesUnder(brs, id))) / (1 + 0.5 * depth))
  );
  // 直线枝段：起点宽 w1、末点宽 w2，画出带锥度的实心枝
  const taperPath = (x1, y1, x2, y2, w1, w2) => {
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    return `M${x1 + nx * w1 / 2},${y1 + ny * w1 / 2} L${x2 + nx * w2 / 2},${y2 + ny * w2 / 2}`
      + ` L${x2 - nx * w2 / 2},${y2 - ny * w2 / 2} L${x1 - nx * w1 / 2},${y1 - ny * w1 / 2} Z`;
  };
  // 柳叶：以枝梢为原点、沿该枝方向抽出的一片叶
  const CV_LEAF_PATH = `M0,0 C${CV_LEAF_W / 2},${-CV_LEAF_L * 0.32} ${CV_LEAF_W / 2},${-CV_LEAF_L * 0.72} 0,${-CV_LEAF_L}`
    + ` C${-CV_LEAF_W / 2},${-CV_LEAF_L * 0.72} ${-CV_LEAF_W / 2},${-CV_LEAF_L * 0.32} 0,0 Z`;
  // 子枝沿父枝方向扇形展开，扇区宽度按各自叶片数分配——保证同层枝不重叠
  const layoutTreeFrom = (brs, rootId) => {
    const pos = {};
    const dfs = (id, depth, px, py, dir) => {
      const br = brs[id];
      if (!br) return;
      const kids = br.children.filter(c => brs[c] && !brs[c].archived);
      const len = segLenOf(br, depth);
      const tipX = px + Math.sin(dir) * len;
      const tipY = py - Math.cos(dir) * len;
      pos[id] = {
        x: tipX, y: tipY, baseX: px, baseY: py, dir, depth, len,
        w: limbWidth(brs, id, depth),
        kids: br.collapsed ? [] : kids,
        allKids: kids,
      };
      if (kids.length && !br.collapsed){
        const fan = Math.min(CV_FAN_MAX, (kids.length - 1) * CV_FAN_STEP) * Math.PI / 180;
        const weights = kids.map(k => leavesUnder(brs, k));
        const total = weights.reduce((a, c) => a + c, 0) || 1;
        let acc = 0;
        kids.forEach((k, i) => {
          const start = acc / total; acc += weights[i];
          // 先分出去的枝从更低的位置抽出（老枝低、新枝靠近梢），像真树的分枝
          const back = kids.length > 1 ? (1 - i / (kids.length - 1)) * CV_SPROUT * len : 0;
          dfs(k, depth + 1,
            tipX - Math.sin(dir) * back, tipY + Math.cos(dir) * back,
            dir + ((start + acc / total) / 2 - 0.5) * 2 * fan);
        });
      }
    };
    dfs(rootId, 0, 0, 0, 0); // 根扎在底部，枝干向上生长
    return pos;
  };
  const layoutTree = (rootId) => layoutTreeFrom(branches, rootId);
  // 折叠/展开时保持被操作节点的屏幕位置稳定（BASE-11）
  const toggleFoldStable = (id, before) => {
    upBranch(id, x => ({...x, collapsed: !x.collapsed}));
    setTimeout(() => {
      const brs = dataRef.current.branches;
      const br = brs[id];
      if (!br) return;
      const t = dataRef.current.topics[br.topicId];
      const after = layoutTreeFrom(brs, t.rootId)[id];
      if (!after) return;
      const z = cvZoomRef.current;
      if (before){
        setCvPan(p => ({x: p.x + (before.x - after.x) * z, y: p.y + (before.y - after.y) * z}));
      } else {
        const host = document.getElementById('canvas-host');
        const w = host ? host.clientWidth : 380;
        setCvPan({x: w / 2 - after.x * z, y: 120 - after.y * z});
      }
    }, 50);
  };
  const openCanvas = () => {
    const b = branches[currentBranchId];
    if (b){
      const t = topicOf(b.id);
      const pos = layoutTree(t.rootId);
      const viewW = 412 - 24, viewH = 700;
      // 进入画布保持可读缩放并把当前分支放在视野中下部（站在自己那根枝旁边）；
      // 整树轮廓交给工具条里的「适应屏幕」
      const z = 0.92;
      setCvZoom(z);
      const cur = pos[currentBranchId] || pos[t.rootId];
      setCvPan({x: viewW / 2 - cur.x * z, y: viewH - 180 - cur.y * z});
    }
    setScreen('canvas');
  };
  const renderCanvas = () => {
    const b = branches[currentBranchId];
    if (!b) return null;
    const topic = topicOf(b.id);
    const rootId = topic.rootId;
    const pos = layoutTree(rootId);
    // 当前路径（根 → 当前分支）：只有这条路挂标题，并把枝色加深
    const pathIds = new Set([currentBranchId, ...ancestorsOf(currentBranchId).map(x => x.id)]);
    // 三级信息密度：远景只看形态，中景看叶子标题，近景再看摘要首行
    const tier = cvZoom < 0.72 ? 'far' : (cvZoom < 1.05 ? 'mid' : 'near');
    const showLabel = tier !== 'far';
    const near = tier === 'near';
    // 标题牌排布：叶子的标题牌统一排在树冠上方的标题栏里（多行），每块用一根细引线垂到自己的叶子。
    // 手机宽度下 6 片叶子的标题横排必然互相压住，所以不挤在叶尖旁边，而是排成整齐的行。
    const tipOf = (id) => {
      const p = pos[id];
      return {x: p.x + Math.sin(p.dir) * CV_LEAF_L, y: p.y - Math.cos(p.dir) * CV_LEAF_L};
    };
    const lblPos = {};
    {
      const leafIds = Object.keys(pos).filter(id => !pos[id].allKids.length);
      if (leafIds.length){
        const tips = {};
        leafIds.forEach(id => { tips[id] = tipOf(id); });
        // 标题栏整体压在树冠之上，因此永远盖不住任何一片叶子
        const topY = Math.min(...leafIds.map(id => tips[id].y)) - 14;
        const ordered = leafIds.map(id => ({id, t: tips[id]})).sort((a, b) => a.t.x - b.t.x);
        const ci = ordered.findIndex(o => o.id === currentBranchId);
        if (ci > 0) ordered.unshift(ordered.splice(ci, 1)[0]); // 当前分支先落位
        const rows = [];
        ordered.forEach(({id, t}) => {
          for (let r = 0; r < 4; r++){
            const lane = rows[r] || (rows[r] = []);
            const x1 = t.x - CV_LBL_W / 2, x2 = x1 + CV_LBL_W;
            if (lane.some(b => x1 < b.x2 + 8 && x2 > b.x1 - 8)) continue;
            lane.push({x1, x2});
            lblPos[id] = {x: x1, y: topY - CV_LBL_H - r * CV_LBL_LANE};
            return;
          }
          // 标题栏排不下（分支特别多）就只留叶形，点叶子照样能看标题
        });
      }
    }
    const onWheel = (e) => {
      const k = e.deltaY < 0 ? 1.12 : 0.9;
      setCvZoom(z => Math.min(1.6, Math.max(0.35, z * k)));
    };
    // 拖动时先收起跟手弹窗，避免它停在一个已经移走的锚点上
    const onPointerDown = (e) => {
      setPopover(null);
      dragRef.current = {sx: e.clientX, sy: e.clientY, ox: cvPan.x, oy: cvPan.y};
    };
    const onPointerMove = (e) => {
      if (!dragRef.current) return;
      setCvPan({x: dragRef.current.ox + e.clientX - dragRef.current.sx, y: dragRef.current.oy + e.clientY - dragRef.current.sy});
    };
    const onPointerUp = () => { dragRef.current = null; };
    const centerOn = (id) => {
      if (!pos[id]) return;
      const host = document.getElementById('canvas-host');
      const w = host ? host.clientWidth : 380, h = host ? host.clientHeight : 600;
      setCvPan({x: w / 2 - pos[id].x * cvZoom, y: h / 2 - pos[id].y * cvZoom - 40});
    };
    // 点节点：贴着它弹出一张跟手小卡片（标题 / 摘要 / 进去聊 / 折叠）
    const openNode = (e, id, p) => {
      e.stopPropagation();
      const r = e.currentTarget.getBoundingClientRect();
      const host = document.getElementById('phone-content').getBoundingClientRect();
      setPopover({
        kind: 'node', payload: {id, at: {x: p.x, y: p.y}}, w: 244,
        anchorTop: r.top - host.top,
        anchorBottom: r.bottom - host.top,
        anchorCx: r.left - host.left + r.width / 2,
        x: 0, y: 0, placeTop: true, arrowX: 122,
      });
    };
    // 适应屏幕：整棵树收进视野；底部对齐——根坐在土地上，上方留出生长空间
    const fitToScreen = () => {
      const host = document.getElementById('canvas-host');
      const w = host ? host.clientWidth : 380, h = host ? host.clientHeight : 600;
      const xs = [], ys = [];
      Object.keys(pos).forEach(id => {
        const p = pos[id];
        xs.push(p.x - 30, p.x + 30);
        ys.push(p.y, p.baseY);
      });
      Object.keys(lblPos).forEach(id => {
        xs.push(lblPos[id].x, lblPos[id].x + CV_LBL_W);
        ys.push(lblPos[id].y);
      });
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minY = Math.min(...ys), maxY = Math.max(...ys) + CV_SOIL;
      const tw = maxX - minX, th = maxY - minY;
      const pad = 26;
      const z = Math.min(1.25, Math.max(0.32, Math.min((w - pad * 2) / tw, (h - pad * 2) / th)));
      setCvZoom(z);
      setCvPan({x: (w - tw * z) / 2 - minX * z, y: h - pad - maxY * z});
    };
    return (
      <div className="screen" key="canvas">
        <div className="appbar">
          <button className="icon-btn" onClick={() => setScreen('chat')}><IBack/></button>
          <div className="appbar-title"><div className="t1">总览画布</div><div className="t2">{branches[rootId].title}</div></div>
          <button className="icon-btn" onClick={() => { setSearchQ(''); setScreen('search'); }}><ISearch/></button>
        </div>
        <div className="canvas-wrap" id="canvas-host" onWheel={onWheel}
          onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerLeave={onPointerUp}
          style={{cursor: dragRef.current ? 'grabbing' : 'grab'}}>
          <div className="canvas-tools">
            <button onClick={() => setCvZoom(z => Math.min(1.6, z * 1.18))} title="放大">+</button>
            <button onClick={() => setCvZoom(z => Math.max(0.32, z * 0.85))} title="缩小">−</button>
            <button onClick={fitToScreen} title="适应屏幕"><IFit/></button>
            <button onClick={() => centerOn(currentBranchId)} title="回到当前分支"><ILocate size={17}/></button>
          </div>
          <svg width="100%" height="100%" style={{display:'block', touchAction:'none', overflow:'hidden'}}>
            <g transform={`translate(${cvPan.x},${cvPan.y}) scale(${cvZoom})`}>
              {/* 枝与叶 */}
              {Object.keys(pos).map(id => {
                const p = pos[id], br = branches[id];
                if (!br) return null;
                const onPath = pathIds.has(id);
                const isLeaf = p.allKids.length === 0;
                // 整棵树同色系到底：主干深、末梢浅；当前路径只是略微加重，不把其他枝压到看不见
                const stroke = onPath ? '#1F5C38' : '#2E7D4F';
                const op = onPath ? 1 : 0.62;
                const sin = Math.sin(p.dir), cos = Math.cos(p.dir);
                return (
                  <g key={'L' + id} className="cv-limb">
                    {/* 枝干：根部粗、末梢细的直线段 */}
                    <path d={taperPath(p.baseX, p.baseY, p.x, p.y, p.w, p.w * 0.66)} fill={stroke} fillOpacity={op}/>
                    {/* 木节：已经分出子枝的位置 */}
                    {!isLeaf && <circle cx={p.x} cy={p.y} r={p.w * 0.46} fill={stroke} fillOpacity={op}/>}
                    {/* 叶子：没有子分支的枝，末梢抽出一片叶 */}
                    {isLeaf && (
                      <path className="cv-leaf" d={CV_LEAF_PATH} transform={`translate(${p.x},${p.y}) rotate(${p.dir * 180 / Math.PI})`}
                        fill={stroke} fillOpacity={onPath ? 0.95 : 0.6}/>
                    )}
                    {/* 未读露珠：挂在叶面上 */}
                    {isLeaf && br.unread && (
                      <circle cx={p.x + sin * CV_LEAF_L * 0.6 + cos * CV_LEAF_W * 0.46}
                        cy={p.y - cos * CV_LEAF_L * 0.6 + sin * CV_LEAF_W * 0.46}
                        r={3.6} fill="#2F6BFF"/>
                    )}
                    {/* 折叠后收成一颗芽，标出被收起的分支数；后代有未读时挂一颗露珠（BASE-13） */}
                    {!isLeaf && br.collapsed && (
                      <g className="cv-bud">
                        <circle cx={p.x} cy={p.y} r={12} fill="#FFFFFF" stroke={stroke} strokeWidth={1.5}/>
                        <text x={p.x} y={p.y + 3.5} textAnchor="middle" fontSize="10" fontWeight="600" fill={stroke}>
                          +{hiddenDescCount(id)}
                        </text>
                        {hiddenUnreadCount(id) > 0 && <circle cx={p.x + 9} cy={p.y - 9} r={4} fill="#2F6BFF"/>}
                      </g>
                    )}
                  </g>
                );
              })}
              {/* 引线：标题牌垂到它自己那片叶子上 */}
              {showLabel && Object.keys(lblPos).map(id => {
                const t = tipOf(id), lp = lblPos[id];
                return (
                  <line key={'D' + id} x1={lp.x + CV_LBL_W / 2} y1={lp.y + CV_LBL_H}
                    x2={t.x} y2={t.y} stroke="#2E7D4F" strokeOpacity=".32" strokeWidth="1"/>
                );
              })}
              {/* 标题：叶子挂能放下的那些；枝干只挂当前路径上的（BASE-11 允许缩小时只显示标题） */}
              {Object.keys(pos).map(id => {
                const p = pos[id], br = branches[id];
                if (!br) return null;
                const onPath = pathIds.has(id);
                const isLeaf = p.allKids.length === 0;
                const lp = isLeaf ? lblPos[id] : null;
                const labeled = showLabel && (isLeaf ? !!lp : onPath);
                const anchor = isLeaf ? tipOf(id) : {x: p.x, y: p.y};
                const lx = isLeaf ? (lp ? lp.x : 0) : anchor.x + 12;
                const ly = isLeaf ? (lp ? lp.y : 0) : anchor.y - CV_LBL_H / 2;
                const bh = (near && isLeaf && br.summary) ? CV_LBL_H + 19 : CV_LBL_H;
                return (
                  <foreignObject key={'N' + id} style={{overflow:'visible'}}
                    x={labeled ? lx : anchor.x - 22} y={labeled ? ly - (bh - CV_LBL_H) / 2 : anchor.y - 22}
                    width={labeled ? CV_LBL_W : 44} height={labeled ? bh : 44}>
                    <div className={'cv-lbl-wrap' + (labeled ? '' : ' bare')}
                      onClick={(e) => openNode(e, id, p)}>
                      {labeled && (
                        <React.Fragment>
                          <div className={'cv-lbl' + (onPath ? ' on' : '')}>
                            {br.unread && <span className="cv-lbl-dot"/>}
                            <span className="cv-lbl-t">{br.title}</span>
                          </div>
                          {near && isLeaf && br.summary && <div className="cv-lbl-sub">{br.summary}</div>}
                        </React.Fragment>
                      )}
                    </div>
                  </foreignObject>
                );
              })}
            </g>
          </svg>
        </div>
      </div>
    );
  };

  /* ================= 页面：搜索 ================= */
  const renderSearch = () => {
    const results = searchAll(searchQ);
    return (
      <div className="screen" key="search">
        <div className="appbar">
          <button className="icon-btn" onClick={() => setScreen('home')}><IBack/></button>
          <div className="appbar-title"><div className="t1">搜索</div></div>
        </div>
        <div className="search-bar">
          <ISearch size={16}/>
          <input autoFocus placeholder="标题、问题、回答、锚定原文…" value={searchQ} onChange={e => setSearchQ(e.target.value)}/>
          {searchQ && <button onClick={() => setSearchQ('')} style={{color:'var(--ink3)'}}><IClose size={15}/></button>}
        </div>
        <div className="search-scope">标题 · 问题 · 回答 · 锚定原文</div>
        <div className="body-scroll" style={{paddingBottom:30}}>
          {searchQ && results.length === 0 && <div style={{padding:'30px 18px',fontSize:13,color:'var(--ink3)',textAlign:'center'}}>没有找到「{searchQ}」</div>}
          {!searchQ && <div style={{padding:'30px 18px',fontSize:13,color:'var(--ink3)',textAlign:'center'}}>输入关键词开始搜索</div>}
          {results.map((r, i) => {
            const br = branches[r.bid];
            return (
              <div className="result-card" key={i} style={{animationDelay:(i*0.03)+'s'}} onClick={() => {
                if (br.archived) setSheet({type:'archSearchHit', payload:{id: r.bid}});
                else openBranch(r.bid);
              }}>
                <div className="r-path">
                  {r.path.map((p, j) => <span key={j}>{j > 0 ? ' › ' : ''}{p}</span>)}
                  {r.archived && <span className="chip-arch">已归档</span>}
                  <span className="chip-type">{r.type}</span>
                </div>
                <div className="r-title">{br.unread && <span className="udot"/>}{br.title}</div>
                <div className="r-snip">{r.snip}</div>
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  /* ================= 页面：已归档 ================= */
  const renderArchived = () => {
    const roots = Object.values(branches).filter(b => b.archived && !(b.parentId && branches[b.parentId] && branches[b.parentId].archived));
    return (
      <div className="screen" key="archived">
        <div className="appbar">
          <button className="icon-btn" onClick={() => setScreen('home')}><IBack/></button>
          <div className="appbar-title"><div className="t1">已归档</div></div>
        </div>
        <div className="body-scroll" style={{paddingBottom:30}}>
          {roots.length === 0 && (
            <div style={{padding:'50px 24px',textAlign:'center',color:'var(--ink3)',fontSize:13,lineHeight:2}}>
              <IBox size={30}/><br/>暂无已归档子树
            </div>
          )}
          {roots.map((b, i) => {
            const n = descendants(b.id).length;
            const parent = b.parentId && branches[b.parentId];
            return (
              <div className="arch-row" key={b.id} style={{animationDelay:(i*0.05)+'s'}}>
                <div className="a-title"><IBox size={15}/>{b.title}</div>
                <div className="a-meta">含 {n} 个后代 · 来源：{parent ? parent.title : '—'}</div>
                <div className="a-actions">
                  <button className="btn-ghost" onClick={() => setSheet({type:'archDetail', payload:{id: b.id}})}>查看详情</button>
                  <button className="btn-primary" style={{padding:'8px',fontSize:12.5}} onClick={() => restoreSubtree(b.id)}>恢复整棵子树</button>
                  <button className="btn-danger" style={{flex:'0 0 44px',padding:'8px 0'}} onClick={() => deleteSubtree(b.id)}><ITrash size={15}/></button>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  /* ================= 页面：设置 ================= */
  const renderSettings = () => {
    const masked = {ok:'sk-••••••••••3f2a', invalid:'sk-••••••••••0x9e'};
    return (
      <div className="screen" key="settings">
        <div className="appbar">
          <button className="icon-btn" onClick={() => setScreen('home')}><IBack/></button>
          <div className="appbar-title"><div className="t1">设置</div></div>
        </div>
        <div className="body-scroll" style={{paddingBottom:30}}>
          <div className="set-section">
            <div className="set-label">DEEPSEEK API KEY</div>
            <div className="set-card">
              <div className="set-row">
                <div className="sr-main">
                  <div className="sr-title" style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                    <IKey size={15}/>
                    {keyStatus === 'ok' && <React.Fragment><span>{masked.ok}</span><span className="key-ok">可用</span></React.Fragment>}
                    {keyStatus === 'invalid' && <React.Fragment><span>{masked.invalid}</span><span className="key-bad">无效 / 额度不足</span></React.Fragment>}
                    {keyStatus === 'none' && <React.Fragment><span style={{color:'var(--ink3)'}}>未配置</span><span className="key-none">发送将被阻止</span></React.Fragment>}
                  </div>
                  <div className="sr-sub">仅存本机，可随时替换或删除。</div>
                </div>
              </div>
              <div className="key-input-row">
                <input id="key-input" placeholder="粘贴新的 DeepSeek API Key"/>
                <button className="btn-primary" style={{padding:'9px 14px',fontSize:12.5}} onClick={() => {
                  const v = document.getElementById('key-input').value.trim();
                  if (!v){ toast('请先输入 Key'); return; }
                  setKeyStatus('ok');
                  toast('Key 已配置，可返回继续发送');
                }}>保存</button>
              </div>
              <div style={{display:'flex',gap:8,marginTop:10,flexWrap:'wrap'}}>
                <button className="btn-ghost" style={{padding:'7px 12px',fontSize:12}} onClick={() => { setKeyStatus('ok'); toast('已填入演示 Key（可用状态）'); }}>使用演示 Key</button>
                <button className="btn-ghost" style={{padding:'7px 12px',fontSize:12}} onClick={() => { setKeyStatus('invalid'); toast('已切换为无效 Key（演示拦截）'); }}>模拟无效 Key</button>
                {keyStatus !== 'none' && <button className="btn-danger" style={{padding:'7px 12px',fontSize:12}} onClick={() => { setKeyStatus('none'); toast('Key 已删除'); }}>删除 Key</button>}
              </div>
            </div>
          </div>
          <div className="set-section">
            <div className="set-label">数据边界</div>
            <div className="set-note">
              主题、分支、思考内容与 Key <b>仅存本机</b>，无云同步与备份，卸载后不可恢复。<br/>
              生成时相关内容会交由外部 DeepSeek 服务处理；历史思考内容会按上下文策略再次提交。
            </div>
          </div>
          <div className="set-section">
            <div className="set-label">演示数据</div>
            <div className="set-card" style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              <button className="btn-ghost" onClick={() => { setData(buildDemo()); setScreen('home'); toast('已载入示例主题'); }}>载入示例主题</button>
              <button className="btn-ghost" onClick={() => { setData({topicOrder:[], topics:{}, branches:{}}); setCurrentBranchId(null); setScreen('home'); toast('已重置为空白状态'); }}>重置为空白</button>
            </div>
          </div>
          <div style={{padding:'26px 18px',textAlign:'center',fontSize:11,color:'var(--ink3)',lineHeight:1.9}}>
            知芽（TreeLearn） · 高保真交互原型 v2.5<br/>依据 V3.0 + V3.1 增量需求基准 · BASE-05 ~ BASE-25<br/>
            <span style={{fontSize:10.5}}>字体：正文 霞鹜文楷 · 题字 马善政毛笔楷书（均开源可商用，CDN 分片加载）</span>
          </div>
        </div>
      </div>
    );
  };

  /* ================= 路由 ================= */
  let current = null;
  if (screen === 'home') current = renderHome();
  else if (screen === 'chat'){
    const b = branches[currentBranchId];
    if (!b){ current = renderHome(); }
    else {
      const topic = topicOf(b.id);
      const isRoot = b.parentId === null;
      current = (
        <ChatScreen
          b={b} root={branches[topic.rootId]} isRoot={isRoot}
          topicUnread={anyUnreadInTopic(topic.id)}
          composerCtx={composerCtx} branches={branches}
          composerDraft={composerDraft}
          onDraftChange={setComposerDraft}
          onSend={sendChat}
          onBack={() => { setComposerCtx(null); isRoot ? setScreen('home') : openBranch(b.parentId); }}
          onOpenNav={() => setScreen('nav')}
          onOpenCanvas={openCanvas}
          onSourceReturn={() => {
            const src = b.source;
            if (src && branches[src.branchId]) openBranch(src.branchId, {flash:{msgId: src.msgId, anchorText: src.anchorText}});
          }}
          onPickSentence={pickSentence}
          onRetry={retryMsg}
          onStartFork={startFork}
          onForkNow={forkNow}
          onCopyMsg={copyMsg}
          onResetMsg={resetMsg}
          onOpenChildren={openChildren}
          onCancelCtx={() => { setComposerCtx(null); setComposerDraft(''); }}
          onClearUnread={(id) => upBranch(id, x => ({...x, unread:false}))}
          scrollPosRef={scrollPosRef} viewRef={viewRef} flashRef={flashRef}
          modelLabel={modelLabel} thinking={thinking}
          onOpenModel={(e) => openPopover(e.currentTarget, 226)}
        />
      );
    }
  }
  else if (screen === 'nav') current = renderNav();
  else if (screen === 'canvas') current = renderCanvas();
  else if (screen === 'search') current = renderSearch();
  else if (screen === 'archived') current = renderArchived();
  else if (screen === 'settings') current = renderSettings();

  return (
    <div id="phone-content" style={{position:'absolute', inset:0, overflow:'hidden'}}>
      {current}
      {renderBubble()}
      {renderPopover()}
      {renderCtxMenu()}
      {renderSheet()}
      {renderConfirm()}
      {renderToast()}
    </div>
  );
}

          <li>发送根问题 → 主题与根分支同时形成，临时标题 → AI 正式命名一次（BASE-06）</li>
          <li>回答<b>不是卡片</b>：正文直接落在纸面上，靠留白与标识行分层；标识行只保留产品名（v2.0 去卡片 / v2.1 去数据胶囊）</li>
          <li><b>回答操作行四项</b>（v2.4）：复制 / 重置 / 新建分支 / <b>子分支列表</b>（带数量角标，标明这条回答分出了几个一级子分支）+ 生成时间。点「子分支列表」贴着按钮弹出列表，点一条<b>直接进入那个分支</b>，方便回查从这条回答延伸出了哪些方向</li>
          <li><b>推荐问题只挂最新回答</b>（v2.4）：只有在当前分支最后那条回答下方才出现推荐问题——继续追问后，上一条回答立即隐藏推荐。推荐回答的是「接下来往哪走」，不是历史陈列（BASE-16）</li>
          <li><b>长按任意句子</b>（480ms）→ 该句高亮选中 → 弹菜单：追问 · 新建分支 · 复制 · 全选（v1.2）</li>
          <li><b>输入框内模型标识</b> → 点开的是贴着它弹出的小弹窗（非底部滑板），空间不足自动翻转（v1.3）</li>
          <li><b>思考过程</b>（v2.5）：开启思考模式后先生成推理再生成最终回答；推理默认折叠，点击展开后以较灰文字显示，复制整条回答时与最终回答一并复制（BASE-23）</li>
          <li>推荐问题<b>两入口都直达</b>：点文字 = 当前分支直接追问发出；点右侧 44×44 <b>圆形</b>分叉热区 = 直接用这个问题新建分支并发出。都不经输入框等待编辑（v2.2）</li>
          <li><b>分支导航页顶部</b>是 AI 总结：独立卡片、只汇总当前分支、脚注为数据而非说明（v1.3/v2.0）</li>
          <li>「多头相比单头的收益」分支：<b>部分回答</b>不可分叉 + 原位重试（BASE-15）</li>
          <li><b>总览画布是一棵真的树</b>（v2.3）：一个分支 = 一段枝，<b>这段枝的长度 = 这个分支聊了几轮</b>——同一话题聊得越久树越高，但聊天本身不长侧枝；<b>没有子分支的枝末端抽出一片叶子</b>，长出子分支后它木质化成枝干、新子分支成为新的叶子。主干粗、末梢细，主干预端有木节</li>
          <li>画布<b>三级信息密度</b>：远景（缩小）只看树形；中景看树冠上方成行排列的标题牌（细引线垂到各自的叶子，互相不压、也不遮叶子）；近景叶子再显示摘要首行。点任意叶子/枝干 → 贴着它弹出小卡片（标题 / 摘要 / 来源 / 进去聊 / 折叠）</li>
          <li>未读蓝点：离开生成中的分支 → 完成后出现蓝点；看到最新回答后清除（BASE-13）。未读在画布上表现为叶子上的<b>露珠</b>；折叠后收成一颗<b>芽</b>并标出被收起的分支数</li>
        </ol>

          <span className="k"><span className="fork-sample">⑂</span>分叉入口</span>
        </div>
      </div>
      <AndroidFrame>
        <AppPhone/>
      </AndroidFrame>
    </div>
  );
}
