<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知芽（TreeLearn） · 高保真交互原型 v2.5</title>

<!-- React + Babel pinned（huashu-design 规范） -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<!-- 霞鹜文楷：介于手写与印刷之间的楷体，为长阅读优化；按 unicode-range 分片按需加载 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-bold.css">

<style>
/* ============ 设计系统 · 知芽「生长绿」 ============ */
:root{
  /* —— 色彩 —— */
  --bg:#F4F1EB;          /* 米白纸感底 */
  --surface:#FCFBF8;
  --ink:#16241C;         /* 深绿墨 */
  --ink2:#435449;        /* 次级灰绿 */
  --ink3:#627067;        /* 弱化（修正值：新稿 #75867B 在 bg 上只有 3.42，低于 4.5） */
  --line:#E2DFD6;
  --hairline:rgba(26,40,32,.07);   /* 极淡分隔，替代重描边 */
  --green:#2B6E45;       /* 生长绿主色 */
  --green-deep:#164027;
  --green-soft:#E3F0E7;  /* 新稿为 rgba；Android 只收不透明 hex，故保留不透明值 */
  --green-faint:#F0F7F1;
  --blue:#2563EB;        /* 未读蓝点（BASE-13 指定实心蓝点） */
  --amber:#B05108;       /* 修正值：新稿 #B45309 在 bg 上只有 4.45，低于 4.5 */
  --amber-soft:#FBF3E2;
  --red:#C0392B;
  --red-soft:#FBEAE7;

  /* —— 间距系统：4pt 基准，只用 4/8/12/16/24/32 —— */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px;
  --gutter:20px;                     /* 页面左右安全边距 */

  /* —— 圆角系统：只保留 3 档 + 全圆 —— */
  --r-sm:8px;     /* chip、小按钮 */
  --r-md:14px;    /* 卡片 */
  --r-lg:18px;    /* 输入框、大容器 */
  --r-full:99px;

  /* —— 字号系统：display 与 caption 拉开约 2.4 倍对比 —— */
  --fs-display:26px;   /* 首页 hero */
  --fs-h1:20px;        /* 页面主标题 */
  --fs-h2:16px;        /* 卡片/分支标题 */
  --fs-body:15px;      /* 正文（阅读区，移动端建议值） */
  --fs-sm:13px;        /* 次要信息 */
  --fs-cap:11px;       /* 标注 */

  /* —— 阴影：只保留两档，克制 —— */
  --sh-1:0 1px 2px rgba(22,36,28,.04);
  --sh-2:0 4px 12px rgba(22,36,28,.06);

  /* —— 字体：正文走系统 sans-serif；品牌衬线走回退栈，本轮不打包字体 —— */
  --kai:'LXGW WenKai','Noto Serif SC','Songti SC',serif;   /* 遗留楷体：本片保留不删，退役待定 */
  --serif:'Noto Serif SC','Songti SC',Georgia,serif;       /* 品牌衬线回退栈（各 ROM 字形有差异） */
  --brush:'Ma Shan Zheng','LXGW WenKai',serif;             /* 品牌题字 */
  --sans:'Noto Sans SC',-apple-system,sans-serif;          /* 正文；Android 落系统 sans-serif */

  /* —— 纸感：极淡横格，读作纹理而非参考线；正文行高对齐格距 —— */
  --paper-rule:rgba(30,43,35,.028);
  --paper-write:rgba(46,125,79,.075);
  --lh-read:28px;   /* 阅读行高 == 格线间距，避免逐行错位 */
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
/* 中文排版：标题避孤字、正文避寡孀、标点挤压与行首行尾控制 */
h1,h2,h3,.serif{text-wrap:balance;}
p,li,span,div{text-wrap:pretty;}
.msg-ai,.msg-user,.nc-sum,.tc-sum,.br-sum,.cc-body,.sh-sub,.set-note{
  hanging-punctuation:first;
  text-spacing-trim:space-all;
}
body{
  font-family:var(--sans);color:var(--ink);background:#ECEAE0;
  background-image:radial-gradient(#d8d5c6 1px,transparent 1px);
  background-size:22px 22px;
}
#root{min-height:100vh;}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}
input,textarea{font-family:inherit;color:inherit;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:#C9C6B6;border-radius:4px;}

/* ============ 舞台（手机外） ============ */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:56px;padding:40px 24px;flex-wrap:wrap;}
.guide{width:300px;flex-shrink:0;}
.guide-brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.guide-name{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--ink);}
.guide-sub{font-size:12px;color:var(--ink2);margin-bottom:22px;letter-spacing:.04em;}
.guide h3{font-size:12px;color:var(--green-deep);letter-spacing:.18em;margin:18px 0 10px;font-weight:700;}
.guide-steps{counter-reset:step;list-style:none;}
.guide-steps li{counter-increment:step;font-size:12.5px;color:var(--ink2);line-height:1.65;padding:7px 0 7px 30px;position:relative;border-bottom:1px dashed var(--line);}
.guide-steps li::before{content:counter(step);position:absolute;left:0;top:8px;width:20px;height:20px;border-radius:50%;background:var(--green-soft);color:var(--green-deep);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.guide-steps li b{color:var(--ink);font-weight:500;}
.legend{font-size:12px;color:var(--ink2);line-height:2;}
.legend .k{display:inline-flex;align-items:center;gap:6px;margin-right:14px;}
.legend .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);display:inline-block;}
.legend .anchor-sample{border-bottom:1.5px dashed var(--green);color:var(--green-deep);}
.legend .fork-sample{color:var(--green);font-weight:700;}

/* ============ 手机内通用 ============ */
.screen{height:100%;display:flex;flex-direction:column;position:relative;font-family:var(--kai);
  background-color:var(--bg);
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--paper-rule) 31px 32px);
  animation:screenIn .28s cubic-bezier(.2,.8,.2,1);}
@keyframes screenIn{from{opacity:0;transform:translateX(14px);}to{opacity:1;transform:none;}}
.appbar{display:flex;align-items:center;gap:var(--s1);padding:var(--s2) var(--s3) var(--s2) var(--s4);border-bottom:1px solid var(--hairline);background:rgba(247,246,240,.88);z-index:5;min-height:56px;}
.appbar .icon-btn{width:44px;height:44px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;color:var(--ink2);position:relative;transition:background .15s;flex-shrink:0;}
.appbar .icon-btn:hover{background:var(--green-soft);color:var(--green-deep);}
.appbar .icon-btn .mini-dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--blue);border:1.5px solid var(--bg);}
.appbar-title{flex:1;min-width:0;padding-left:var(--s1);}
.appbar-title .t1{font-size:var(--fs-h2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;}
.appbar-title .t2{font-size:var(--fs-cap);color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.body-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;}
.udot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex-shrink:0;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(47,107,255,.35);}50%{box-shadow:0 0 0 4px rgba(47,107,255,0);}}
.chip-type{font-size:10px;padding:2px 7px;border-radius:99px;background:var(--green-soft);color:var(--green-deep);font-weight:500;white-space:nowrap;}
.chip-arch{font-size:10px;padding:2px 7px;border-radius:99px;background:#EDEBE2;color:var(--ink3);font-weight:500;white-space:nowrap;}
.btn-primary{background:var(--green);color:#fff;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:500;transition:background .15s,transform .1s;}
.btn-primary:hover{background:var(--green-deep);}
.btn-primary:active{transform:scale(.97);}
.btn-ghost{border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:13px;color:var(--ink2);background:var(--surface);}
.btn-ghost:hover{border-color:var(--green);color:var(--green-deep);}
.btn-danger{color:var(--red);border:1px solid #EAD0CB;border-radius:12px;padding:10px 16px;font-size:13px;background:var(--surface);}

/* ============ 通用控件 ============ */
.key-hint{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--amber);background:var(--amber-soft);padding:5px 10px;border-radius:99px;cursor:pointer;}
.send-fab{width:44px;height:44px;border-radius:var(--r-full);background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;transition:transform .12s,background .15s;flex-shrink:0;}
.send-fab:hover{background:var(--green-deep);}
.send-fab:active{transform:scale(.92);}
.send-fab:disabled{background:#CFD5CE;cursor:not-allowed;}
.demo-link{font-size:12px;color:var(--ink3);text-decoration:underline;text-underline-offset:3px;}
.demo-link:hover{color:var(--green-deep);}

/* ============ 首页 ============ */
.home-hero{padding:var(--s4) var(--gutter) var(--s6);}
.home-hero .hh-title{font-family:var(--brush);font-size:var(--fs-display);font-weight:400;line-height:1.4;letter-spacing:.01em;}
.home-hero .hh-sub{font-family:var(--kai);font-size:var(--fs-sm);color:var(--ink2);line-height:1.7;margin-top:var(--s2);}
/* 输入框用信纸格线，暗示"在这里书写" */
.home-input{margin:0 var(--gutter);background:var(--surface);border-radius:var(--r-lg);padding:var(--s4);box-shadow:var(--sh-1);}
.home-input textarea{width:100%;border:none;outline:none;resize:none;font-size:var(--fs-body);line-height:32px;min-height:64px;background:transparent;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--paper-write) 31px 32px);background-attachment:local;}
.home-input textarea::placeholder{color:var(--ink3);}
.home-input .foot{display:flex;justify-content:space-between;align-items:center;margin-top:var(--s2);gap:var(--s2);}
.home-sec{display:flex;align-items:baseline;gap:var(--s2);padding:var(--s6) var(--gutter) var(--s3);}
.home-sec .hs-t{font-size:var(--fs-sm);font-weight:600;color:var(--ink);letter-spacing:.02em;}
.home-sec .hs-n{font-size:var(--fs-cap);color:var(--ink3);}
.home-empty{padding:var(--s6) var(--gutter) var(--s8);text-align:center;color:var(--ink3);font-size:var(--fs-sm);line-height:1.9;}
.icon-badge{position:absolute;top:9px;right:9px;font-size:9px;background:var(--ink3);color:#fff;border-radius:var(--r-full);padding:1px 5px;font-weight:600;}

/* ============ 主题列表 ============ */
.topic-list{padding:0 var(--gutter) var(--s8);}
.topic-card{background:var(--surface);border:none;border-radius:var(--r-md);padding:var(--s4);margin-bottom:var(--s3);box-shadow:var(--sh-1);cursor:pointer;transition:transform .15s,box-shadow .15s;animation:cardIn .35s cubic-bezier(.2,.8,.2,1) backwards;}
@keyframes cardIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.topic-card:hover{transform:translateY(-2px);box-shadow:var(--sh-2);}
.topic-card .tc-top{display:flex;align-items:flex-start;gap:var(--s2);}
.topic-card .tc-title{font-family:var(--serif);font-size:var(--fs-h2);font-weight:600;line-height:1.45;flex:1;min-width:0;letter-spacing:-.01em;}
.topic-card .tc-sum{font-size:var(--fs-sm);color:var(--ink2);line-height:1.7;margin-top:var(--s2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.topic-card .tc-meta{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s3);font-size:var(--fs-cap);color:var(--ink3);}

/* ============ 对话阅读页 ============ */
.source-banner{margin:var(--s3) var(--gutter) 0;background:var(--green-faint);border-radius:var(--r-sm);padding:var(--s2) var(--s3);font-size:var(--fs-cap);color:var(--green-deep);display:flex;align-items:center;gap:var(--s2);cursor:pointer;animation:cardIn .3s backwards;}
.source-banner:hover{background:var(--green-soft);}
.source-banner .q{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.source-banner .sb-ver{font-size:10px;padding:1px 6px;border-radius:var(--r-full);background:rgba(46,125,79,.14);font-weight:600;flex-shrink:0;}
.arch-banner{margin:var(--s3) var(--gutter) 0;background:rgba(30,43,35,.05);border-radius:var(--r-sm);padding:var(--s2) var(--s3);font-size:var(--fs-cap);color:var(--ink2);display:flex;gap:var(--s2);align-items:center;}
.msg-flow{padding:var(--s4) var(--gutter) var(--s8);display:flex;flex-direction:column;gap:var(--s6);}
.msg-user{align-self:flex-end;max-width:84%;background:var(--green);color:#fff;border-radius:var(--r-md) var(--r-md) var(--s1) var(--r-md);padding:var(--s3) var(--s4);font-size:var(--fs-body);line-height:1.7;animation:msgIn .3s cubic-bezier(.2,.8,.2,1);word-break:break-word;}
/* AI 回答不做卡片：文字直接落在纸感底上，靠留白与标识行分层（减容器） */
.msg-ai{align-self:stretch;background:transparent;border:none;padding:0;font-size:var(--fs-body);line-height:var(--lh-read);color:var(--ink);animation:msgIn .3s cubic-bezier(.2,.8,.2,1);word-break:break-word;}
@keyframes msgIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.ai-tag{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s2);font-size:var(--fs-cap);color:var(--ink3);letter-spacing:.06em;margin-bottom:var(--s3);}
.ai-tag .at-brand{color:var(--green-deep);font-weight:500;display:flex;align-items:center;gap:3px;}
.anchor-span{color:var(--green-deep);border-bottom:1.5px dashed var(--green);cursor:pointer;padding-bottom:1px;transition:background .15s;}
.anchor-span:hover{background:var(--green-soft);}
.anchor-span.flash,.flash-target{animation:flashBg 1.8s ease-out;}
@keyframes flashBg{0%{background:#F5D98C;}60%{background:#F5E9C4;}100%{background:transparent;}}
.typing-cursor{display:inline-block;width:2px;height:1em;background:var(--green);vertical-align:-2px;margin-left:2px;animation:blink .8s infinite;}
@keyframes blink{50%{opacity:0;}}
.gen-note{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s3);font-size:var(--fs-cap);color:var(--ink3);}
.gen-dots i{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--green);margin-right:3px;animation:genDot 1.2s infinite;}
.gen-dots i:nth-child(2){animation-delay:.15s;}.gen-dots i:nth-child(3){animation-delay:.3s;}
@keyframes genDot{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-4px);opacity:1;}}
.reasoning-wrap{margin:0 0 var(--s3);border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);}
.reasoning-toggle{width:100%;min-height:44px;display:flex;align-items:center;gap:var(--s2);color:var(--ink3);font-size:var(--fs-sm);text-align:left;}
.reasoning-toggle:hover{color:var(--ink2);}
.reasoning-toggle .reasoning-state{margin-left:auto;font-size:var(--fs-cap);}
.reasoning-toggle .reasoning-chevron{display:flex;transition:transform .18s ease;}
.reasoning-toggle[aria-expanded="true"] .reasoning-chevron{transform:rotate(180deg);}
.reasoning-body{padding:0 0 var(--s3);font-size:var(--fs-sm);line-height:1.85;color:var(--ink3);white-space:pre-wrap;}
.fail-bar{margin-top:var(--s3);background:var(--amber-soft);border-radius:var(--r-sm);padding:var(--s3) var(--s4);font-size:var(--fs-sm);color:var(--amber);line-height:1.6;}
.fail-bar .row{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);margin-top:var(--s1);}
.retry-btn{font-size:var(--fs-sm);color:var(--green-deep);font-weight:600;min-height:44px;padding:0 var(--s4);border-radius:var(--r-full);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;}
.retry-btn:hover{background:var(--green-soft);}

/* 回答底部操作行：44×44 触屏热区，图标保持 17px */
.ai-actions{display:flex;align-items:center;gap:0;margin-top:var(--s2);}
.ai-act{width:44px;height:44px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--ink3);cursor:pointer;transition:background .15s,color .15s;flex-shrink:0;position:relative;}
.ai-act .ai-act-n{position:absolute;top:5px;right:4px;min-width:14px;height:14px;padding:0 3px;border-radius:var(--r-full);background:var(--green);color:#fff;font-size:9.5px;line-height:14px;text-align:center;font-weight:600;}
.ai-act:first-child{margin-left:-13px;}
.ai-act:hover{background:var(--surface);color:var(--green-deep);}
.ai-act:active{transform:scale(.92);}
.ai-time{margin-left:auto;font-size:var(--fs-cap);color:var(--ink3);white-space:nowrap;}

/* 推荐问题：去掉分组标题与分隔线，整项=追问，右侧独立热区=新建分支 */
.sugg-block{margin-top:var(--s4);}
.sugg-list{display:flex;flex-direction:column;align-items:flex-start;gap:var(--s2);}
.sugg-item{display:flex;align-items:center;background:rgba(30,43,35,.035);border-radius:var(--r-sm);font-size:var(--fs-sm);color:var(--ink);cursor:pointer;transition:background .15s;max-width:100%;text-align:left;animation:cardIn .35s backwards;}
.sugg-item:hover{background:rgba(30,43,35,.06);}
.sugg-item .txt{padding:var(--s3) var(--s2) var(--s3) var(--s4);line-height:1.5;}
/* 分叉按钮：44×44 圆形热区，与胶囊圆角语言一致（不用方形补丁/分隔线） */
.sugg-item .sugg-fork{display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin-right:var(--s1);border-radius:var(--r-full);flex-shrink:0;color:var(--ink3);transition:background .15s,color .15s;}
.sugg-item .sugg-fork:hover,.sugg-item .sugg-fork:active{background:rgba(46,125,79,.12);color:var(--green-deep);}
.composer{border-top:1px solid var(--hairline);background:var(--surface);padding:var(--s3) var(--s4) var(--s4);}
.composer .inner{display:flex;align-items:flex-end;gap:var(--s2);background:var(--bg);border-radius:var(--r-lg);padding:var(--s3) var(--s2) var(--s2) var(--s4);}
.composer .ccol{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--s2);}
.composer textarea{flex:1;border:none;outline:none;resize:none;background:transparent;font-size:var(--fs-body);line-height:1.6;max-height:96px;width:100%;}
.composer-tools{display:flex;align-items:center;gap:var(--s2);}
/* 长按选中的句子高亮 */
.sent{cursor:text;}
.sent.sel{background:rgba(46,125,79,.16);border-radius:3px;box-shadow:0 0 0 1.5px rgba(46,125,79,.3);}
.newmsg-pill{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;background:var(--blue);color:#fff;font-size:12px;padding:7px 14px;border-radius:99px;box-shadow:0 4px 14px rgba(47,107,255,.4);z-index:7;animation:cardIn .25s;cursor:pointer;border:none;}

/* ============ 逐层导航 ============ */
.nav-section{padding:var(--s6) var(--gutter) var(--s2);font-size:var(--fs-cap);letter-spacing:.14em;color:var(--ink3);font-weight:600;}
.crumbs{display:flex;flex-wrap:wrap;gap:var(--s2);padding:0 var(--gutter);align-items:center;}
.crumb{font-size:var(--fs-cap);color:var(--green-deep);background:var(--green-faint);padding:var(--s1) var(--s3);border-radius:var(--r-full);cursor:pointer;display:inline-flex;align-items:center;min-height:32px;}
.crumb:hover{background:var(--green-soft);}
.crumb-sep{color:var(--ink3);font-size:var(--fs-cap);}
/* 当前分支用品牌色淡底标记，不用重描边 */
.nav-current{margin:0 var(--gutter);background:var(--green-faint);border-radius:var(--r-md);padding:var(--s4);}
.nav-current .nc-title{font-family:var(--serif);font-size:var(--fs-h2);font-weight:600;display:flex;align-items:flex-start;gap:var(--s2);line-height:1.45;letter-spacing:-.01em;}
.nav-current .nc-sum{font-size:var(--fs-sm);color:var(--ink2);line-height:1.7;margin-top:var(--s2);}
.nav-current .nc-meta{display:flex;gap:var(--s2);margin-top:var(--s3);font-size:var(--fs-cap);color:var(--ink3);align-items:center;flex-wrap:wrap;}
/* 子分支用扁平列表 + 极淡分隔，与上方卡片形成主次对比 */
.branch-row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;margin:0 var(--gutter);border-bottom:1px solid var(--hairline);cursor:pointer;transition:opacity .15s;animation:cardIn .3s backwards;}
.branch-row:hover{opacity:.65;}
.branch-row .br-main{flex:1;min-width:0;}
.branch-row .br-title{font-size:var(--fs-body);font-weight:500;display:flex;align-items:center;gap:var(--s2);line-height:1.4;}
.branch-row .br-sum{font-size:var(--fs-cap);color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.branch-row .br-meta{display:flex;align-items:center;gap:var(--s1);font-size:var(--fs-cap);color:var(--ink3);flex-shrink:0;}
.more-row{margin:0 var(--gutter) var(--s2);padding:var(--s3);border:1px dashed var(--hairline);border-radius:var(--r-md);text-align:center;font-size:var(--fs-sm);color:var(--ink2);cursor:pointer;background:transparent;display:flex;align-items:center;justify-content:center;gap:var(--s2);min-height:44px;}
.more-row:hover{border-color:var(--green);color:var(--green-deep);}
.nav-footer-link{display:flex;align-items:center;justify-content:center;gap:var(--s2);padding:var(--s6) var(--gutter);font-size:var(--fs-sm);color:var(--ink2);cursor:pointer;}
.nav-footer-link:hover{color:var(--green-deep);}

/* ============ 总览画布 ============ */
/* ============ 总览画布（根在底部，枝干向上生长） ============ */
.canvas-wrap{flex:1;position:relative;overflow:hidden;
  background-color:var(--bg);
  background-image:
    radial-gradient(#DDD9C8 1px,transparent 1px),
    linear-gradient(to top,rgba(30,43,35,.075),rgba(30,43,35,0) 170px);
  background-size:18px 18px,100% 100%;}
.canvas-tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:var(--s2);z-index:5;}
.canvas-tools button{width:44px;height:44px;border-radius:var(--r-md);background:var(--surface);border:none;display:flex;align-items:center;justify-content:center;color:var(--ink2);box-shadow:var(--sh-1);font-size:16px;cursor:pointer;}
.canvas-tools button:hover{color:var(--green-deep);}
/* 树上的标题牌：叶子挂一片，当前路径的枝干挂一片（BASE-11 允许缩小时只显示标题） */
.cv-lbl-wrap{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;}
.cv-lbl-wrap.bare{background:transparent;}
.cv-lbl{max-width:100%;display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-full);padding:2px 9px;font-size:11.5px;line-height:1.7;color:var(--ink);box-shadow:var(--sh-1);}
.cv-lbl-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cv-lbl.on{border-color:var(--green);color:var(--green-deep);}
.cv-lbl-dot{width:6px;height:6px;border-radius:50%;background:var(--blue);flex-shrink:0;}
.cv-lbl-sub{max-width:100%;font-size:10px;line-height:1.5;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;}

/* ============ 搜索 / 归档 / 设置 ============ */
.search-bar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:12px 14px 4px;}
.search-bar input{flex:1;border:none;outline:none;font-size:14px;background:transparent;}
.search-scope{padding:8px 18px 0;font-size:11px;color:var(--ink3);}
.result-card{margin:10px 14px 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;cursor:pointer;animation:cardIn .3s backwards;}
.result-card:hover{border-color:var(--green);}
.result-card .r-path{font-size:10.5px;color:var(--ink3);margin-bottom:5px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.result-card .r-title{font-size:14px;font-weight:500;display:flex;align-items:center;gap:7px;}
.result-card .r-snip{font-size:12px;color:var(--ink2);line-height:1.7;margin-top:5px;}
.arch-row{margin:10px 14px 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;animation:cardIn .3s backwards;}
.arch-row .a-title{font-size:14px;font-weight:500;display:flex;align-items:center;gap:7px;}
.arch-row .a-meta{font-size:11px;color:var(--ink3);margin-top:4px;}
.arch-row .a-actions{display:flex;gap:8px;margin-top:10px;}
.arch-row .a-actions button{flex:1;font-size:12.5px;padding:8px;border-radius:10px;cursor:pointer;}
.set-section{margin:16px 14px 0;}
.set-label{font-size:11px;letter-spacing:.14em;color:var(--ink3);font-weight:700;margin-bottom:8px;}
.set-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;}
.set-row{display:flex;align-items:center;gap:10px;padding:6px 0;}
.set-row .sr-main{flex:1;min-width:0;}
.set-row .sr-title{font-size:14px;font-weight:500;}
.set-row .sr-sub{font-size:11.5px;color:var(--ink3);margin-top:2px;line-height:1.6;}
.key-ok{color:var(--green-deep);font-size:11px;background:var(--green-soft);padding:2px 8px;border-radius:99px;font-weight:600;}
.key-bad{color:var(--red);font-size:11px;background:var(--red-soft);padding:2px 8px;border-radius:99px;font-weight:600;}
.key-none{color:var(--amber);font-size:11px;background:var(--amber-soft);padding:2px 8px;border-radius:99px;font-weight:600;}
.key-input-row{display:flex;gap:8px;margin-top:10px;}
.key-input-row input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;outline:none;background:var(--bg);}
.key-input-row input:focus{border-color:var(--green);}
.set-note{font-size:11.5px;color:var(--ink2);line-height:1.8;background:var(--green-faint);border-radius:12px;padding:11px 13px;}
.set-note b{color:var(--green-deep);}

/* ============ 浮层 ============ */
.overlay-mask{position:absolute;inset:0;background:rgba(30,43,35,.32);z-index:40;display:flex;align-items:flex-end;animation:fadeIn .2s;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.sheet{width:100%;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 18px 22px;animation:sheetUp .3s cubic-bezier(.2,.8,.2,1);max-height:82%;overflow-y:auto;}
@keyframes sheetUp{from{transform:translateY(60px);opacity:0;}to{transform:none;opacity:1;}}
.sheet .handle{width:38px;height:4px;border-radius:99px;background:var(--line);margin:2px auto 14px;}
.sheet h3{font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:4px;}
.sheet .sh-sub{font-size:12px;color:var(--ink2);line-height:1.7;margin-bottom:4px;}
.sheet-actions{display:flex;gap:10px;margin-top:16px;}
.sheet-actions button{flex:1;}
.center-mask{position:absolute;inset:0;background:rgba(30,43,35,.36);z-index:50;display:flex;align-items:center;justify-content:center;padding:30px;animation:fadeIn .2s;}
.confirm-box{width:100%;background:var(--surface);border-radius:20px;padding:20px 18px;animation:sheetUp .28s cubic-bezier(.2,.8,.2,1);}
.confirm-box h3{font-family:var(--serif);font-size:16.5px;font-weight:600;margin-bottom:8px;}
.confirm-box p{font-size:13px;color:var(--ink2);line-height:1.8;}
.confirm-box .cb-actions{display:flex;gap:10px;margin-top:18px;}
.confirm-box .cb-actions button{flex:1;padding:10px;border-radius:12px;font-size:13.5px;cursor:pointer;}
.bubble-menu{position:absolute;z-index:45;background:var(--ink);color:#F5F4EE;border-radius:12px;padding:5px;box-shadow:0 8px 24px rgba(30,43,35,.3);animation:cardIn .18s;display:flex;flex-direction:column;min-width:180px;}
.bubble-menu button{display:flex;align-items:center;gap:8px;padding:9px 11px;font-size:12.5px;border-radius:8px;color:#F5F4EE;text-align:left;cursor:pointer;}
.bubble-menu button:hover{background:rgba(255,255,255,.12);}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:104px;background:var(--ink);color:#F5F4EE;font-size:12.5px;padding:10px 18px;border-radius:99px;z-index:60;animation:toastIn .25s cubic-bezier(.2,.8,.2,1);max-width:82%;text-align:center;line-height:1.6;box-shadow:0 8px 24px rgba(30,43,35,.3);pointer-events:none;}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px);}to{opacity:1;transform:translateX(-50%);}}
.ctx-menu{position:absolute;z-index:44;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(30,43,35,.16);padding:5px;min-width:158px;animation:cardIn .18s;}
.ctx-menu button{display:flex;align-items:center;gap:9px;width:100%;padding:10px 12px;font-size:13px;border-radius:9px;text-align:left;color:var(--ink);cursor:pointer;}
.ctx-menu button:hover{background:var(--green-faint);}
.ctx-menu button.danger{color:var(--red);}
.ctx-menu button.danger:hover{background:var(--red-soft);}
.rename-input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14px;outline:none;background:var(--bg);margin-top:10px;}
.rename-input:focus{border-color:var(--green);}

/* ============ 推荐主题弹幕 ============ */
.rec-block{padding:4px 0 6px;width:100%;align-self:stretch;min-width:0;}
.rec-head{display:flex;align-items:center;gap:6px;padding:0 18px 8px;font-size:11.5px;color:var(--ink3);}
.rec-head .rh-t{font-weight:600;color:var(--green-deep);}
.rec-row{width:100%;min-width:0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 20px,#000 calc(100% - 20px),transparent);mask-image:linear-gradient(90deg,transparent,#000 20px,#000 calc(100% - 20px),transparent);padding:3px 0;}
.rec-strip{display:flex;gap:0;width:max-content;animation:marquee 52s linear infinite;}
.rec-strip.b{animation-duration:64s;animation-direction:reverse;}
.rec-row:hover .rec-strip{animation-play-state:paused;}
.rec-strip.paused{animation-play-state:paused;}
@keyframes marquee{from{transform:translateX(0);}to{transform:translateX(-50%);}}
.rec-chip{display:flex;align-items:center;gap:7px;flex-shrink:0;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:8px 14px;margin-right:9px;font-size:12.5px;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s;white-space:nowrap;}
.rec-chip:hover{border-color:var(--green);background:var(--green-faint);color:var(--green-deep);}
.rec-chip .tag{font-size:10px;padding:1px 6px;border-radius:99px;background:var(--green-soft);color:var(--green-deep);font-weight:500;flex-shrink:0;}
.rec-chip .tag.fresh{background:#EDEBE2;color:var(--ink3);}

/* ============ 输入框内的模型标识 ============ */
.model-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 10px;cursor:pointer;white-space:nowrap;transition:border-color .15s,color .15s;}
.model-chip:hover{border-color:var(--green);color:var(--green-deep);}
.model-chip .thk{color:var(--green-deep);font-weight:600;}

/* ============ 锚定弹窗（跟手小弹窗，替代底部滑板） ============ */
.popover-mask{position:absolute;inset:0;z-index:46;}
.popover{position:absolute;z-index:47;background:var(--surface);border:1px solid var(--line);border-radius:15px;
  box-shadow:0 14px 36px -10px rgba(30,43,35,.22),0 2px 8px rgba(30,43,35,.05);padding:5px;
  animation:poIn .17s cubic-bezier(.2,.9,.3,1);}
@keyframes poIn{from{opacity:0;transform:scale(.95) translateY(3px);}to{opacity:1;transform:none;}}
.popover-arrow{position:absolute;width:10px;height:10px;background:var(--surface);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg);}
.popover-item{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border-radius:11px;color:var(--ink);text-align:left;cursor:pointer;transition:background .13s;}
.popover-item:hover{background:var(--green-faint);}
.popover-item.on{background:var(--green-faint);}
.popover .pi-main,.popover .ps-main{flex:1;min-width:0;}
.popover .pi-t{font-size:13px;font-weight:500;line-height:1.3;display:flex;align-items:center;gap:6px;}
.popover .pi-d{display:block;font-size:10.5px;color:var(--ink3);margin-top:2px;line-height:1.45;}
.popover .pi-check{color:var(--green);flex-shrink:0;display:flex;}
.popover-sep{height:1px;background:var(--line);margin:5px 9px;}
.popover-label{padding:8px 11px 5px;font-size:10px;color:var(--ink3);letter-spacing:.1em;font-weight:600;}
.popover-switch{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;}
.popover-switch .ps-main{flex:1;min-width:0;}
/* 画布节点卡片：标题 / 摘要 / 来源 */
.po-node{padding:2px 11px 9px;}
.po-node-t{font-size:13.5px;font-weight:600;line-height:1.5;color:var(--ink);display:flex;align-items:center;gap:5px;}
.po-node-s{font-size:11.5px;line-height:1.65;color:var(--ink2);margin-top:3px;}
.po-node-src{font-size:10.5px;line-height:1.5;color:var(--ink3);margin-top:5px;}
.po-list{max-height:236px;overflow-y:auto;}
.switch{width:42px;height:24px;border-radius:99px;background:#D5D2C4;position:relative;transition:background .2s;flex-shrink:0;cursor:pointer;border:none;padding:0;}
.switch.on{background:var(--green);}
.switch i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.switch.on i{transform:translateX(18px);}

/* ============ 划词气泡（分组） ============ */
.bubble-menu{min-width:212px;}
.bubble-menu button{align-items:flex-start;}
.bubble-menu .bm-txt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;}
.bubble-menu .bm-t{font-size:12.5px;line-height:1.3;}
.bubble-menu .bm-d{font-size:10.5px;color:#A3ADA5;line-height:1.4;}
.bubble-menu .bm-sep{height:1px;background:rgba(255,255,255,.14);margin:4px 8px;}
.bubble-menu .bm-group{padding:7px 11px 2px;font-size:10px;color:#8E988F;letter-spacing:.1em;}

/* ============ 引用 / 上下文卡片 ============ */
/* 引用 / 上下文卡片：用背景色对比区分，不用左 border accent */
.ctx-card{margin-bottom:var(--s3);border-radius:var(--r-md);padding:var(--s3) var(--s4);font-size:var(--fs-sm);animation:cardIn .25s;}
.ctx-card.fork{background:var(--green-faint);color:var(--green-deep);}
.ctx-card.quote{background:rgba(47,107,255,.075);color:#3A5498;}
.ctx-card .cc-top{display:flex;align-items:center;justify-content:space-between;font-weight:600;margin-bottom:var(--s1);}
.ctx-card .cc-body{color:var(--ink2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.msg-user .quote-in{display:block;background:rgba(255,255,255,.22);border-radius:var(--r-sm);padding:var(--s2) var(--s3);font-size:var(--fs-sm);line-height:1.55;margin-bottom:var(--s2);}

/* ============ AI 总结卡（独立卡片，置于分支导航页顶部） ============ */
.sum-card{margin:var(--s4) var(--gutter) 0;background:var(--surface);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-1);animation:cardIn .3s backwards;}
.sum-head{display:flex;align-items:center;gap:var(--s2);padding:var(--s4);cursor:pointer;}
.sum-head .sh-t{flex:1;font-size:var(--fs-sm);font-weight:600;color:var(--green-deep);display:flex;align-items:center;gap:var(--s2);}
.sum-body{padding:0 var(--s4) var(--s4);animation:fadeIn .22s;}
.sum-body ul{list-style:none;display:flex;flex-direction:column;gap:var(--s2);}
.sum-body li{font-size:var(--fs-sm);color:var(--ink2);line-height:1.7;padding-left:var(--s4);position:relative;}
.sum-body li::before{content:'';position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--green-soft);border:1px solid var(--green);}
.sum-body .sum-foot{margin-top:var(--s3);font-size:var(--fs-cap);color:var(--ink3);letter-spacing:.02em;}
</style>
</head>

<div id="root"></div>

/* ================= 对话阅读页（顶层组件，避免重挂载） ================= */
function ChatScreen(props){
  const {
    b, root, isRoot, topicUnread, composerCtx, branches,
    composerDraft, onDraftChange, onSend,
    onBack, onOpenNav, onOpenCanvas, onSourceReturn,
    onPickSentence, onRetry, onStartFork, onForkNow, onCancelCtx, onClearUnread,
    onCopyMsg, onResetMsg, onOpenChildren,
    scrollPosRef, viewRef, flashRef,
    modelLabel, thinking, onOpenModel,
  } = props;
  const scrollRef = useRef(null);
  const [reasoningOpen, setReasoningOpen] = useState({});
  // 哪条回答分出了哪些一级子分支：按来源消息归拢，供回答卡片的「子分支列表」用
  const kidsByMsg = {};
  b.children.filter(c => branches[c] && !branches[c].archived).forEach(c => {
    const sr = branches[c] && branches[c].source;
    if (!sr) return;
    (kidsByMsg[sr.msgId] = kidsByMsg[sr.msgId] || []).push(c);
  });
  // 推荐问题只属于「最新回答」：这条回答之后又追问了，它就不再是前沿，隐藏推荐
  let lastAiId = null;
  for (let i = b.messages.length - 1; i >= 0; i--){
    if (b.messages[i].role === 'ai'){ lastAiId = b.messages[i].id; break; }
  }

  useEffect(() => {
    viewRef.current.screen = 'chat';
    viewRef.current.branchId = b.id;
    const el = scrollRef.current;
    if (el){
      requestAnimationFrame(() => {
        const flash = flashRef.current;
        if (flash){
          const msgEl = document.getElementById('m-' + flash.msgId);
          if (msgEl){
            let target = msgEl;
            if (flash.anchorText){
              const sp = msgEl.querySelector('[data-anchor]');
              if (sp) target = sp;
            }
            el.scrollTop = Math.max(0, target.offsetTop - 140);
            if (target.classList) target.classList.add(flash.anchorText ? 'flash' : 'flash-target');
            setTimeout(() => { if (target.classList) target.classList.remove('flash','flash-target'); }, 1900);
          }
          flashRef.current = null;
        } else {
          const saved = scrollPosRef.current[b.id];
          el.scrollTop = saved != null ? saved : el.scrollHeight;
        }
        const atB = el.scrollTop + el.clientHeight >= el.scrollHeight - 60;
        viewRef.current.atBottom = atB;
        if (atB && b.unread) onClearUnread(b.id);
      });
    }
    return () => {
      if (scrollRef.current) scrollPosRef.current[b.id] = scrollRef.current.scrollTop;
    };
  }, [b.id]);

  const onScroll = (e) => {
    const el = e.currentTarget;
    const atB = el.scrollTop + el.clientHeight >= el.scrollHeight - 60;
    viewRef.current.atBottom = atB;
    if (atB && b.unread) onClearUnread(b.id);
  };

  // 回答按句切分，每句都是长按可选中单位（模拟系统划词）
  const pressTimer = useRef(null);
  const firedRef = useRef(false);
  const [selText, setSelText] = useState(null);

  useEffect(() => { if (!composerCtx) setSelText(null); }, [composerCtx]);
  useEffect(() => () => clearTimeout(pressTimer.current), []);

  const splitSentences = (text) => {
    if (!text) return [];
    const parts = text.split(/(?<=[。！？；!?])/).filter(s => s.length);
    return parts.length ? parts : [text];
  };
  const pick = (el, text, msg) => {
    firedRef.current = true;
    setSelText(text);
    onPickSentence(el, msg, text);
  };
  const onSentDown = (e, text, msg) => {
    firedRef.current = false;
    clearTimeout(pressTimer.current);
    // 必须先取出元素：合成事件的 currentTarget 在异步回调里已被置空
    const el = e.currentTarget;
    // 长按 480ms 触发选中，模拟 Android 长按划词
    pressTimer.current = setTimeout(() => pick(el, text, msg), 480);
  };
  const onSentUp = () => {
    clearTimeout(pressTimer.current);
    if (!firedRef.current) setSelText(null);
  };
  const onSentLeave = () => {
    if (!firedRef.current) { clearTimeout(pressTimer.current); setSelText(null); }
  };

  // 取该条回答对应的用户提问（供「重置」重新生成用）
  const prevQof = (mi) => {
    for (let i = mi - 1; i >= 0; i--) if (b.messages[i].role === 'user') return b.messages[i].text;
    return b.title;
  };

  const renderSentences = (m, text=m.text, anchors=m.anchors || []) => {
    return splitSentences(text).map((s, i) => {
      const isAnchor = anchors.some(a => s.includes(a));
      return (
        <span key={i}
          className={'sent' + (isAnchor ? ' anchor-span' : '') + (selText === s ? ' sel' : '')}
          data-anchor={isAnchor ? s : undefined}
          onMouseDown={(e) => onSentDown(e, s, m)}
          onTouchStart={(e) => onSentDown(e, s, m)}
          onMouseUp={onSentUp}
          onTouchEnd={onSentUp}
          onMouseLeave={onSentLeave}
          onClick={isAnchor ? (e) => { e.stopPropagation(); pick(e.currentTarget, s, m); } : undefined}
        >{s}</span>
      );
    });
  };

  return (
    <div className="screen" key={b.id}>
      <div className="appbar">
        <button className="icon-btn" onClick={onBack}><IBack/></button>
        <div className="appbar-title">
          {!isRoot && <div className="t2">{root.title} /</div>}
          <div className="t1" style={{display:'flex',alignItems:'center',gap:6}}>
            {b.unread && <span className="udot"/>}{b.title}
            {b.isTempTitle && <span className="chip-type">临时标题</span>}
          </div>
        </div>
        <button className="icon-btn" onClick={onOpenNav}>
          <ITree/>{topicUnread && <span className="mini-dot"/>}
        </button>
        <button className="icon-btn" onClick={onOpenCanvas}><IMap/></button>
      </div>

      {b.source && (
        <div className="source-banner" onClick={onSourceReturn}>
          <IBack size={13}/>
          <span style={{fontWeight:600,flexShrink:0}}>来源</span>
          <span className="q">{branches[b.source.branchId] ? branches[b.source.branchId].title : ''}{b.source.anchorText ? ` · ${b.source.anchorText}` : ''}</span>
          <span className="sb-ver">v1</span>
        </div>
      )}
      {b.archived && (
        <div className="arch-banner"><IBox size={14}/>已归档，可读不可改</div>
      )}

      <div className="body-scroll" id="chat-scroll" ref={scrollRef} onScroll={onScroll}>
        <div className="msg-flow">
          {b.messages.map((m, mi) => m.role === 'user' ? (
            <div key={m.id} className="msg-user">
              {m.quote && <span className="quote-in">引用「{m.quote}」</span>}
              {m.text}
            </div>
          ) : (
            <div key={m.id} className="msg-ai" id={'m-' + m.id}>
              <div className="ai-tag"><span className="at-brand"><ISpark/>知芽</span></div>
              {m.reasoning != null && (
                <div className="reasoning-wrap">
                  <button className="reasoning-toggle" aria-expanded={!!reasoningOpen[m.id]}
                    onClick={() => setReasoningOpen(prev => ({...prev, [m.id]: !prev[m.id]}))}>
                    <IThink size={14}/><span>思考过程</span>
                    <span className="reasoning-state">{m.phase === 'reasoning' && m.status === 'generating' ? '正在形成' : (reasoningOpen[m.id] ? '收起' : '展开')}</span>
                    <span className="reasoning-chevron"><IChevD size={14}/></span>
                  </button>
                  {reasoningOpen[m.id] && (
                    <div className="reasoning-body">
                      {m.reasoning ? renderSentences(m, m.reasoning, []) : '正在梳理问题…'}
                      {m.phase === 'reasoning' && m.status === 'generating' && <span className="typing-cursor"/>}
                    </div>
                  )}
                </div>
              )}
              <div>
                {m.status === 'stable' ? renderSentences(m) : (
                  <span>
                    {m.text}
                    {m.status === 'generating' && <span className="typing-cursor"/>}
                  </span>
                )}
              </div>
              {m.status === 'generating' && (
                <div className="gen-note">
                  <span className="gen-dots"><i/><i/><i/></span>{m.phase === 'reasoning' ? '正在思考' : '正在生成回答'}
                </div>
              )}
              {m.status === 'failed' && (
                <div className="fail-bar">
                  生成中断，以上为部分回答，不可作为分支来源。
                  <div className="row">
                    <span style={{color:'var(--ink3)',fontSize:'var(--fs-cap)'}}>重试不新增消息或分支</span>
                    <button className="retry-btn" onClick={() => onRetry(b.id, m)}>重试</button>
                  </div>
                </div>
              )}
              {m.status === 'stable' && (
                <React.Fragment>
                  <div className="ai-actions">
                    <button className="ai-act" title="复制整条回答" onClick={() => onCopyMsg(m)}><ICopy size={17}/></button>
                    <button className="ai-act" title="重置：重新生成这条回答" onClick={() => onResetMsg(b.id, m, prevQof(mi))}><IRefresh size={17}/></button>
                    <button className="ai-act" title="新建分支：从这条回答开一条独立路径" onClick={() => onStartFork(m.id, null)}><IFork size={17}/></button>
                    {(kidsByMsg[m.id] || []).length > 0 && (
                      <button className="ai-act" title={`子分支列表：这条回答分出了 ${kidsByMsg[m.id].length} 个子分支`}
                        onClick={(e) => onOpenChildren(e.currentTarget, b.id, m.id)}>
                        <ITree size={17}/><span className="ai-act-n">{kidsByMsg[m.id].length}</span>
                      </button>
                    )}
                    <span className="ai-time">{m.time || '刚刚'}</span>
                  </div>
                  {/* 推荐问题只属于最新回答：这条之后又追问了就不该再推荐（BASE-16） */}
                  {m.id === lastAiId && m.suggestions && m.suggestions.length > 0 && (
                    <div className="sugg-block">
                      <div className="sugg-list">
                        {m.suggestions.map((s, i) => (
                          <div key={i} className="sugg-item" style={{animationDelay:(i*0.05)+'s'}}
                            onClick={() => onSend(s)}>
                            <span className="txt">{s}</span>
                            <span className="sugg-fork" title="直接用这个问题新建分支"
                              onClick={(e) => { e.stopPropagation(); onForkNow(m.id, s); }}><IFork size={17}/></span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </React.Fragment>
              )}
            </div>
          ))}
        </div>
      </div>

      {b.unread && <button className="newmsg-pill" onClick={() => {
        const el = document.getElementById('chat-scroll');
        if (el) el.scrollTop = el.scrollHeight;
      }}>↓ 有未读回答，点击查看</button>}

      <div className="composer">
        {composerCtx && (
          <div className={'ctx-card ' + (composerCtx.type === 'quote' ? 'quote' : 'fork')}>
            <div className="cc-top">
              <span style={{display:'flex',alignItems:'center',gap:5}}>
                {composerCtx.type === 'quote' ? <IChat size={13}/> : <IFork size={13}/>}
                {composerCtx.type === 'quote' ? '引用追问 · 留在当前分支' : '新建分支 · 来源快照已固定'}
              </span>
              <button onClick={onCancelCtx} style={{color:'var(--ink3)'}}><IClose size={14}/></button>
            </div>
            <div className="cc-body">
              {composerCtx.anchorText ? `「${composerCtx.anchorText}」` : '整条回答'}
              {composerCtx.type === 'fork' && composerCtx.parentId && branches[composerCtx.parentId] ? ` · 来自「${branches[composerCtx.parentId].title}」` : ''}
            </div>
          </div>
        )}
        <div className="inner">
          <div className="ccol">
            <textarea rows={1}
              placeholder={composerCtx
                ? (composerCtx.type === 'quote' ? '针对引用内容提问，回答留在本分支…' : '就来源内容提出新分支的第一个问题…')
                : '在当前分支继续追问…'}
              value={composerDraft}
              onChange={e => { onDraftChange(e.target.value); e.target.style.height='auto'; e.target.style.height=Math.min(e.target.scrollHeight,96)+'px'; }}
              onKeyDown={e => { if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); onSend(); } }}/>
            <div className="composer-tools">
              <button className="model-chip" onClick={onOpenModel} title="切换模型">
                <IThink/>{modelLabel}{thinking && <span className="thk">· 思考</span>}
                <IChevD size={11}/>
              </button>
            </div>
          </div>
          <button className="send-fab" disabled={!composerDraft.trim()} onClick={onSend}><ISend size={18}/></button>
        </div>
      </div>
    </div>
  );
}

/* ================= 主状态机 ================= */
function AppPhone(){
  const empty = {topicOrder:[], topics:{}, branches:{}};
  const [screen, setScreen] = useState('home');
  const [data, setData] = useState(empty);
  const [keyStatus, setKeyStatus] = useState('none');
  const [currentBranchId, setCurrentBranchId] = useState(null);
  const [sheet, setSheet] = useState(null);
  const [ctxMenu, setCtxMenu] = useState(null);
  const [popover, setPopover] = useState(null);
  const [confirmBox, setConfirmBox] = useState(null);
  const [bubble, setBubble] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);
  const [composerCtx, setComposerCtx] = useState(null);
  const [model, setModel] = useState('flash');
  const [thinking, setThinking] = useState(false);
  const [sumOpen, setSumOpen] = useState(true);
  const [searchQ, setSearchQ] = useState('');
  const [composerDraft, setComposerDraft] = useState('');
  const [rootDraft, setRootDraft] = useState('');
  const [navMoreOpen, setNavMoreOpen] = useState(false);
  const [cvZoom, setCvZoom] = useState(1);
  const [cvPan, setCvPan] = useState({x: 20, y: 30});

  const branches = data.branches;
  const MODEL_INFO = {
    flash:{short:'V4.1 Flash', full:'DeepSeek V4.1 Flash', desc:'响应快 · 日常梳理'},
    pro:{short:'V4 Pro', full:'DeepSeek V4 Pro', desc:'推理强 · 深度推导'},
  };
  const modelLabel = MODEL_INFO[model].short;
  const genTimers = useRef({});
  const scrollPosRef = useRef({});
  const viewRef = useRef({screen:'home', branchId:null, atBottom:true});
  const flashRef = useRef(null);
  const dragRef = useRef(null);
  const visitCounter = useRef(0);
  const lastVisit = useRef({});
  const toastTimer = useRef(null);

  const toast = (msg) => {
    setToastMsg(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastMsg(null), 2400);
  };
  const setBranches = (fn) => setData(prev => ({...prev, branches: fn(prev.branches)}));
  const upBranch = (id, fn) => setBranches(prev => ({...prev, [id]: fn(prev[id])}));

  /* ---------- 派生帮助 ---------- */
  const topicOf = (bid) => branches[bid] ? data.topics[branches[bid].topicId] : null;
  const descendants = (id) => {
    const out = [];
    const walk = (x) => { const b = branches[x]; if (!b) return; b.children.forEach(c => { out.push(c); walk(c); }); };
    walk(id);
    return out;
  };
  const visibleChildren = (b) => b.children.filter(c => branches[c] && !branches[c].archived);
  const hiddenUnreadCount = (id) => {
    let n = 0;
    const walk = (x) => { const b = branches[x]; if (!b || b.archived) return; if (b.unread) n++; b.children.forEach(walk); };
    (branches[id] ? branches[id].children : []).forEach(walk);
    return n;
  };
  const hiddenDescCount = (id) => descendants(id).filter(x => !branches[x].archived).length;
  const ancestorsOf = (bid) => {
    const out = [];
    let cur = branches[bid];
    while (cur && cur.parentId){ const p = branches[cur.parentId]; if (!p) break; out.unshift(p); cur = p; }
    return out;
  };
  const anyUnreadInTopic = (tid) => Object.values(branches).some(b => b.topicId===tid && !b.archived && b.unread);

  /* ---------- 生成模拟 ---------- */
  const runGeneration = (branchId, msgId, fullText, opts={}) => {
    let i = 0;
    const fullReasoning = opts.reasoning || '';
    const totalLength = fullReasoning.length + fullText.length;
    genTimers.current[msgId] = setInterval(() => {
      i += 3;
      const done = i >= totalLength;
      const inReasoning = fullReasoning.length > 0 && i < fullReasoning.length;
      const reasoningText = fullReasoning ? fullReasoning.slice(0, Math.min(i, fullReasoning.length)) : null;
      const answerLength = Math.max(0, i - fullReasoning.length);
      upBranch(branchId, b => ({
        ...b,
        messages: b.messages.map(m => m.id===msgId
          ? {...m, reasoning: reasoningText, text: fullText.slice(0, answerLength),
             phase: inReasoning ? 'reasoning' : 'answer', status: done ? 'stable' : 'generating',
             ...(done ? {suggestions: opts.suggestions || SUGG_POOL.slice(0,3), anchors: opts.anchors, time: '刚刚'} : {})}
          : m),
      }));
      if (done){
        clearInterval(genTimers.current[msgId]);
        delete genTimers.current[msgId];
        const v = viewRef.current;
        const watching = v.screen==='chat' && v.branchId===branchId && v.atBottom;
        if (!watching) upBranch(branchId, b => ({...b, unread:true}));
        setTimeout(() => {
          setBranches(prev => {
            const br = prev[branchId];
            if (!br || !br.isTempTitle) return prev;
            const firstQ = (br.messages.find(m => m.role==='user') || {text:''}).text;
            return {...prev, [branchId]: {...br, title: fakeTitle(firstQ), isTempTitle:false}};
          });
        }, 900);
      }
    }, 42);
  };

  /* ---------- 导航 ---------- */
  const openBranch = (bid, opts={}) => {
    visitCounter.current += 1;
    lastVisit.current[bid] = visitCounter.current;
    // 用函数式更新校验存在性，避免新创建分支尚未进入闭包
    setData(prev => {
      const br = prev.branches[bid];
      if (!br) return prev;
      const t = prev.topics[br.topicId];
      return {...prev, topics: {...prev.topics, [t.id]: {...t, lastBranchId: bid}}};
    });
    flashRef.current = opts.flash || null;
    setCurrentBranchId(bid);
    setComposerCtx(null);
    setBubble(null);
    setNavMoreOpen(false);
    viewRef.current.screen = 'chat';
    viewRef.current.branchId = bid;
    setScreen('chat');
  };
  const openTopic = (tid) => {
    const t = data.topics[tid];
    openBranch(t.lastBranchId && branches[t.lastBranchId] ? t.lastBranchId : t.rootId);
  };

  /* ---------- Key 守卫（BASE-05/18） ---------- */
  const guardKey = () => {
    if (keyStatus === 'ok') return true;
    setSheet({type:'key', payload:{status: keyStatus}});
    return false; // 输入保留原位，不形成任何树节点
  };

  /* ---------- 发送 ---------- */
  const sendRoot = (override) => {
    const q = (typeof override === 'string' ? override : rootDraft).trim();
    if (!q) return;
    if (!guardKey()){
      // Key 不可用：仅把输入保留在首页输入框，不形成主题或根分支（BASE-05/18）
      setRootDraft(q);
      return;
    }
    const tid = 't' + Date.now();
    const bid = 'r' + Date.now();
    const aiId = nid();
    const fullText = `收到，我们开始系统学习「${fakeTitle(q)}」。我会先给出主干框架；阅读中你可以对任何一段划词分叉，把临时疑问隔离进独立分支，探索完随时回到这里。\n\n（演示提示：这条回答稳定后，底部会出现推荐问题与「作为来源新建分支」入口。）`;
    setData(prev => ({
      topicOrder: [...prev.topicOrder, tid],
      topics: {...prev.topics, [tid]: {id: tid, rootId: bid, lastBranchId: bid, time: '刚刚'}},
      branches: {...prev.branches, [bid]: {
        id: bid, topicId: tid, parentId: null, title: q.length>16 ? q.slice(0,16)+'…' : q, isTempTitle: true,
        summary: '', children: [], archived:false, unread:false, collapsed:false, source:null,
        messages: [
          {id: nid(), role:'user', text: q},
          {id: aiId, role:'ai', status:'generating', phase: thinking ? 'reasoning' : 'answer', reasoning: thinking ? '' : null, text:''},
        ],
      }},
    }));
    setRootDraft('');
    setCurrentBranchId(bid);
    viewRef.current = {screen:'chat', branchId: bid, atBottom:true};
    setScreen('chat');
    runGeneration(bid, aiId, fullText, {suggestions: SUGG_POOL.slice(0,3), reasoning: thinking ? fakeReasoning(q) : null});
    toast('主题与根分支已形成');
  };
  /* 创建子分支并发送它的第一个问题（来源快照固定，不迁移任何已有子分支） */
  const createFork = (parentId, msgId, anchorText, question) => {
    const bid = 'b' + Date.now();
    const aiId = nid();
    const fullText = fakeAnswer(question);
    setBranches(prev => ({
      ...prev,
      [parentId]: {...prev[parentId], children: [...prev[parentId].children, bid]},
      [bid]: {
        id: bid, topicId: prev[parentId].topicId, parentId,
        title: question.length>16 ? question.slice(0,16)+'…' : question, isTempTitle: true,
        summary: '', points: null,
        children: [], archived:false, unread:false, collapsed:false,
        source: {branchId: parentId, msgId, anchorText},
        messages: [
          {id: nid(), role:'user', text: question},
          {id: aiId, role:'ai', status:'generating', phase: thinking ? 'reasoning' : 'answer', reasoning: thinking ? '' : null, text:''},
        ],
      },
    }));
    setComposerDraft('');
    setComposerCtx(null);
    openBranch(bid);
    runGeneration(bid, aiId, fullText, {reasoning: thinking ? fakeReasoning(question) : null});
  };
  const sendChat = (override) => {
    // override 传字符串：推荐问题直达发送，不经输入框、不清空已有草稿
    const fromRec = typeof override === 'string';
    const q = (fromRec ? override : composerDraft).trim();
    if (!q) return;
    if (!fromRec && composerCtx && composerCtx.type === 'fork'){
      if (!guardKey()) return;
      createFork(composerCtx.parentId, composerCtx.msgId, composerCtx.anchorText, q);
      return;
    }
    if (!currentBranchId) return;
    if (!guardKey()) return;
    const quote = !fromRec && composerCtx && composerCtx.type === 'quote' ? composerCtx.anchorText : null;
    const bid = currentBranchId;
    const aiId = nid();
    const fullText = fakeAnswer(q, quote);
    upBranch(bid, b => ({...b, points: null, messages: [...b.messages,
      {id: nid(), role:'user', text: q, ...(quote ? {quote} : {})},
      {id: aiId, role:'ai', status:'generating', phase: thinking ? 'reasoning' : 'answer', reasoning: thinking ? '' : null, text:''},
    ]}));
    if (!fromRec) setComposerDraft('');
    setComposerCtx(null);
    if (quote) toast('已作为引用追问，回答留在当前分支');
    setTimeout(() => {
      const el = document.getElementById('chat-scroll');
      if (el) el.scrollTop = el.scrollHeight;
    }, 60);
    runGeneration(bid, aiId, fullText, {reasoning: thinking ? fakeReasoning(q) : null});
  };
  /* 推荐问题的分叉按钮：直接建分支并发送，不留编辑步骤 */
  const forkNow = (msgId, question) => {
    if (!currentBranchId) return;
    if (!guardKey()) return;
    createFork(currentBranchId, msgId, null, question);
  };

  /* ---------- 划词：分叉 / 引用追问 ---------- */
  const startFork = (msgId, anchorText) => {
    setComposerCtx({type:'fork', parentId: currentBranchId, msgId, anchorText});
    setComposerDraft('');
    setBubble(null);
  };
  const startQuote = (msgId, anchorText) => {
    setComposerCtx({type:'quote', msgId, anchorText});
    setBubble(null);
  };
  const copyAnchor = (text) => {
    try { navigator.clipboard && navigator.clipboard.writeText(text); } catch(e){}
    toast('已复制选中文字（演示）');
  };
  // 长按命中：按选中句弹出操作菜单（下方空间不足时翻到上方）
  const pickSentence = (el, msg, text) => {
    const rect = el.getBoundingClientRect();
    const host = document.getElementById('phone-content').getBoundingClientRect();
    const MENU_W = 212, MENU_H = 208;
    const below = rect.bottom - host.top + 6;
    const y = (host.height - below < MENU_H)
      ? Math.max(8, rect.top - host.top - MENU_H - 6)
      : below;
    setBubble({
      x: Math.min(Math.max(rect.left - host.left - 24, 12), Math.max(12, host.width - MENU_W - 12)),
      y,
      msgId: msg.id,
      anchorText: text,
    });
  };
  // 内容操作：复制整条回答 / 重置（重新生成）
  const copyMsg = (m) => {
    const text = m.reasoning
      ? `思考过程\n${m.reasoning}\n\n最终回答\n${m.text}`
      : m.text;
    try { navigator.clipboard && navigator.clipboard.writeText(text); } catch(e){}
    toast('已复制整条回答（演示）');
  };
  const resetMsg = (branchId, m, q) => {
    if (!guardKey()) return;
    const salt = Math.floor(Math.random() * 3) + 1;
    const fallbackQ = branches[branchId] ? branches[branchId].title : '';
    const text = fakeAnswer(q || fallbackQ, m.quote || null, salt);
    const reasoning = thinking ? fakeReasoning(q || fallbackQ) : null;
    upBranch(branchId, br => ({
      ...br, points: null,
      messages: br.messages.map(x => x.id === m.id ? {...x, text:'', reasoning: thinking ? '' : null,
        phase: thinking ? 'reasoning' : 'answer', status:'generating', suggestions:null, anchors:null} : x),
    }));
    runGeneration(branchId, m.id, text, {suggestions: SUGG_POOL.slice(0,3), reasoning});
    toast('正在重新生成这条回答 · 已有子分支仍固定旧版本');
  };

  /* ---------- 重试（BASE-15） ---------- */
  const retryMsg = (branchId, msg) => {
    if (!guardKey()) return;
    const reasoning = thinking ? (msg.retryReasoning || fakeReasoning(branches[branchId].title)) : null;
    upBranch(branchId, b => ({...b, messages: b.messages.map(m => m.id===msg.id ? {...m,
      status:'generating', phase: thinking ? 'reasoning' : 'answer', reasoning: thinking ? '' : null, text:''} : m)}));
    runGeneration(branchId, msg.id, msg.retryText, {anchors: msg.retryAnchors, suggestions: msg.suggestions, reasoning});
    toast('正在原位置重试，不会新增消息或分支');
  };

  /* ---------- 归档 / 恢复 / 删除（BASE-14） ---------- */
  const setSubtreeArchived = (id, flag) => {
    const ids = [id, ...descendants(id)];
    setBranches(prev => {
      const next = {...prev};
      ids.forEach(x => { if (next[x]) next[x] = {...next[x], archived: flag}; });
      return next;
    });
  };
  const archiveBranch = (id) => {
    const n = descendants(id).length;
    setConfirmBox({
      title: '归档这棵子树？',
      body: `「${branches[id].title}」及其 ${n} 个后代将从日常导航和默认画布中隐藏，可随时从「已归档」整体恢复，父子关系保持不变。`,
      danger: false, okText: '归档',
      onOk: () => {
        setSubtreeArchived(id, true);
        toast(`已归档「${branches[id].title}」（含 ${n} 个后代）`);
        if (currentBranchId === id || descendants(id).includes(currentBranchId)){
          openBranch(branches[id].parentId);
        }
      },
    });
  };
  const restoreSubtree = (id) => {
    const n = descendants(id).length;
    setSubtreeArchived(id, false);
    setSheet(null);
    toast(`已恢复整棵子树（${n + 1} 个分支）`);
  };
  const deleteSubtree = (id) => {
    const n = descendants(id).length;
    setConfirmBox({
      title: '永久删除这棵子树？',
      body: `将永久删除「${branches[id].title}」及全部 ${n} 个后代分支，删除后不可恢复。取消不会改变任何内容。`,
      danger: true, okText: '永久删除',
      onOk: () => {
        const ids = [id, ...descendants(id)];
        setData(prev => {
          const next = {...prev.branches};
          const parent = next[prev.branches[id].parentId];
          if (parent) next[parent.id] = {...parent, children: parent.children.filter(c => c !== id)};
          ids.forEach(x => delete next[x]);
          return {...prev, branches: next};
        });
        toast('已删除整棵子树');
        setSheet(null);
      },
    });
  };
  const deleteTopic = (tid) => {
    const t = data.topics[tid];
    const rootB = branches[t.rootId];
    const n = descendants(t.rootId).length;
    setConfirmBox({
      title: '永久删除整个主题？',
      body: `「${rootB ? rootB.title : ''}」共 ${n + 1} 个分支的全部内容仅保存在本机，删除后不可恢复，不存在云端备份。取消不会改变任何内容。`,
      danger: true, okText: '永久删除',
      onOk: () => {
        const remaining = data.topicOrder.filter(x => x !== tid).length;
        setData(prev => {
          const ids = [t.rootId, ...descendants(t.rootId)];
          const next = {...prev.branches};
          ids.forEach(x => delete next[x]);
          const topics = {...prev.topics};
          delete topics[tid];
          return {topicOrder: prev.topicOrder.filter(x => x !== tid), topics, branches: next};
        });
        toast('主题已永久删除');
        setScreen('home');
      },
    });
  };

  /* ---------- 标题（BASE-06/12/19） ---------- */
  const renameBranch = (id, name) => {
    if (!name.trim()) return;
    const isRoot = branches[id].parentId === null;
    upBranch(id, b => ({...b, title: name.trim(), isTempTitle:false}));
    setSheet(null);
    toast(isRoot ? '根标题已更新，主题列表同步显示' : '分支标题已更新');
  };
  const refreshTitle = (id) => {
    const b = branches[id];
    const firstQ = (b.messages.find(m => m.role==='user') || {text:''}).text;
    setSheet(null);
    toast('正在依据' + (b.parentId ? '来源锚点与首问' : '根问题') + '重新生成标题…');
    setTimeout(() => {
      upBranch(id, x => ({...x, title: fakeTitle(firstQ), isTempTitle:false}));
      toast(b.parentId === null ? '根标题已刷新，主题列表同步显示' : '分支标题已刷新');
    }, 900);
  };

  /* ---------- 搜索（BASE-12） ---------- */
  const searchAll = (q) => {
    if (!q.trim()) return [];
    const results = [];
    const hl = (text) => {
      const i = text.indexOf(q);
      const s = Math.max(0, i - 14), e = Math.min(text.length, i + q.length + 22);
      return (s > 0 ? '…' : '') + text.slice(s, e) + (e < text.length ? '…' : '');
    };
    Object.values(branches).forEach(b => {
      const path = ancestorsOf(b.id).map(x => x.title);
      if (b.title.includes(q)) results.push({bid: b.id, type: '分支标题', snip: b.title, path, archived: b.archived});
      b.messages.forEach(m => {
        if (m.text && m.text.includes(q)) results.push({bid: b.id, type: m.role==='user' ? '用户问题' : (m.status==='stable' ? 'AI 回答' : '部分回答'), snip: hl(m.text), path, archived: b.archived});
      });
      if (b.source && b.source.anchorText && b.source.anchorText.includes(q))
        results.push({bid: b.id, type: '锚定原文', snip: b.source.anchorText, path, archived: b.archived});
    });
    return results.slice(0, 30);
  };

  /* ================= 浮层 ================= */
  const renderToast = () => toastMsg && <div className="toast">{toastMsg}</div>;
  const renderConfirm = () => confirmBox && (
    <div className="center-mask" onClick={() => setConfirmBox(null)}>
      <div className="confirm-box" onClick={e => e.stopPropagation()}>
        <h3>{confirmBox.title}</h3>
        <p>{confirmBox.body}</p>
        <div className="cb-actions">
          <button className="btn-ghost" onClick={() => { setConfirmBox(null); toast('已取消，内容保持不变'); }}>取消</button>
          <button className="btn-primary" style={confirmBox.danger ? {background:'var(--red)'} : {}}
            onClick={() => { setConfirmBox(null); confirmBox.onOk(); }}>{confirmBox.okText || '确认'}</button>
        </div>
      </div>
    </div>
  );
  /* ---------- 锚定弹窗：贴着触发元素弹出，跟手不遮内容 ========== */
  const poRef = useRef(null);
  const openPopover = (anchorEl, width, kind = 'model', payload = null) => {
    const r = anchorEl.getBoundingClientRect();
    const host = document.getElementById('phone-content').getBoundingClientRect();
    setPopover({
      kind, payload, w: width,
      anchorTop: r.top - host.top,
      anchorBottom: r.bottom - host.top,
      anchorCx: r.left - host.left + r.width / 2,
      x: 0, y: 0, placeTop: true, arrowX: width / 2,
    });
  };
  // 回答卡片的「子分支列表」：列出这条回答直接分出的子分支，点一条直接跳过去
  const openChildren = (anchorEl, branchId, msgId) => openPopover(anchorEl, 252, 'children', {branchId, msgId});
  // 渲染后按真实高度二次校正位置，保证弹窗始终完整在屏内且箭头对准锚点
  useEffect(() => {
    if (!popover || !poRef.current) return;
    const host = document.getElementById('phone-content');
    if (!host) return;
    const h = poRef.current.offsetHeight, hostH = host.clientHeight, hostW = host.clientWidth;
    const placeTop = popover.anchorTop >= h + 10;
    const rawY = placeTop ? (popover.anchorTop - h - 9) : (popover.anchorBottom + 9);
    const y = Math.max(8, Math.min(rawY, hostH - h - 8));
    const x = Math.max(10, Math.min(popover.anchorCx - popover.w / 2, hostW - popover.w - 10));
    const arrowX = Math.max(16, Math.min(popover.anchorCx - x, popover.w - 16));
    if (Math.abs(y - popover.y) > 0.5 || Math.abs(x - popover.x) > 0.5
        || placeTop !== popover.placeTop || arrowX !== popover.arrowX || popover.h !== h){
      setPopover(p => ({...p, y, x, placeTop, arrowX, h}));
    }
  }, [popover]);

  const renderPopover = () => {
    if (!popover) return null;
    const close = () => setPopover(null);
    let body;
    if (popover.kind === 'children'){
      const parent = branches[popover.payload.branchId];
      const kids = parent ? parent.children.filter(c => branches[c] && !branches[c].archived
        && branches[c].source && branches[c].source.msgId === popover.payload.msgId) : [];
      if (!kids.length) return null;
      body = (
        <React.Fragment>
          <div className="popover-label">子分支列表 · {kids.length}</div>
          <div className="po-list">
            {kids.map(k => {
              const kb = branches[k];
              return (
                <button key={k} className="popover-item" onClick={() => { close(); openBranch(k); }}>
                  <span className="pi-main">
                    <span className="pi-t">{kb.unread && <span className="cv-lbl-dot"/>}{kb.title}</span>
                  </span>
                  <span className="pi-check" style={{color:'var(--ink3)'}}><IChevR size={15}/></span>
                </button>
              );
            })}
          </div>
        </React.Fragment>
      );
    } else if (popover.kind === 'node'){
      const nb = branches[popover.payload.id];
      if (!nb) return null;
      const kids = visibleChildren(nb).length;
      body = (
        <React.Fragment>
          <div className="popover-label">{kids ? '枝干 · 已分出子分支' : '叶子 · 探索前沿'}</div>
          <div className="po-node">
            <div className="po-node-t">{nb.unread && <span className="cv-lbl-dot"/>}{nb.title}</div>
            {nb.summary && <div className="po-node-s">{nb.summary}</div>}
            {nb.source && branches[nb.source.branchId] && (
              <div className="po-node-src">
                来源 · {branches[nb.source.branchId].title}{nb.source.anchorText ? `「${nb.source.anchorText}」` : ' 整条回答'}
              </div>
            )}
          </div>
          <div className="popover-sep"/>
          <button className="popover-item" onClick={() => { close(); openBranch(nb.id); }}>
            <IChat size={15}/>
            <span className="pi-main"><span className="pi-t">进去聊</span></span>
          </button>
          {kids > 0 && (
            <button className="popover-item" onClick={() => { close(); toggleFoldStable(nb.id, popover.payload.at); }}>
              <ITree size={15}/>
              <span className="pi-main">
                <span className="pi-t">{nb.collapsed ? `展开子树（${hiddenDescCount(nb.id)}）` : `折叠子树（${hiddenDescCount(nb.id)}）`}</span>
              </span>
            </button>
          )}
        </React.Fragment>
      );
    } else {
      body = (
        <React.Fragment>
          <div className="popover-label">模型</div>
          {['flash','pro'].map(k => (
            <button key={k} className={'popover-item' + (model === k ? ' on' : '')}
              onClick={() => { setModel(k); toast('已切换到 ' + MODEL_INFO[k].full); }}>
              <span className="pi-main">
                <span className="pi-t">{MODEL_INFO[k].full}{k === 'flash' && <span className="chip-type">默认</span>}</span>
                <span className="pi-d">{MODEL_INFO[k].desc}</span>
              </span>
              {model === k && <span className="pi-check"><ICheck/></span>}
            </button>
          ))}
          <div className="popover-sep"/>
          <div className="popover-switch">
            <span className="ps-main">
              <span className="pi-t"><IThink/>思考模式</span>
              <span className="pi-d">先推理再作答，适合机制推导</span>
            </span>
            <button className={'switch' + (thinking ? ' on' : '')} onClick={() => {
              setThinking(t => !t);
              toast(!thinking ? '已开启思考模式' : '已关闭思考模式');
            }}><i/></button>
          </div>
        </React.Fragment>
      );
    }
    return (
      <React.Fragment>
        <div className="popover-mask" onClick={close}/>
        <div className="popover" ref={poRef}
          style={{left: popover.x, top: popover.y, width: popover.w, visibility: popover.h ? 'visible' : 'hidden'}}>
          <div className="popover-arrow" style={popover.placeTop
            ? {bottom: -6, left: popover.arrowX - 5}
            : {top: -6, left: popover.arrowX - 5, transform:'rotate(225deg)'}}/>
          {body}
        </div>
      </React.Fragment>
    );
  };

  const renderCtxMenu = () => ctxMenu && (
    <React.Fragment>
      <div style={{position:'absolute', inset:0, zIndex:43}} onClick={() => setCtxMenu(null)}/>
      <div className="ctx-menu" style={{left: ctxMenu.x, top: ctxMenu.y}}>
        {ctxMenu.items.map((it, i) => (
          <button key={i} className={it.danger ? 'danger' : ''} onClick={() => { setCtxMenu(null); it.onClick(); }}>
            {it.icon}{it.label}
          </button>
        ))}
      </div>
    </React.Fragment>
  );
  const renderBubble = () => bubble && (
    <React.Fragment>
      <div style={{position:'absolute', inset:0, zIndex:44}} onClick={() => setBubble(null)}/>
      <div className="bubble-menu" style={{left: bubble.x, top: bubble.y}}>
        <div className="bm-group">选中「{bubble.anchorText.length > 12 ? bubble.anchorText.slice(0,12) + '…' : bubble.anchorText}」</div>
        <button onClick={() => startQuote(bubble.msgId, bubble.anchorText)}>
          <IChat size={15}/>
          <span className="bm-txt">
            <span className="bm-t">追问</span>
            <span className="bm-d">留在当前分支，答案参照这段</span>
          </span>
        </button>
        <button onClick={() => startFork(bubble.msgId, bubble.anchorText)}>
          <IFork size={15}/>
          <span className="bm-txt">
            <span className="bm-t">新建分支</span>
            <span className="bm-d">另开一条独立路径深入</span>
          </span>
        </button>
        <div className="bm-sep"/>
        <button onClick={() => { setBubble(null); copyAnchor(bubble.anchorText); }}>
          <ICopy size={15}/><span className="bm-t">复制</span>
        </button>
        <button onClick={() => { setBubble(null); toast('已全选本段内容（演示）'); }}>
          <ISelect size={15}/><span className="bm-t">全选</span>
        </button>
      </div>
    </React.Fragment>
  );
  const renderSheet = () => {
    if (!sheet) return null;
    const close = () => setSheet(null);
    let body = null;
    if (sheet.type === 'key'){
      const st = sheet.payload.status;
      body = (
        <React.Fragment>
          <div className="handle"/><h3>需要先配置 DeepSeek Key</h3>
          <div className="sh-sub">
            {st === 'none' ? '尚未配置 Key。' : 'Key 无效或额度不足。'}
            你输入的内容已保留在原位，不会形成主题或分支。
          </div>
          <div className="sheet-actions">
            <button className="btn-ghost" onClick={close}>继续编辑</button>
            <button className="btn-primary" onClick={() => { setSheet(null); setScreen('settings'); }}>去配置 Key</button>
          </div>
        </React.Fragment>
      );
    } else if (sheet.type === 'rename'){
      const b = branches[sheet.payload.id];
      body = (
        <React.Fragment>
          <div className="handle"/><h3>修改标题</h3>
          <div className="sh-sub">{b.parentId === null ? '根标题即主题名，改完列表同步。' : '标题不会随对话自动变化。'}</div>
          <input className="rename-input" id="rename-input" defaultValue={b.title}/>
          <div className="sheet-actions">
            <button className="btn-ghost" onClick={close}>取消</button>
            <button className="btn-primary" onClick={() => renameBranch(b.id, document.getElementById('rename-input').value)}>保存</button>
          </div>
        </React.Fragment>
      );
    } else if (sheet.type === 'archDetail'){
      const b = branches[sheet.payload.id];
      const n = descendants(b.id).length;
      body = (
        <React.Fragment>
          <div className="handle"/><h3>{b.title}</h3>
          <div className="sh-sub">含 {n} 个后代 · 查看不改状态 · 恢复整树</div>
          <div style={{background:'var(--bg)',borderRadius:12,padding:'11px 13px',fontSize:12.5,color:'var(--ink2)',lineHeight:1.8}}>
            {b.summary}<br/>来源：{b.source && branches[b.source.branchId] ? branches[b.source.branchId].title : '—'}{b.source && b.source.anchorText ? ` · 「${b.source.anchorText}」` : ''}
          </div>
