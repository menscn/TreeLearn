<!DOCTYPE html>
<!--
Design preview, 2026-10-10. Assumptions: independent PC data, loopback service, desktop first.
Reasoning: reading is primary; branch/context views open on demand instead of shrinking every answer.
Example learning content is adapted from the existing TreeLearn v1.1 prototype, not real user data.
All backend, speech, credential, persistence and generation behaviours are demonstrations.
Base tokens are generated from the legacy authoritative :root. Web colours are generated from
web-local-design-tokens.json following the user-selected mint palette. Icons reuse v1.1 paths.
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>知芽（TreeLearn）· Web 交互原型 V0.1</title>

  /* —— 色彩 —— */

     该 token 的 16→15 资源连带变更见 design-system/README.md 变更日志 */
  --blue:#2563EB;        /* 未读蓝点（BASE-13 指定实心蓝点） */
  --amber:#B05108;       /* 修正值：新稿 #B45309 在 bg 上只有 4.45，低于 4.5 */
  --amber-soft:#FBF3E2;
  --red:#C0392B;
  --red-soft:#FBEAE7;
  --yellow-highlight:#FFF3B0;  /* 正文高亮黄（2026-09-28 拍板 D，菜单「高亮」动作的底色） */

  /* —— 间距系统：4pt 基准，只用 4/8/12/16/24/32 —— */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px;
  --gutter:20px;                     /* 页面左右安全边距 */

  /* —— 圆角系统：只保留 3 档 + 全圆 —— */
  --r-sm:8px;     /* chip、小按钮 */
  --r-md:14px;    /* 卡片 */
  --r-lg:18px;    /* 输入框、大容器 */
  --r-full:99px;

  /* —— 字号系统：display 与 caption 拉开约 2.4 倍对比 —— */
  --fs-display:26px;   /* 首页 hero */
  --fs-brand:30px;     /* 首页品牌锁定区 */
  --fs-h1:20px;        /* 页面主标题 */
  --fs-h2:16px;        /* 卡片/分支标题 */
  --fs-body:15px;      /* 正文（阅读区，移动端建议值） */
  --fs-sm:13px;        /* 次要信息 */
  --fs-cap:11px;       /* 标注 */

  /* —— 阴影：只保留两档，克制 —— */
  --sh-1:0 1px 2px rgba(22,36,28,.04);
  --sh-2:0 4px 12px rgba(22,36,28,.06);

  /* —— 字体：正文走系统 sans-serif；品牌衬线走回退栈，本轮不打包字体 —— */
  --kai:'LXGW WenKai','Noto Serif SC','Songti SC',serif;   /* 遗留楷体：2026-09-27 起 .screen 已改用 --sans；现存唯一引用是 .home-hero .hh-sub（首页 hero 副标题）。退役待定 */
  --serif:'Noto Serif SC','Songti SC',Georgia,serif;       /* 品牌衬线回退栈（各 ROM 字形有差异） */
  --brush:'Ma Shan Zheng','LXGW WenKai',serif;             /* 品牌题字 */
  --sans:'Noto Sans SC',-apple-system,sans-serif;          /* 正文；Android 落系统 sans-serif */

  /* —— 纸感：极淡横格，读作纹理而非参考线；正文行高对齐格距 —— */
  --paper-rule:rgba(30,43,35,.018);   /* 2026-09-28 由 .028 减淡：真机上仍读作"粗"，横线弱化到与纸底差 4 阶 */
  --paper-write:rgba(46,125,79,.075);
  --lh-read:28px;   /* 阅读行高 == 格线间距，避免逐行错位 */
}

const initialBranches=[{id:'root',title:'大语言模型的注意力机制',parent:null,question:'我想理解 Transformer 的注意力机制，能从直觉到公式系统讲一下吗？',unread:false},{id:'scale',title:'为什么要除以 √d？',parent:'root',question:'为什么 Q 和 K 的点积要除以 √d？不除会怎样？',unread:true},{id:'gradient',title:'Softmax 的梯度推导',parent:'scale',question:'能给出 Softmax 梯度消失的数学推导吗？',unread:false},{id:'heads',title:'多头注意力的意义',parent:'root',question:'多头注意力相比单头有什么收益？',unread:false},{id:'rope',title:'位置编码与 RoPE',parent:'root',question:'RoPE 和绝对位置编码有什么区别？',unread:true}];
const state={page:'chat',layout:'focus',contextOpen:false,positions:{},branch:'root',context:'branches',settings:'providers',library:'active',branches:structuredClone(initialBranches),notes:[{quote:'注意力的核心不是记住所有信息，而是根据当前问题选择值得关注的信息。',text:'可以把 Q 想成问题，把 K 想成标签，把 V 想成具体内容。'}],drafts:{},messages:{},quote:'',selection:'',attachment:'',thinking:false,webSearch:false,running:false,failed:false,partial:'',timers:[],model:'deepseek-chat',persona:'学习导师',providerEnabled:true,guideSeen:false,treeZoom:1,treePan:{x:0,y:0},fileNames:['注意力机制学习笔记.md'],providerAdded:false};
const rootAnswer=`<p>可以。先抓住一个直觉：<mark data-action="note-open">注意力的核心不是记住所有信息，而是根据当前问题选择值得关注的信息。</mark></p><h3>1. 用 Q、K、V 理解「关注」</h3><p>对每个词，模型生成三个向量：查询 <b>Q</b>、键 <b>K</b> 和值 <b>V</b>。Q 表示「我在找什么」，K 表示「我能提供什么」，V 则是实际要传递的内容。</p><p>用 Q 与所有 K 计算相关性，再对 V 做加权求和。相关性越高，对应的信息就越值得被关注。</p><div class="formula">Attention(Q, K, V) = softmax(QKᵀ / √dₖ) V</div><h3>2. 为什么要做缩放？</h3><p>点积的量级会随维度增大。除以 √dₖ 可以把 Softmax 的输入保持在较合适的范围，避免输出过于集中、梯度过小。</p><h3>3. 多头与位置编码</h3><p>多头注意力让模型在不同子空间里并行寻找关系；位置编码则补充序列的顺序。你可以从下面的问题继续追问，也可以把某个概念单独开成一个分支。</p>`;
const answers={root:rootAnswer,scale:'<p>假设 Q、K 的各分量独立，均值为 0、方差为 1，则点积 Q·K 的方差随维度 d 线性增长。</p><div class="formula">Var(Q · K) = d → Var(Q · K / √d) = 1</div><p>过大的点积让 Softmax 输出接近 one-hot，梯度变小。缩放的目标，是把数值拉回更适合训练的范围。</p><p>这是原始 Transformer 使用缩放点积注意力的原因。实际训练中的分量未必严格独立，但这个简单修正很有效。</p>',gradient:'<p>设 Softmax 输出为 pᵢ，它对自身输入的导数为：</p><div class="formula">∂pᵢ / ∂zᵢ = pᵢ (1 − pᵢ)</div><p>当 pᵢ 接近 0 或 1，乘积就接近 0。反向传播时，这个较小的梯度会继续传递，影响参数更新。</p>',heads:'<p>单头只用一组 QKV 计算关系；多头同时使用多组投影，每组在不同子空间里寻找关联。</p><p>它让模型可以并行表达不同的依赖关系。各头不一定对应可直接解释的语言学概念，但共同提高了表达能力。</p>',rope:'<p>RoPE 把位置信息编码为 Q、K 的旋转，使点积自然包含相对位置的信息。</p><p>绝对位置编码则给每个位置一个表示，再与词向量相加。两者都在补充注意力本身缺少的顺序信息。</p>'};

function contextPanel(){const items=state.branches.filter(b=>!b.archived).map(b=>`<button class="branch-row ${b.id===state.branch?'active':''} ${b.parent==='root'?'depth':b.parent?'depth2':''}" data-branch="${b.id}"><span>${b.parent?'↳':'◉'}</span>${safe(b.title)}${b.unread?'<span class="dot"></span>':''}</button>`).join('');let body=state.context==='notes'?`<small>批注与稳定回答内容绑定</small>${state.notes.map(n=>`<div class="context-note"><blockquote>${safe(n.quote)}</blockquote><p>${safe(n.text)}</p><button class="tool" data-action="note-open">编辑批注</button></div>`).join('')}<button class="btn" data-action="note-open">添加批注</button>`:state.context==='source'?`<h3>创建时的来源</h3><div class="source">${state.branch==='root'?'这是主题的根分支，没有上游来源。':`来源：${safe(state.branches.find(b=>b.id===state.branches.find(x=>x.id===state.branch)?.parent)?.title||'注意力机制')}<hr class="rule">分支出生时冻结上下文；后续版本变化不改写这份来源。`}</div><button class="btn" data-branch="root">返回来源回答</button>`:`<div class="branch-outline">${items}</div><div class="mini-map">${graph(true)}</div><div class="context-footer"><button class="btn" data-page="tree">${icon('tree')}展开完整树图</button></div><hr class="rule"><h3>这条分支的要点</h3><p class="muted" style="margin-top:var(--s3)">QKV 负责相关性计算；缩放让 Softmax 保持在合适的数值范围。</p>`;return `<aside class="context"><div class="row spread context-title"><h3>学习脉络</h3><button class="icon" data-action="toggle-context" aria-label="收起侧栏">${icon('close')}</button></div><div class="context-tabs">${[['branches','分支'],['source','来源'],['notes','批注']].map(([v,t])=>`<button class="${state.context===v?'active':''}" data-context="${v}">${t}${v==='notes'?` · ${state.notes.length}`:''}</button>`).join('')}</div>${body}</aside>`}
function chat(){const b=state.branches.find(x=>x.id===state.branch)||state.branches[0];const answer=answers[b.id]||'<p>这是刚创建的学习分支。你可以在这里继续追问，主分支的阅读位置和草稿会被保留。</p>';const extra=(state.messages[b.id]||[]).map(m=>`<div class="user-message">${safe(m.question)}</div><div class="answer-header"><img src="${logo}" alt="">知芽 <span class="muted">· ${m.status==='stable'?'已完成':m.status==='failed'?'生成失败':'生成已停止'}</span></div><div class="answer">${safe(m.answer)}</div><div class="answer-actions">${m.status==='stable'?'<button data-action="fork">从这条回答分叉</button>':'<button data-action="retry">原位重试</button>'}</div>`).join('');return `${header(safe(b.title),`<button data-page="library">学习库</button> / <button data-branch="root">注意力机制</button>${b.parent?' / 子分支':''}`,`<button class="btn quiet" data-action="toggle-context" aria-label="学习脉络">${icon('tree')}<span class="toolbar-label">学习脉络</span></button><button class="icon" data-action="branch-menu" aria-label="分支操作">${icon('more')}</button>`)}<div class="workspace ${state.layout} ${state.layout==='focus'?(state.contextOpen?'show-context':'context-hidden'):''}" id="workspace"><section class="conversation"><div class="message-list" id="message-list"><div class="message-inner"><div class="user-message">${safe(b.question)}</div><div class="answer-header"><img src="${logo}" alt="">知芽 <span class="muted">· ${state.model} · 稳定回答</span></div><details class="reasoning"><summary>思考过程 · 已完成</summary><p>先给出可理解的直觉，再逐步解释 QKV、缩放和多头，让每个概念都能继续深入。</p></details><article class="answer" id="answer-text" data-answer="stable">${answer}</article><div class="answer-actions"><button data-action="fork">${icon('fork')} 分叉深入</button><button data-action="quote">引用</button><button data-action="copy">复制</button><button data-action="versions">← 1 / 2 →</button><button data-action="speak">朗读</button><button data-action="translate">翻译</button><button data-action="reset">重新生成</button></div><div class="suggestions">${['为什么相似度要除以 √d？','多头注意力的头数怎么选？'].map((q,i)=>`<div class="suggestion"><button data-follow="${i}">${q}</button><button data-fork-suggestion="${i}" aria-label="分叉追问：${q}">分叉 ↗</button></div>`).join('')}</div>${extra}<div id="stream-area">${state.running?`<div class="user-message">${safe(state.pendingQuestion)}</div><div class="answer-header">知芽 · 正在回答</div><div class="answer" id="stream-text">${safe(state.partial)}</div>`:''}</div></div><button class="follow" data-action="follow-latest" hidden>回到最新回答 ↓</button></div><div class="composer"><div class="composer-inner">${state.quote?`<div class="quote-chip"><span>引用：${safe(state.quote)}</span><button data-action="clear-quote" aria-label="清除引用">×</button></div>`:''}${state.attachment?`<div class="quote-chip"><span>附件：${safe(state.attachment)}</span><button data-action="clear-attachment" aria-label="移除附件">×</button></div>`:''}<textarea id="draft" placeholder="继续追问，或选中一段回答深入…" aria-label="追问输入">${safe(state.drafts[b.id]||'')}</textarea><div class="composer-tools"><button class="tool" data-action="model">${safe(state.model)} ▾</button><button class="tool" data-action="thinking" aria-pressed="${state.thinking}">思考</button><button class="tool" data-action="web-search" aria-pressed="${state.webSearch}">联网</button><button class="icon" data-action="attach" aria-label="添加附件">${icon('attachment')}</button><button class="icon" data-action="voice" aria-label="语音输入">${icon('mic')}</button><button class="icon" data-action="fullscreen" aria-label="全屏编辑输入">${icon('fit')}</button><button class="btn primary send" data-action="${state.running?'stop':'send'}">${state.running?'停止':'发送'} ${state.running?'■':icon('send')}</button></div></div><div class="composer-hint">Enter 发送 · Shift + Enter 换行 · 选中文本可引用、分叉或批注</div></div></section>${contextPanel()}<aside class="split-reading"><div class="cap">来源对照</div><div class="row spread" style="margin-top:var(--s3)"><h2>为什么要除以 √d？</h2><button class="tool" data-branch="scale">打开分支 ↗</button></div><div class="source muted">从主干的「缩放点积」创建，独立保存创建时的上下文。</div><div class="answer">${answers.scale}</div><hr class="rule"><p class="muted">两栏各自滚动。当前分支继续写在左侧，右侧用于阅读对照。</p></aside></div>`}
function library(){let rows=state.library==='archived'?state.branches.filter(b=>b.archived&&!state.branches.some(p=>p.id===b.parent&&p.archived)):state.branches.filter(b=>b.parent===null&&!b.archived);return `${header('学习库','主题、搜索与归档',`<button class="btn" data-action="new-topic">${icon('plus')}新建主题</button>`)}<div class="page-body"><div class="body-limit"><div class="segmented"><button class="${state.library==='active'?'active':''}" data-library="active">学习中</button><button class="${state.library==='archived'?'active':''}" data-library="archived">已归档</button></div><div class="searchbox">${icon('search')}<input id="library-search" placeholder="搜索主题、分支和回答…" aria-label="搜索学习内容"><span class="muted">Ctrl K</span></div><div id="library-results">${rows.map(b=>`<div class="library-row"><div><h3>${safe(b.title)}</h3><p>从问题出发，沿着分支继续深入。</p><div class="row muted">${b.archived?'归档子树 · 可整体恢复':`${state.branches.filter(x=>!x.archived).length} 个分支 · 保留阅读位置`}</div></div><div class="row">${b.archived?`<button class="btn" data-restore="${b.id}">恢复</button><button class="btn danger" data-delete="${b.id}">删除子树</button>`:`<button class="btn" data-branch="${b.id}">继续学习 ${icon('arrow')}</button>`}</div></div>`).join('')||'<div class="empty">还没有归档的分支。可从对话右上角归档一个非根分支。</div>'}${state.library==='active'?'<div class="library-row"><div><h3>冷链物流的断链风险点</h3><p>装卸月台、干支交接和零售冷柜。</p><div class="row muted"><span class="dot"></span>有未读回答 · 示例主题</div></div><button class="btn" data-action="other-topic">打开主题 →</button></div>':''}</div></div></div>`}
function graph(mini=false){
const active=state.branches.filter(b=>!b.archived);const nodes=[],edges=[];let row=0;
let root=active.find(b=>b.id===state.branch)||active[0];while(root?.parent){root=active.find(b=>b.id===root.parent)}
function walk(b,depth){const kids=active.filter(c=>c.parent===b.id);const start=row;const x=depth*280+30;let y;
if(kids.length){const childNodes=kids.map(c=>walk(c,depth+1));y=(childNodes[0].y+childNodes[childNodes.length-1].y)/2;childNodes.forEach(c=>edges.push({x1:x+230,y1:y+40,x2:c.x,y2:c.y+40}));}else{y=row*110+50;row++;}
const node={...b,x,y,depth};nodes.push(node);return node;}
if(root)walk(root,0);const height=Math.max(500,row*110+120);
return `<svg class="graph" viewBox="0 0 1120 ${height}" aria-label="注意力机制学习树"><g id="graph-inner" transform="translate(${state.treePan.x},${state.treePan.y}) scale(${state.treeZoom})">${edges.map(e=>`<path d="M${e.x1} ${e.y1}C${e.x1+35} ${e.y1},${e.x2-35} ${e.y2},${e.x2} ${e.y2}"/>`).join('')}${nodes.map(n=>`<g class="node ${state.branch===n.id?'selected':''}" role="button" tabindex="0" aria-label="打开分支：${safe(n.title)}" data-graph-branch="${n.id}" transform="translate(${n.x},${n.y})"><rect width="230" height="80" rx="8"/><text x="18" y="32">${safe(n.title.length>13?n.title.slice(0,13)+'…':n.title)}</text><text class="sub" x="18" y="57">${n.parent?'来自稳定回答':'主题主干'}</text>${n.unread?'<circle cx="210" cy="18" r="4" fill="var(--blue)" stroke="none"/>':''}</g>`).join('')}</g></svg>`}
function tree(){return `${header('注意力机制 · 树总览','每条分支，都能回到自己的来源',`<button class="btn" data-branch="${state.branch}">回到当前分支 ${icon('arrow')}</button>`)}<div class="tree-page"><div class="tree-tools"><div class="row"><span class="muted">${state.branches.filter(b=>!b.archived).length} 个分支</span><span class="pill">${safe(state.branches.find(b=>b.id===state.branch)?.title||'主干')}</span></div><div class="row"><button class="icon" data-action="zoom-out" aria-label="缩小树图">−</button><span id="zoom-value" class="muted">${Math.round(state.treeZoom*100)}%</span><button class="icon" data-action="zoom-in" aria-label="放大树图">＋</button><button class="btn" data-action="fit-tree">适应视口</button></div></div><div class="tree-canvas" id="tree-canvas">${graph()}<div class="tree-hint">拖动画布平移 · 滚轮缩放 · 点击节点进入对话</div><div class="tree-legend"><span class="dot"></span> 未读回答</div></div></div>`}
const settingNames=[['providers','提供商'],['models','模型与上下文'],['search','联网搜索'],['voice','语音'],['files','文件管理'],['general','常规']];
function settings(){let c='';if(state.settings==='providers')c=`<div class="row spread"><h2>提供商</h2><button class="btn primary" data-action="add-provider">${icon('plus')}添加提供商</button></div><p class="muted" style="margin-top:var(--s2)">配置本机使用的模型服务。密钥只显示脱敏状态。</p><table class="table"><thead><tr><th>提供商</th><th>模型</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td><b>DeepSeek</b><br><small>api.deepseek.com</small></td><td>deepseek-chat<br><small>OpenAI 兼容</small></td><td><button class="switch" role="switch" aria-label="启用 DeepSeek" aria-checked="${state.providerEnabled}" data-action="provider-toggle"></button></td><td><button class="btn" data-action="edit-provider">管理</button></td></tr>${state.providerAdded?'<tr><td>自定义提供商<br><small>示例配置</small></td><td>未获取</td><td><span class="pill">待配置</span></td><td><button class="btn" data-action="edit-provider">管理</button></td></tr>':''}</tbody></table><div class="notice">两端数据独立。这里的配置和 Key 不会同步到手机版。</div>`;
else if(state.settings==='models')c=`<h2>模型与上下文</h2><p class="muted">区分教学回答与派生任务，沿用手机版的用途规则。</p>${[['聊天模型','用于当前分支的回答'],['快速任务模型','用于标题、摘要和推荐问题'],['翻译模型','用于消息翻译']].map(([a,b])=>`<div class="setting-row"><div><b>${a}</b><p>${b}</p></div><select aria-label="${a}"><option>deepseek-chat</option><option>deepseek-reasoner</option></select></div>`).join('')}<div class="setting-row"><div><b>上下文预算</b><p>超过预算时进行压缩；失败时暂停，不静默丢内容。</p></div><select aria-label="上下文预算"><option>自动</option><option>关闭</option><option>低</option><option>中</option><option>高</option></select></div><div class="setting-row"><div><b>推荐追问</b><p>在稳定回答后提供进一步探索的方向。</p></div><button class="switch" role="switch" aria-label="推荐追问" aria-checked="true" data-action="switch"></button></div>`;
else if(state.settings==='personas')c=`<h2>AI 人设</h2><p class="muted">内置人设与手机版保持一致；选择影响后续请求。</p>${['学习导师','苏格拉底式引导','严谨解释'].map(p=>`<div class="setting-row"><div><b>${p}</b><p>${p==='学习导师'?'从直觉到原理，逐步建立知识结构。':'示例标签，正式清单以手机版已落地目录为准。'}</p></div><button class="btn ${state.persona===p?'primary':''}" data-persona="${p}">${state.persona===p?'已选':'选择'}</button></div>`).join('')}`;
else if(state.settings==='search')c=`<h2>联网搜索</h2><p class="muted">搜索是独立的服务配置，聊天输入栏可按次开关。</p><div class="setting-row"><div><b>搜索服务</b><p>与手机版一致：Tavily、智谱、博查。</p></div><select aria-label="搜索服务"><option>Tavily</option><option>智谱</option><option>博查</option></select></div><div class="setting-row"><div><b>服务 Key</b><p>已配置 · 仅显示状态</p></div><button class="btn" data-action="search-key">修改</button></div><div class="setting-row"><div><b>连接检查</b><p>失败时给出可操作的原因。</p></div><button class="btn" data-action="test-search">测试连接</button></div>`;
else if(state.settings==='voice')c=`<h2>语音</h2><p class="muted">朗读与语音输入分别设置；识别结果先进入草稿。</p><div class="setting-row"><div><b>朗读引擎</b><p>Web 使用平台能力适配。</p></div><select aria-label="朗读引擎"><option>浏览器语音合成</option></select></div><div class="setting-row"><div><b>试听</b><p>本原型仅展示试听状态。</p></div><button class="btn" data-action="speak">试听</button></div><div class="setting-row"><div><b>语音输入</b><p>需要麦克风权限；不支持时显示说明。</p></div><button class="btn" data-action="voice">体验识别流程</button></div>`;
else if(state.settings==='files')c=`<div class="row spread"><h2>文件管理</h2><button class="btn" data-action="attach">${icon('plus')}添加文件</button></div><p class="muted">管理当前电脑的附件，删除前核对引用关系。</p><div class="dropzone" id="dropzone">拖入文件，或点击「添加文件」<br><small>原型仅展示文件名，不读取文件内容</small></div><table class="table"><thead><tr><th>文件名</th><th>引用</th><th>操作</th></tr></thead><tbody>${state.fileNames.map((f,i)=>`<tr><td>${safe(f)}</td><td>${i===0?'已被回答引用':'待附加'}</td><td><button class="tool danger" data-file-delete="${i}">删除</button></td></tr>`).join('')}</tbody></table>`;
else c=`<h2>常规</h2><div class="setting-row"><div><b>发送方式</b><p>中文输入法确认候选时不发送。</p></div><select aria-label="发送方式"><option>Enter 发送</option><option>Ctrl + Enter 发送</option></select></div><div class="setting-row"><div><b>界面语言</b><p>正式端提供中文与英文。</p></div><select aria-label="界面语言"><option>简体中文</option><option>English</option></select></div><div class="notice">Web 的数据独立保存在此电脑。当前原型使用示例数据，不连接手机或模型服务。</div>`;
return `${header('设置','当前电脑的偏好与服务配置')}<div class="page-body" style="padding:0"><div class="settings-layout"><nav class="settings-nav" aria-label="设置分类">${settingNames.map(([v,t])=>`<button class="nav ${state.settings===v?'active':''}" data-setting="${v}">${t}</button>`).join('')}</nav><section class="settings-content"><div class="settings-limit">${c}</div></section></div></div>`}
function stats(){return `${header('学习足迹','从问题到理解，一点点积累')}<div class="page-body"><div class="body-limit"><div class="notice">以下统计来自示例学习数据，用于展示信息层级。</div><div class="stats"><div class="stat"><small>累计提问</small><b>${state.branches.length+Object.values(state.messages).reduce((n,a)=>n+a.length,0)}</b></div><div class="stat"><small>累计消息</small><b>${2*(state.branches.length+Object.values(state.messages).reduce((n,a)=>n+a.length,0))}</b></div><div class="stat"><small>连续学习</small><b>示例</b></div></div><h2>2026 年 10 月 · 学习活动</h2><div class="heatmap" aria-label="示例当前月学习热力图">${Array.from({length:42},()=>'<i></i>').join('')}</div><div class="row spread muted"><span>当前月 · 示例</span><span>少　◻　◼　多</span></div><hr class="rule"><h3>最近深入的方向</h3><div class="continue-item"><div><b>缩放点积与 Softmax</b><p class="muted">从直觉继续走到公式推导。</p></div><button class="btn" data-branch="scale">继续探索 →</button></div></div></div>`}
function render(){document.getElementById('sidebar').innerHTML=sidebar();document.getElementById('main').innerHTML=({home,chat,library,tree,settings,stats}[state.page]||chat)();document.querySelectorAll('[data-layout]').forEach(b=>b.classList.toggle('active',b.dataset.layout===state.layout));const draft=document.getElementById('draft');if(draft)draft.addEventListener('input',()=>state.drafts[state.branch]=draft.value);const list=document.getElementById('message-list');if(list)list.scrollTop=state.positions[state.branch]||0;if(list)list.addEventListener('scroll',()=>{const f=list.querySelector('.follow');if(f)f.hidden=list.scrollHeight-list.scrollTop-list.clientHeight<100});const search=document.getElementById('library-search');if(search)search.addEventListener('input',()=>searchLibrary(search.value));wireTree();wireDrop()}
function searchLibrary(q){const rows=state.branches.filter(b=>!b.archived&&b.title.includes(q));if(!q){render();document.getElementById('library-search')?.focus();return}document.getElementById('library-results').innerHTML=rows.map(b=>`<div class="library-row"><div><h3>${safe(b.title)}</h3><p>命中分支标题 · 大语言模型的注意力机制</p></div><button class="btn" data-branch="${b.id}">打开并定位 →</button></div>`).join('')||'<div class="empty">没有找到匹配的内容。试试「注意力」或「梯度」。</div>'}
function fork(prefill=''){modal('从回答创建分支',`<p>新分支保留这条稳定回答的创建时上下文。原分支不受影响。</p>${state.selection?`<div class="quote-chip">${safe(state.selection)}</div>`:''}<div class="field"><label for="fork-title">分支名称</label><input id="fork-title" value="${safe(prefill||'进一步理解注意力机制')}"></div><div class="field"><label for="fork-question">想深入的问题</label><textarea id="fork-question" placeholder="写下想继续探索的问题…">${safe(prefill)}</textarea></div>`,`<button class="btn primary" data-action="fork-create">创建并进入 →</button>`)}
function clearSelection(){document.getElementById('selectionBar').hidden=true;state.selection='';selectionRange=null}
function selectionCapture(){const sel=window.getSelection();if(!sel||sel.isCollapsed)return;const answer=document.getElementById('answer-text');if(!answer||!answer.contains(sel.anchorNode)||!answer.contains(sel.focusNode))return;state.selection=sel.toString();selectionRange=sel.getRangeAt(0).cloneRange();const rect=selectionRange.getBoundingClientRect(),bar=document.getElementById('selectionBar');bar.hidden=false;bar.style.left=Math.max(8,Math.min(rect.left,window.innerWidth-bar.offsetWidth-8))+'px';bar.style.top=Math.max(8,rect.top-bar.offsetHeight-8)+'px'}
function noteEditor(){modal('给这段话写批注',`<p>批注保存选区与内容身份；回答内容变化时按原有规则失效。</p><div class="quote-chip" id="note-quote">${safe(state.selection||state.notes[0]?.quote||'注意力机制')}</div><div class="field"><label for="note-text">你的理解</label><textarea id="note-text">${safe(state.selection?'':state.notes[0]?.text||'')}</textarea></div>`,`<button class="btn primary" data-action="note-save">保存批注</button>`)}
function startGeneration(q,fail=false){saveDraft();q=q||state.drafts[state.branch];if(!q?.trim()){toast('先写下想追问的问题');return}if(state.running){toast('这条分支已有回答正在生成');return}state.pendingQuestion=q;state.pendingBranch=state.branch;state.running=true;state.failed=false;state.partial='';state.drafts[state.branch]='';state.quote='';clearSelection();render();const answer='这是原型演示的回答。真正的 Web 版会由本机服务生成、持久保存，并在刷新或中断后从权威状态恢复。你可以按「停止」体验中断后的原位重试。';let i=0;const timer=setInterval(()=>{i+=1;state.partial=answer.slice(0,i);const el=document.getElementById('stream-text');if(el)el.textContent=state.partial;if(i>=answer.length){clearInterval(timer);finishGeneration('stable')}},80);state.timers=[timer]}
function finishGeneration(status){state.timers.forEach(clearInterval);state.timers=[];const id=state.pendingBranch;if(!state.messages[id])state.messages[id]=[];state.messages[id].push({question:state.pendingQuestion,answer:state.partial||'生成还没有返回内容。',status});state.running=false;render();const list=document.getElementById('message-list');if(list)list.scrollTop=list.scrollHeight;if(status!=='stable')toast('已停止，部分回答保留；可原位重试')}
function providerEditor(){modal('管理提供商',`<div class="field"><label for="provider-name">名称</label><input id="provider-name" value="DeepSeek"></div><div class="field"><label for="provider-url">服务地址</label><input id="provider-url" value="https://api.deepseek.com"></div><div class="field"><label for="provider-key">API Key</label><input id="provider-key" type="password" placeholder="原型请勿填写真实密钥" autocomplete="off"></div><p class="muted">正式版交给本机服务安全保存，页面只显示脱敏状态。</p><div class="row"><button class="btn" data-action="fetch-models">获取模型</button><button class="btn danger" data-action="delete-key">删除 Key</button></div>`,`<button class="btn primary" data-action="provider-save">保存</button>`)}
function wireDrop(){const d=document.getElementById('dropzone')||document.getElementById('draft');if(!d)return;d.addEventListener('dragover',e=>e.preventDefault());d.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)acceptFile(f)})}
function acceptFile(f){if(!state.fileNames.includes(f.name))state.fileNames.push(f.name);if(state.page==='chat')state.attachment=f.name;render();toast('已添加示例附件：'+f.name)}
function graphTransform(){const g=document.getElementById('graph-inner');if(g)g.setAttribute('transform',`translate(${state.treePan.x},${state.treePan.y}) scale(${state.treeZoom})`);const z=document.getElementById('zoom-value');if(z)z.textContent=Math.round(state.treeZoom*100)+'%'}
function wireTree(){const c=document.getElementById('tree-canvas');if(!c)return;let pointer=null;c.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;pointer={x:e.clientX,y:e.clientY,px:state.treePan.x,py:state.treePan.y};c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!pointer)return;const ratio=1100/c.clientWidth;state.treePan={x:pointer.px+(e.clientX-pointer.x)*ratio,y:pointer.py+(e.clientY-pointer.y)*ratio};graphTransform()});c.addEventListener('pointerup',()=>pointer=null);c.addEventListener('wheel',e=>{e.preventDefault();state.treeZoom=Math.max(.5,Math.min(2,state.treeZoom+(e.deltaY<0?.1:-.1)));graphTransform()},{passive:false})}
document.addEventListener('click',async e=>{const t=e.target.closest('button,[data-action],[data-graph-branch]');if(!t)return;if(t.dataset.page){nav(t.dataset.page);return}if(t.dataset.branch){branch(t.dataset.branch);return}if(t.dataset.graphBranch){if(t.dataset.graphBranch==='example'){toast('示例折叠分支；正式版展开后定位子节点');return}branch(t.dataset.graphBranch);return}if(t.dataset.layout){saveDraft();state.layout=t.dataset.layout;if(state.layout==='explore')state.context='branches';state.page='chat';render();if(typeof window.toggleSelect==='function')window.toggleSelect(document.querySelector(`[data-layout="${state.layout}"]`));return}if(t.dataset.context){state.context=t.dataset.context;saveDraft();render();return}if(t.dataset.setting){state.settings=t.dataset.setting;render();return}if(t.dataset.library){state.library=t.dataset.library;render();return}if(t.dataset.persona){state.persona=t.dataset.persona;render();toast('已选择 '+state.persona+'（示例）');return}if(t.dataset.follow){startGeneration(['为什么相似度要除以 √d？','多头注意力的头数怎么选？'][Number(t.dataset.follow)]);return}if(t.dataset.forkSuggestion){fork(['为什么相似度要除以 √d？','多头注意力的头数怎么选？'][Number(t.dataset.forkSuggestion)]);return}if(t.dataset.restore){const pending=[t.dataset.restore];while(pending.length){const id=pending.pop();const b=state.branches.find(x=>x.id===id);if(b)b.archived=false;pending.push(...state.branches.filter(x=>x.parent===id).map(x=>x.id))}render();toast('已恢复整个子树（演示）');return}if(t.dataset.delete){modal('删除这条归档子树？','<p>删除会影响这条分支及其子分支。正式版先核对生成状态，再在事务中执行。</p>',`<button class="btn danger" data-confirm-delete="${t.dataset.delete}">确认删除</button>`);return}if(t.dataset.confirmDelete){{const ids=new Set([t.dataset.confirmDelete]);let grew=true;while(grew){grew=false;state.branches.forEach(b=>{if(ids.has(b.parent)&&!ids.has(b.id)){ids.add(b.id);grew=true}})}state.branches=state.branches.filter(b=>!ids.has(b.id))};closeDialog();render();toast('已删除示例子树');return}if(t.dataset.fileDelete){modal('删除这个附件？','<p>文件内容会被删除，回答中的附件引用保留为缺失标记。回答正文不受影响。</p>',`<button class="btn danger" data-confirm-file="${t.dataset.fileDelete}">确认删除</button>`);return}
if(t.dataset.confirmFile){state.fileNames.splice(Number(t.dataset.confirmFile),1);closeDialog();render();toast('已删除示例文件，引用保留缺失标记');return}
const a=t.dataset.action;switch(a){case'menu':document.getElementById('app').classList.toggle('menu-open');break;case'guide':modal('这份原型可以怎样体验？','<p>切换 A/B/C 布局，选中文字进行引用、分叉或批注；发送并停止一条示例回答；在树图里平移、缩放和进入分支；打开学习库与设置。</p><p>这是可离线打开的设计原型。生成、语音、凭据和持久化均为演示，请勿填写真实 Key。布局仍待你 review。</p>','<button class="btn primary" data-action="dialog-close">开始体验</button>');break;case'dialog-close':closeDialog();break;case'toggle-context':saveDraft();state.contextOpen=!state.contextOpen;if(state.layout!=='focus')state.layout='focus';render();break;case'new-topic':nav('home');setTimeout(()=>document.getElementById('new-question')?.focus(),0);break;case'home-start':{const q=document.getElementById('new-question')?.value;if(!q?.trim()){toast('写下一个想弄懂的问题');return}const id='topic-'+Date.now();state.branches.push({id,title:q.length>20?q.slice(0,20)+'…':q,parent:null,question:q,unread:false});answers[id]='<p>新主题已创建（演示）。这里将展示模型的第一条回答，后续可以从稳定回答创建学习分支。</p>';branch(id);break}case'other-topic':toast('此主题为示例入口，当前重点演示注意力机制的完整流程');break;case'fork':fork();break;case'fork-create':{const title=document.getElementById('fork-title').value.trim(),q=document.getElementById('fork-question').value.trim();if(!title){toast('请填写分支名称');return}const id='branch-'+Date.now();state.branches.push({id,title,parent:state.branch,question:q||title,unread:false});closeDialog();clearSelection();branch(id);toast('新分支已创建，来源上下文已冻结（演示）');break}case'quote':state.quote='关于这条回答的注意力机制解释';saveDraft();render();document.getElementById('draft')?.focus();break;case'clear-quote':state.quote='';saveDraft();render();break;case'copy':case'selection-copy':{const text=a==='selection-copy'?state.selection:document.getElementById('answer-text')?.innerText||'';try{await navigator.clipboard.writeText(text);toast('已复制')}catch{toast('浏览器未允许复制，可使用 Ctrl + C')}clearSelection();break}case'selection-quote':state.quote=state.selection;saveDraft();clearSelection();render();document.getElementById('draft')?.focus();break;case'selection-fork':fork();document.getElementById('selectionBar').hidden=true;break;case'selection-highlight':{if(selectionRange){const mark=document.createElement('mark');mark.dataset.action='note-open';try{mark.append(selectionRange.extractContents());selectionRange.insertNode(mark);toast('已高亮选区（当前预览）')}catch{toast('请在一段正文中重新选择')}}clearSelection();break}case'note-open':case'selection-note':noteEditor();document.getElementById('selectionBar').hidden=true;break;case'note-save':{const text=document.getElementById('note-text').value.trim();if(!text){toast('先写下你的理解');return}state.notes.push({quote:document.getElementById('note-quote').textContent,text});state.context='notes';state.contextOpen=true;closeDialog();clearSelection();saveDraft();render();toast('批注已保存（当前预览）');break}case'send':startGeneration();break;case'stop':if(state.running)finishGeneration('canceled');break;case'retry':{const msgs=state.messages[state.branch]||[],m=msgs.pop();if(m){state.drafts[state.branch]=m.question;startGeneration(m.question)}break}case'follow-latest':{const l=document.getElementById('message-list');l.scrollTop=l.scrollHeight;break}case'model':modal('当前聊天模型','<p>从已启用提供商选择模型。配置失效时沿用手机版的回落规则并提示，生成失败不会偷偷切换提供商。</p><div class="stack"><button class="btn" data-model="deepseek-chat">deepseek-chat</button><button class="btn" data-model="deepseek-reasoner">deepseek-reasoner</button></div>');break;case'thinking':saveDraft();state.thinking=!state.thinking;render();break;case'web-search':saveDraft();state.webSearch=!state.webSearch;render();break;case'attach':document.getElementById('file-input').click();break;case'clear-attachment':state.attachment='';saveDraft();render();break;case'voice':modal('语音输入','<p>点击开始后，识别结果先追加到草稿，由你确认后发送。原型不访问真实麦克风。</p>','<button class="btn primary" data-action="voice-result">模拟完成识别</button>');break;case'voice-result':state.drafts[state.branch]=(state.drafts[state.branch]||'')+'请再给我一个直观的例子。';closeDialog();nav('chat');toast('识别结果已追加草稿，没有自动发送');break;case'speak':toast('已切换到朗读状态（原型不播放音频）');t.textContent='停止朗读';t.dataset.action='speak-stop';break;case'speak-stop':t.textContent='朗读';t.dataset.action='speak';toast('已停止朗读');break;case'translate':modal('消息翻译','<p>Attention helps the model choose which information matters for the current query.</p><p class="muted">示例翻译。正式版由独立的翻译模型任务生成并可收起。</p>','<button class="btn primary" data-action="dialog-close">收起</button>');break;case'versions':modal('回答版本','<p>切换版本不会改写已经创建的子分支快照。</p><div class="stack"><button class="btn" data-action="version-select">版本 1 · 当前显示</button><button class="btn" data-action="version-select">版本 2 · 另一次稳定回答</button></div>');break;case'version-select':closeDialog();toast('已切换示例版本；正式版显示对应不可变回答内容');break;case'reset':modal('重新生成回答','<p>生成一个新版本，已有子分支保留原始来源。原型仅演示确认流程。</p>','<button class="btn primary" data-action="reset-confirm">重新生成</button>');break;case'reset-confirm':closeDialog();toast('已提交重新生成（演示）');break;case'branch-menu':modal('当前分支操作',`<p>${state.branch==='root'?'根分支不能归档。':'归档会整体隐藏当前分支及其子树。'}</p><div class="stack"><button class="btn" data-action="rename-branch">重命名</button><button class="btn" ${state.branch==='root'?'disabled':''} data-action="archive-branch">归档子树</button></div>`);break;case'rename-branch':closeDialog();modal('重命名分支',`<div class="field"><label for="branch-name">名称</label><input id="branch-name" value="${safe(state.branches.find(b=>b.id===state.branch)?.title)}"></div>`,'<button class="btn primary" data-action="rename-save">保存</button>');break;case'rename-save':{const name=document.getElementById('branch-name').value.trim();if(!name)return;state.branches.find(b=>b.id===state.branch).title=name;closeDialog();render();break}case'archive-branch':{const pending=[state.branch];while(pending.length){const id=pending.pop();const b=state.branches.find(x=>x.id===id);if(b)b.archived=true;pending.push(...state.branches.filter(x=>x.parent===id).map(x=>x.id))}closeDialog();state.branch='root';state.library='archived';nav('library');toast('已归档子树，可在学习库整体恢复');break}case'fullscreen':saveDraft();modal('专注编辑',`<div class="field"><label for="full-draft">你的问题</label><textarea id="full-draft" style="min-height:calc(var(--s8)*7)">${safe(state.drafts[state.branch]||'')}</textarea></div>`,'<button class="btn primary" data-action="fullscreen-save">返回输入栏</button>');break;case'fullscreen-save':state.drafts[state.branch]=document.getElementById('full-draft').value;closeDialog();render();break;case'zoom-in':state.treeZoom=Math.min(2,state.treeZoom+.1);graphTransform();break;case'zoom-out':state.treeZoom=Math.max(.5,state.treeZoom-.1);graphTransform();break;case'fit-tree':state.treeZoom=1;state.treePan={x:0,y:0};graphTransform();break;case'add-provider':providerEditor();document.getElementById('provider-name').value='自定义提供商';document.getElementById('provider-url').value='';break;case'edit-provider':providerEditor();break;case'provider-save':document.getElementById('provider-key').value='';state.providerAdded=true;closeDialog();render();toast('提供商配置已保存（示例）');break;case'provider-toggle':state.providerEnabled=!state.providerEnabled;render();break;case'fetch-models':toast('已获取 2 个示例模型；正式版执行真实连接校验');break;case'delete-key':document.getElementById('provider-key').value='';toast('已删除示例 Key');break;case'search-key':providerEditor();break;case'test-search':toast('示例连接成功；原型未调用搜索服务');break;case'switch':t.setAttribute('aria-checked',t.getAttribute('aria-checked')!=='true');break;default:break}
if(t.dataset.model){state.model=t.dataset.model;closeDialog();saveDraft();render()}
});
document.addEventListener('pointerup',()=>setTimeout(selectionCapture,0));
document.getElementById('selectionBar').addEventListener('pointerdown',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.key==='Escape'){clearSelection();document.getElementById('app').classList.remove('menu-open')}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();nav('library');document.getElementById('library-search')?.focus()}if(e.target.id==='draft'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();if(!state.running)startGeneration()}if(e.target.dataset.graphBranch&&e.key==='Enter')branch(e.target.dataset.graphBranch)});
document.getElementById('file-input').addEventListener('change',e=>{if(e.target.files[0])acceptFile(e.target.files[0]);e.target.value=''});
render();
</script>
</body></html>
