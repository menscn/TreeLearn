        <svg class="chev" aria-hidden="true"><use href="#i-chevron-right"></use></svg>
      </div>
      <p>本分支从注意力权重可视化与模型可解释性的关系出发，明确可视化只是局部内部机制观察工具、不等同于解释（权重与因果贡献不等同），随后深入讨论注意力头消融实验的流程及如何区分“头真重要”与“其他头补偿性替代”。</p>
      <div class="meta">

        1 个分支 · 3天前
      </div>

        <svg class="chev" aria-hidden="true"><use href="#i-chevron-right"></use></svg>
      </div>
      <p>本分支系统讲解了 Transformer 的注意力机制：先给出注意力的精确函数定义，再聚焦缩放点积注意力的矩阵形式与符号含义，说明除以 √d_k 的方差推导原因，对比编码器自注意力、解码器掩码自注意力和交叉注意力三种用法。</p>
      <div class="meta">
        <svg class="icon" aria-hidden="true"><use href="#i-tree"></use></svg>
        2 个分支 · 3天前
