/* 工具：文本块渲染 + 区间合并 */
function mergeRanges(list, start, end){
  const all = list.filter(h => !(h.end < start || h.start > end))
    .concat([{start, end}]);
  const lo = Math.min(...all.map(h => h.start));
  const hi = Math.max(...all.map(h => h.end));
  const kept = list.filter(h => (h.end < start || h.start > end));
  return kept.concat([{start: lo, end: hi}]);
}
function renderMarked(text, ranges, blockId, onTapMark){
  if(!ranges || ranges.length === 0) return text;
  const sorted = [...ranges].sort((a,b) => a.start - b.start);
  const out = []; let cur = 0;
  sorted.forEach((r,i) => {
    if(r.start > cur) out.push(text.slice(cur, r.start));
    out.push(<mark key={'m'+i} className="hl" data-hl={blockId+':'+r.start+':'+r.end}
      onClick={e => onTapMark(blockId, r, e)}>{text.slice(r.start, r.end)}</mark>);
    cur = r.end;
  });
  if(cur < text.length) out.push(text.slice(cur));
  return out;
}
/* DOM 定位：块内字符偏移 → (节点, 节点内偏移)。mark 内文本视作连续文本 */
function resolveOffset(blockEl, target){
  let acc = 0;
  const walker = document.createTreeWalker(blockEl, NodeFilter.SHOW_TEXT);
  let n;
  while((n = walker.nextNode())){
    const len = n.textContent.length;
    if(target <= acc + len) return {node: n, offset: target - acc};
    acc += len;
  }
  return null;
}
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

/* ======================================================================
   主组件
   ====================================================================== */
function Demo(){
  const [paras, setParas] = useState(PARAS_ORIG);
  const [regenerated, setRegenerated] = useState(false);
  const [highlights, setHighlights] = useState([]);   // {id, blockId, start, end}
  const [notes, setNotes] = useState([]);             // {id, blockId, start, end, body, time}
  const [menu, setMenu] = useState(null);             // {blockId,start,end,cancel,x,y,moreOpen}
  const [sheet, setSheet] = useState(null);           // {editId,blockId,start,end,text,time}
  const [oval, setOval] = useState(null);             // {x,y,items:[noteId]}
  const [toast, setToast] = useState(null);
  const [yellow, setYellow] = useState('#FFF3B0');
  const [iconVariant, setIconVariant] = useState('A');
  const [flagPos, setFlagPos] = useState({});         // noteId -> {left,top}
  const screenRef = useRef(null);
  const scrollRef = useRef(null);
  const seq = useRef(100);

  const say = useCallback(msg => {
    setToast(msg);
    clearTimeout(say.t); say.t = setTimeout(() => setToast(null), 1700);
  }, []);

  /* —— 菜单落位：选区矩形 → 屏内坐标，上放不下翻到下方，两端夹取 —— */
  const placeMenu = useCallback((rect) => {
    const s = screenRef.current.getBoundingClientRect();
    const W = 240, H = 52, M = 8;
    const x = clamp(rect.left + rect.width/2 - W/2 - s.left, M, s.width - W - M);
    let y = rect.top - s.top - H - M;
    if(y < M) y = rect.bottom - s.top + M;
    y = clamp(y, M, s.height - H - M);
    return {x, y};
  }, []);

  /* —— 选区求值：限定单块内，算出块内偏移 —— */
  const evalSelection = useCallback(() => {
    const sel = window.getSelection();
    if(!sel || sel.isCollapsed || sel.rangeCount === 0){ return null; }
    const anchor = sel.anchorNode, focus = sel.focusNode;
    const aEl = (anchor.nodeType === 3 ? anchor.parentElement : anchor);
    const blockEl = aEl && aEl.closest ? aEl.closest('[data-block]') : null;
    if(!blockEl || !screenRef.current.contains(blockEl)) return null;
    const blockId = blockEl.dataset.block;
    const pa = resolveOffset(blockEl, 0); // 触发树构建
    const off = (node, off2) => {
      let acc = 0;
      const walker = document.createTreeWalker(blockEl, NodeFilter.SHOW_TEXT);
      let n;
      while((n = walker.nextNode())){
        if(n === node) return acc + off2;
        acc += n.textContent.length;
      }
      return -1;
    };
    const s1 = off(anchor, sel.anchorOffset), s2 = off(focus, sel.focusOffset);
    if(s1 < 0 || s2 < 0) return null;
    const start = Math.min(s1, s2), end = Math.max(s1, s2);
    if(end <= start) return null;
    const rect = sel.getRangeAt(0).getBoundingClientRect();
    return {blockId, start, end, rect};
  }, []);

  const openMenuFor = useCallback((blockId, start, end, rect) => {
    const cancel = highlights.some(h => h.blockId === blockId && h.start === start && h.end === end);
    const pos = placeMenu(rect);
    setOval(null);
    setMenu({blockId, start, end, cancel, moreOpen: false, ...pos});
  }, [highlights, placeMenu]);

  /* —— 原生选择 → 菜单（模拟长按选中） —— */
  useEffect(() => {
    const onUp = () => setTimeout(() => {
      const r = evalSelection();
      if(r) openMenuFor(r.blockId, r.start, r.end, r.rect);
    }, 0);
    const onScroll = () => { setMenu(null); setOval(null); };
    document.addEventListener('mouseup', onUp);
    const sc = scrollRef.current;
    if(sc) sc.addEventListener('scroll', onScroll);
    return () => { document.removeEventListener('mouseup', onUp); if(sc) sc.removeEventListener('scroll', onScroll); };
  }, [evalSelection, openMenuFor]);

  /* —— 便签图标定位（覆盖层：块右上角语义，随内容定位、不参与排版） —— */
  useLayoutEffect(() => {
    const pos = {};
    notes.forEach(nt => {
      const blockEl = screenRef.current && screenRef.current.querySelector('[data-block="'+nt.blockId+'"]');
      if(!blockEl) return;
      const a = resolveOffset(blockEl, nt.end);
      const b = resolveOffset(blockEl, Math.max(0, nt.end - 1));
      if(!a || !b) return;
      const rg = document.createRange();
      rg.setStart(b.node, b.offset); rg.setEnd(a.node, a.offset);
      const r = rg.getBoundingClientRect(), br = blockEl.getBoundingClientRect();
      pos[nt.id] = {left: r.right - br.left + 1, top: r.top - br.top - 15};
    });
    setFlagPos(pos);
  }, [notes, highlights, paras]);

  /* —— 菜单动作 —— */
  const closeMenu = () => { setMenu(null); window.getSelection().removeAllRanges(); };
  const doHighlight = () => {
    if(!menu) return;
    const {blockId, start, end, cancel} = menu;
    if(cancel){
      setHighlights(list => list.filter(h => !(h.blockId === blockId && h.start === start && h.end === end)));
      say('已取消高亮');
    }else{
      setHighlights(list => mergeRanges(list.filter(h => h.blockId === blockId), start, end)
        .map(h => ({...h, blockId}))
        .concat(list.filter(h => h.blockId !== blockId))
        .map(h => ({...h, id: h.id || ('h' + (++seq.current))})));
      say('已高亮，松手即可继续阅读');
    }
    closeMenu();
  };
  const doAnnotate = () => {
    if(!menu) return;
    const {blockId, start, end} = menu;
    const existed = notes.find(n => n.blockId === blockId && n.start === start && n.end === end);
    if(existed){
      setSheet({editId: existed.id, blockId, start, end, text: existed.body, time: existed.time});
      say('该段已有批注，转入编辑');

      setSheet({editId: null, blockId, start, end, text: '', time: null});

    closeMenu();

  const doFork = () => { say('（Demo）新建主题不跳转'); closeMenu(); };
  const toggleMore = () => {
    if(!menu) return;
    setMenu(current => current ? {...current, moreOpen: !current.moreOpen} : current);
  };
  const doCopy = () => {
    if(!menu) return;
    const blockEl = screenRef.current.querySelector('[data-block="'+menu.blockId+'"]');
    const text = blockEl ? blockEl.textContent.slice(menu.start, menu.end) : '';
    try{ navigator.clipboard && navigator.clipboard.writeText(text); }catch(e){}
    say('已复制所选文字'); closeMenu();
  };
  const doSelectAll = () => {
    if(!menu) return;
    const blockEl = screenRef.current.querySelector('[data-block="'+menu.blockId+'"]');
    if(!blockEl) return;
    const len = blockEl.textContent.length;
    const a = resolveOffset(blockEl, 0), b = resolveOffset(blockEl, len);
    const rg = document.createRange();
    rg.setStart(a.node, a.offset); rg.setEnd(b.node, b.offset);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(rg);
    openMenuFor(menu.blockId, 0, len, rg.getBoundingClientRect());
  };

  /* —— 高亮二次点击：恢复选区 + 菜单切「取消高亮」态。
     仅在「点按」（选区折叠）时触发；拖选途中经过 mark 的松手不算 tap ——
     那次松手已由 mouseup 处理器按真实选区开菜单。 —— */
  const onTapMark = (blockId, r, e) => {
    e.stopPropagation(); e.preventDefault();
    const sel = window.getSelection();
    if(sel && !sel.isCollapsed) return;
    const blockEl = screenRef.current.querySelector('[data-block="'+blockId+'"]');
    const a = resolveOffset(blockEl, r.start), b = resolveOffset(blockEl, r.end);
    const rg = document.createRange();
    rg.setStart(a.node, a.offset); rg.setEnd(b.node, b.offset);
    sel.removeAllRanges(); sel.addRange(rg);
    openMenuFor(blockId, r.start, r.end, rg.getBoundingClientRect());
  };

  /* —— 便签图标点击：同锚点聚簇 —— */
  const onTapFlag = (nt) => {
    const cluster = notes.filter(n => n.blockId === nt.blockId && Math.abs(n.end - nt.end) <= 6);
    if(cluster.length >= 2){
      const p = flagPos[nt.id] || {left: 0, top: 0};
      const s = screenRef.current.getBoundingClientRect();
      const blockEl = screenRef.current.querySelector('[data-block="'+nt.blockId+'"]');
      const br = blockEl.getBoundingClientRect();
      setOval({
        x: clamp(br.left - s.left + p.left - 110, 8, s.width - 264),
        y: clamp(br.top - s.top + p.top + 18, 8, s.height - 190),
        items: cluster.map(n => n.id)
      });
    }else{
      setSheet({editId: nt.id, blockId: nt.blockId, start: nt.start, end: nt.end, text: nt.body, time: nt.time});
    }
  };

  /* —— 弹层动作 —— */
  const saveSheet = () => {
    if(!sheet || !sheet.text.trim()) return;
    if(sheet.editId){
      setNotes(list => list.map(n => n.id === sheet.editId ? {...n, body: sheet.text.trim()} : n));
      say('批注已更新');
    }else{
      setNotes(list => list.concat([{id: 'n' + (++seq.current), blockId: sheet.blockId,
        start: sheet.start, end: sheet.end, body: sheet.text.trim(), time: '刚刚'}]));
      say('已添加批注');
    }
    setSheet(null);
  };
  const deleteSheet = () => {
    if(!sheet || !sheet.editId) return;
    setNotes(list => list.filter(n => n.id !== sheet.editId));

    say('批注已删除');

  /* —— 拍板①演示：重新生成 → 高亮与批注整条清除 —— */
  const regen = () => {
    if(regenerated){
      setParas(PARAS_ORIG); setRegenerated(false);

    }else{
      setParas(PARAS_ALT); setRegenerated(true);
      setHighlights([]); setNotes([]); setMenu(null); setOval(null); setSheet(null);
      say('已重新生成 · 原高亮与批注按拍板清除');
    }
  };

  /* —— 供 CDP 验证脚本驱动（与真实点击共用同一批 handler） —— */
  useEffect(() => {
    window.__demo = {
      selectRange(blockId, start, end){
        const blockEl = screenRef.current.querySelector('[data-block="'+blockId+'"]');
        if(!blockEl) return false;
        const a = resolveOffset(blockEl, start), b = resolveOffset(blockEl, end);
        if(!a || !b) return false;
        const rg = document.createRange();
        rg.setStart(a.node, a.offset); rg.setEnd(b.node, b.offset);
        const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(rg);
        openMenuFor(blockId, start, end, rg.getBoundingClientRect());
        return true;
      },
      tapMenu(action){
        if(!menu) return false;
        ({highlight: doHighlight, annotate: doAnnotate, ask: doAsk, fork: doFork, more: toggleMore,
          copy: doCopy, selectAll: doSelectAll}[action] || (() => {}))();
        return true;
      },
      tapMarkAt(blockId, index){
        const hs = highlights.filter(h => h.blockId === blockId);
        if(!hs[index]) return false;
        const fakeEvent = {stopPropagation(){}, preventDefault(){}};
        onTapMark(blockId, hs[index], fakeEvent);
        return true;
      },
      tapFlag(noteId){
        const nt = notes.find(n => n.id === noteId);
        if(!nt) return false;
        onTapFlag(nt); return true;
      },
      setNoteText(t){ setSheet(s => s ? {...s, text: t} : s); return true; },
      saveSheet(){ saveSheet(); return true; },
      cancelSheet(){ setSheet(null); return true; },
      ovalPick(noteId){ 
        const nt = notes.find(n => n.id === noteId);
        if(!nt) return false;
        setOval(null);
        setSheet({editId: nt.id, blockId: nt.blockId, start: nt.start, end: nt.end, text: nt.body, time: nt.time});
        return true;
      },
      closeOval(){ setOval(null); return true; },
      regen(){ regen(); return true; },
      setYellow(v){ document.documentElement.style.setProperty('--yellow-hl', v); setYellow(v); return true; },
      setIconVariant(v){ setIconVariant(v); return true; },
      state(){
        return {
          highlights: highlights.map(h => ({blockId: h.blockId, start: h.start, end: h.end})),
          notes: notes.map(n => ({blockId: n.blockId, start: n.start, end: n.end, body: n.body, id: n.id})),
          menuOpen: !!menu, menuCancel: menu ? menu.cancel : false, moreOpen: menu ? !!menu.moreOpen : false,
          sheetOpen: !!sheet, sheetEdit: sheet ? sheet.editId : null, sheetText: sheet ? sheet.text : null,
          ovalOpen: !!oval, ovalCount: oval ? oval.items.length : 0,
          yellow, iconVariant, regenerated
        };
      }
    };
  });

  /* —— 渲染 —— */
  const hlOf = bid => highlights.filter(h => h.blockId === bid);
  const ntOf = bid => notes.filter(n => n.blockId === bid);
  const cellIds = [];
  return (
    <div className="stage">
      <aside className="guide">
        <div className="guide-brand">
          <span className="guide-name">知芽</span>
          <span style={{fontSize:11,color:'var(--green-deep)',background:'var(--green-soft)',borderRadius:99,padding:'3px 10px',fontWeight:600,letterSpacing:'.08em'}}>交互 DEMO</span>
        </div>
        <div className="guide-sub">对话页「文本高亮 + 批注」· 方案 V1.1 配套</div>
        <h3>操作路径</h3>
        <ol className="guide-steps">
          <li><b>选中任意文字</b>（鼠标拖选 ≈ 长按拖动），弹出五格主菜单；点「更多」再打开复制/全选子菜单</li>
          <li>点<b>记号笔</b>：黄色高亮落纸；再点一次同段文字试试合并</li>
          <li><b>单击已高亮的文字</b>：自动恢复选区，菜单第三格变成带斜杠的「取消高亮」</li>
          <li>点<b>便签</b>：底部弹层输入批注；保存后选区末尾右上角出现便签角标</li>
          <li>同一段已有批注再点批注 → 转入编辑（不重复建）</li>
          <li>末尾相邻的多条批注：点角标弹<b>横线椭圆列表</b>，点条目进入编辑/删除</li>
          <li><b>表格单元格</b>同样支持选中 → 高亮 → 批注</li>
          <li>右侧「模拟重新生成」：回答一变，高亮与批注<b>整条清除</b>（拍板①）</li>
        </ol>
        <h3>黄色档位（拍板项 D）</h3>
        <div className="tweak">
          <div className="tweak-row">
            {[['#FFF3B0','柔和暖黄'],['#FFE58F','更饱和'],['#FCEFA1','更淡']].map(([hex,name]) => (
              <button key={hex} className={'chip' + (yellow === hex ? ' on' : '')}
                onClick={() => window.__demo.setYellow(hex)}>
                <span className="sw" style={{background:hex}}></span>{name}
              </button>
            ))}

        <h3>记号笔字形（落 Android 前拍板）</h3>

          弹层内按钮是对话框动作钮，不受菜单禁文字约束。全部色值取自 tokens.json，唯一新增即黄色高亮。

              <div className="msg-user">为什么植物正午反而长得慢？</div>

                <div className="ai-tag">

                {BLOCK_ORDER.map((bid, i) => (

                  <span className="grow"></span>
                  <button className="btn-ghost" onClick={() => setSheet(null)}>取消</button>
                  <button className="btn-save" disabled={!sheet.text.trim()} onClick={saveSheet}>保存</button>
                </div>
              </div>
            </React.Fragment>
          )}

          {toast && <div className="toast">{toast}</div>}
        </div>
      </AndroidFrame>
    </div>
  );
}

/* ===== AndroidFrame（huashu-design assets/android_frame.jsx，Pixel 8 规格） ===== */
