// T-2026-10-10-043 isolation init script.
//
// Two independent sources of interference on this machine are neutralised here,
// without editing any repository file:
//
// 1. build dir / project cache — the same Gradle tree has parallel tasks running,
//    so every project's build output is relocated to a private temp root and the
//    project cache is passed on the command line (--project-cache-dir). A run
//    cannot pick up or lock a neighbour's build directory.
//
// 2. a foreign, non-compiling test file — the parallel task T-042
//    (branch-lifecycle-deletion) has left src/test/.../BranchLifecycleEndpointsTest.java
//    in the shared tree mid-flight; it references helpers that do not exist yet and
//    breaks :compileTestJava for the whole source set. It is excluded from THIS run
//    only (the file itself is left untouched). When T-042 lands its helpers, running
//    :test without this script compiles it again.
gradle.allprojects { project ->
    project.layout.buildDirectory =
            new File(System.getProperty('java.io.tmpdir'), 'tl-043-build/' + project.name)
    project.afterEvaluate { evaluated ->
        if (evaluated.plugins.hasPlugin('java')) {
            evaluated.sourceSets.test.java.exclude '**/BranchLifecycleEndpointsTest.java'
        }
    }
}
