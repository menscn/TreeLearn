// T-2026-10-10-042 isolation init script.
//
// The shared Gradle tree may host parallel tasks on this machine, so every
// project's build output is relocated to a private temp root and the project
// cache is passed on the command line (--project-cache-dir). A run cannot pick
// up or lock a neighbour's build directory. No source file is excluded here:
// the T-042 test helpers are landed before this run.
gradle.allprojects { project ->
    project.layout.buildDirectory =
            new File(System.getProperty('java.io.tmpdir'), 'tl-042-build/' + project.name)
}
