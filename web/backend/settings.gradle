pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'treelearn-web-backend'

// Shared pure-JVM modules: single implementation for Android and web,
// referenced through projectDir and never copied.
// Structure guard: web/scripts/check-shared-modules.ps1
include ':core'
project(':core').projectDir = file('../shared/domain')
include ':tree-layout'
project(':tree-layout').projectDir = file('../shared/tree-layout')
include ':ai-protocol'
project(':ai-protocol').projectDir = file('../shared/ai-protocol')