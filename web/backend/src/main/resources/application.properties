spring.application.name=treelearn-web-backend

# Loopback only: the web client must never be reachable from other machines.
server.address=127.0.0.1
server.port=8733

# Release entry (task T-2026-10-10-029): the backend serves the frontend build
# (web/frontend/dist) same-origin. StaticHostingConfiguration owns the /** mapping
# so it can fall back to index.html for SPA routes while keeping /api/** reserved;
# Boot's classpath static mapping is disabled to avoid a second, non-fallbacking
# /** registration competing with it.
spring.web.resources.add-mappings=false