# Treelearn Android build configuration.
# Java-only contract: never add Kotlin plugin flags here.

org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.configuration-cache=false

# AndroidX is required by the instrumentation test stack (androidx.test:runner).
# The shipped app code itself uses zero AndroidX libraries so that no Kotlin
# stdlib can leak into the APK.
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false
