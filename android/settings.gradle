// Treelearn Android — Gradle settings.
// Groovy DSL on purpose: the Kotlin Gradle plugin must never be applied here.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'treelearn'

include ':app'
include ':core'
include ':data'
include ':ai'
include ':tree-layout'
