// :ai — DeepSeek HTTPS/SSE gateway, context encoding, versioned prompt registry.
// Never touches views or the database directly. No user-supplied system templates.
plugins {
    id 'com.android.library'
}

android {
    namespace 'com.treelearn.ai'
    compileSdk 36

    defaultConfig {
        minSdk 28
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkDependencies true
        warningsAsErrors false
    }
}

configurations.configureEach {
    resolutionStrategy {
        force 'androidx.test:monitor:1.6.0'
    }
}

// Convention: every instrumentation test lives in :app's androidTest source set,
// so no other module declares androidTest dependencies.
dependencies {
    implementation project(':core')
    // The portable AI protocol core (prompt encoding, SSE framing, gateway) lives in the shared
    // module web/shared/ai-protocol. api, not implementation: :app references
    // com.treelearn.ai.{prompt,gateway} types through its dependency on :ai, so those classes
    // must remain visible to :ai's consumers. The Android-only pieces (ProviderJson,
    // JsonChatRequestBody, DeepSeekGatewayFactory) stay in this module.
    api project(':ai-protocol')

    testImplementation 'junit:junit:4.13.2'
}
